# 全 Longhorn ボリュームへ RecurringJob `filesystem-trim` を明示的に紐付ける。
#
# RecurringJob の `default` グループだけでは全ボリュームを保証できない。Longhorn が
# `recurring-job-group.longhorn.io/default` を自動付与するのは、recurring job / group の
# ラベルを1つも持たないボリュームだけ（longhorn-manager v1.9.1 datastore の
# labelRecurringJobDefault）。StorageClass の recurringJobSelector 付きで作られたボリュームや、
# default ラベルを外したボリュームは trim の対象から漏れる。
# そのため trim（02:00 UTC）の直前に、job 単位のラベルを全ボリュームへ付け直す。
#
#
# ラベルは PVC → Volume の順に付ける（initContainers → containers の順に直列）:
# 1. label-pvcs:    `recurring-job.longhorn.io/source: enabled` を持つ PVC（全 namespace）へ付ける。
#                   このラベルを持つ PVC のボリュームは、Longhorn が Volume の recurring job ラベルを PVC 側の
#                   内容に合わせて作り直す（v1.9.1 volume_controller の syncPVCRecurringJobLabels。PVC に無い
#                   ラベルは Volume から外される）。Volume にだけ付けても次の reconcile で消えるため、PVC に付ける。
#                   Longhorn 以外の PVC がこのラベルを持っていても、付くのは Longhorn しか読まないラベルだけ。
# 2. label-volumes: 全 Volume へ付ける。source ラベルの無い PVC のボリュームと、PVC を持たないボリュームはこれで
#                   対象になる（この場合 Longhorn は PVC 側のラベルを見ない）。
# PVC は全 namespace にあるため、PVC の権限だけ ClusterRole にしている（get / list / patch）。
#
# 対象外:
# - 02:00 UTC に detached のボリューム。ラベルは付くが trim は走らない（理由は recurring-jobs.yaml）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filesystem-trim-label-sync
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filesystem-trim-label-sync
  namespace: longhorn-system
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filesystem-trim-label-sync
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: filesystem-trim-label-sync
    namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: filesystem-trim-label-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-filesystem-trim-label-sync
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-filesystem-trim-label-sync
subjects:
  - kind: ServiceAccount
    name: filesystem-trim-label-sync
    namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-filesystem-trim-label-sync
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: filesystem-trim-label-sync
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: filesystem-trim-label-sync
spec:
  # RecurringJob `filesystem-trim`（02:00 UTC）の 10 分前。
  schedule: "50 1 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: filesystem-trim-label-sync
        spec:
          restartPolicy: Never
          serviceAccountName: filesystem-trim-label-sync
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: label-pvcs
              # 第三者イメージは digest 固定 (argoproj/argocd-image-updater/imageupdaters/README.md)。
              # このイメージはシェルを持たないため、kubectl を直接実行する。
              image: registry.k8s.io/kubectl:v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
              command: ["/bin/kubectl"]
              # 該当する PVC が無ければ何も変更せず成功する。
              args:
                - --cache-dir=/tmp/kube-cache
                - label
                - persistentvolumeclaims
                - --all-namespaces
                - --selector=recurring-job.longhorn.io/source=enabled
                - --overwrite
                - recurring-job.longhorn.io/filesystem-trim=enabled
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: label-volumes
              image: registry.k8s.io/kubectl:v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
              command: ["/bin/kubectl"]
              args:
                - --namespace=longhorn-system
                - --cache-dir=/tmp/kube-cache
                - label
                - volumes.longhorn.io
                - --all
                - --overwrite
                - recurring-job.longhorn.io/filesystem-trim=enabled
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
