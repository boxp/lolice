# 全 Longhorn ボリュームへ RecurringJob `filesystem-trim` を明示的に紐付ける。
#
# RecurringJob の `default` グループだけでは全ボリュームを保証できない。Longhorn が
# `recurring-job-group.longhorn.io/default` を自動付与するのは、recurring job / group の
# ラベルを1つも持たないボリュームだけ（longhorn-manager v1.9.1 datastore の
# labelRecurringJobDefault）。StorageClass の recurringJobSelector 付きで作られたボリュームや、
# default ラベルを外したボリュームは trim の対象から漏れる。
# そのため trim（02:00 UTC）の直前に、job 単位のラベルを全ボリュームへ付け直す。
#
# 対象外: PVC に `recurring-job.longhorn.io/source: enabled` を付けたボリュームは PVC 側の
# ラベルで上書きされるため、PVC 側にも `recurring-job.longhorn.io/filesystem-trim: enabled` が必要。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filesystem-trim-label-sync
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: filesystem-trim-label-sync
  namespace: longhorn-system
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filesystem-trim-label-sync
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: filesystem-trim-label-sync
    namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: filesystem-trim-label-sync
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: filesystem-trim-label-sync
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: filesystem-trim-label-sync
spec:
  # RecurringJob `filesystem-trim`（02:00 UTC）の 10 分前。
  schedule: "50 1 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: filesystem-trim-label-sync
        spec:
          restartPolicy: Never
          serviceAccountName: filesystem-trim-label-sync
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: label
              # 第三者イメージは digest 固定 (argoproj/argocd-image-updater/imageupdaters/README.md)。
              # このイメージはシェルを持たないため、kubectl を直接実行する。
              image: registry.k8s.io/kubectl:v1.36.5@sha256:0667e3f3e6ef435d7cd4c16684244703ebd67314c17511c2a9f87ea44f6cdf6b
              command: ["/bin/kubectl"]
              args:
                - --namespace=longhorn-system
                - --cache-dir=/tmp/kube-cache
                - label
                - volumes.longhorn.io
                - --all
                - --overwrite
                - recurring-job.longhorn.io/filesystem-trim=enabled
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
