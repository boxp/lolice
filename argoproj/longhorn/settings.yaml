# Longhornフェイルオーバー改善設定
# ノード障害時の自動フェイルオーバーを改善するための設定
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-down-pod-deletion-policy
  namespace: longhorn-system
value: "delete-both-statefulset-and-deployment-pod"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: auto-delete-pod-when-volume-detached-unexpectedly
  namespace: longhorn-system
value: "true"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: detach-manually-attached-volumes-when-cordoned
  namespace: longhorn-system
value: "true"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-soft-anti-affinity
  namespace: longhorn-system
value: "true"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-auto-balance
  namespace: longhorn-system
value: "least-effort"
---
# Orphan PVC自動削除設定
# 孤立したリソースを自動的に削除
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: orphan-resource-auto-deletion
  namespace: longhorn-system
value: "replica-data;instance"
---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: orphan-resource-auto-deletion-grace-period
  namespace: longhorn-system
value: "86400"  # 24時間（秒単位）
---
# filesystem trim の回収対象拡大
# trim 時に volume-head 直前の snapshot チェーン（backup 用 snapshot を含む）を removed 扱いにして領域を回収する
# sync wave 2 にして、filesystem-trim-migration.yaml の Job（wave 1）が成功した後にだけ適用する
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: remove-snapshots-during-filesystem-trim
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
value: "true"
