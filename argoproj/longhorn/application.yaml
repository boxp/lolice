apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: v1.12.2 # BOXP-619: 1 minor ずつ更新する（1.9.1 → 1.10.2 → 1.11.3 → 1.12.2）
      # 反映経路: 下の spec.syncPolicy.automated（prune/selfHeal は false）により、main へのマージで Argo CD が自動 sync する。
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false
          csi:
            kubeletRootDir: /var/lib/kubelet
          defaultSettings:
            defaultReplicaCount: 2
            backupTarget: "s3://boxp-longhorn-backup@ap-northeast-1/"
            backupTargetCredentialSecret: "longhorn-backup-secret"
            taintToleration: "lolice.io/gpu-worker=true:NoSchedule"
          # BOXP-719: バックアップ置き場 (BackupTarget default) の確認間隔を 5 分 (既定 300 秒) から 1 時間へ。
          # S3 の LIST 等の Tier1 リクエスト費用を減らすため。バックアップの頻度・保持・復元対象は変えない。
          # 影響: 新しいバックアップが一覧に出るのが最大 1 時間遅れる。
          # chart 1.8 以降は defaultSettings.backupTarget* ではなく defaultBackupStore が
          # longhorn-default-resource ConfigMap 経由で default BackupTarget を更新する。
          # pollInterval だけ指定すると URL・認証 Secret は既存 BackupTarget の値を引き継ぐ。
          defaultBackupStore:
            pollInterval: 3600
          global:
            storageClass:
              reclaimPolicy: "Retain"
          longhornManager:
            tolerations:
              - key: lolice.io/gpu-worker
                operator: Equal
                value: "true"
                effect: NoSchedule
          longhornDriver:
            tolerations:
              - key: lolice.io/gpu-worker
                operator: Equal
                value: "true"
                effect: NoSchedule
          # BOXP-619: chart 1.12 から networkPolicies.restrictInternalTraffic が既定 true になり、
          # Longhorn 内部向け NetworkPolicy 6 件が作られる。そのままだと monitoring namespace の
          # Prometheus から longhorn-manager :9500 (ServiceMonitor) への scrape が拒否されるため、
          # 版更新では従来どおり NetworkPolicy なしを維持する（有効化は scrape 元の許可設計と別途行う）。
          networkPolicies:
            restrictInternalTraffic: false
          metrics:
            serviceMonitor:
              enabled: true
              additionalLabels:
                # prometheus-k8s の ServiceMonitor opt-in ラベル。
                app.kubernetes.io/part-of: kube-prometheus
    - path: argoproj/longhorn
      repoURL: https://github.com/boxp/lolice
      targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    # Git の変更は自動で sync する。Git から消したリソースの削除 (prune) と、
    # クラスタ側で直接変えた内容の巻き戻し (selfHeal) は自動では行わない。
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - ServerSideApply=true
