# BOXP-692: Prometheus（monitoring/prometheus-k8s-db-prometheus-k8s-0）の volume の副本を、
# golyat-1 内蔵ディスク（Longhorn の 25% 下限まで実余裕 約 30GB）から bulk タグの大容量ディスクへ移す。
# 保持を 60 日・PVC 120Gi にすると実データが約 80〜100GB に増えるため、拡張の前に移しておく。
#
# Longhorn v1.12 は volume の diskSelector を変えても既存副本を動かさず、余った健全副本を消すときも
# selector を考慮しない。そのため次の順で、健全な副本が 2 未満になる時間を作らずに移す:
#   1. volume に diskSelector=[bulk] と一時的な numberOfReplicas=3 を設定する（bulk ディスクに 3 つ目を再構築）。
#   2. bulk ディスク上に「engine から見て RW・healthyAt あり・failedAt なし」の副本が 2 つそろうまで待つ。
#   3. golyat-1 内蔵ディスク上の副本 1 つだけを削除し、numberOfReplicas=2 に戻す。
# 対象副本が既に無ければ（2 回目以降の sync）volume 設定の確認だけで終わる。再構築が 3 時間で終わらない、
# volume が faulted、対象副本が想定外のディスクにある、のいずれかなら副本を削除せずに失敗する。
# 削除できる副本と変更できる volume は Role の resourceNames でこの 1 つずつに限定している。
#
# langfuse-replica-two.yaml と同じく Job は Sync hook（BeforeHookCreation）、ServiceAccount / Role / RoleBinding は
# 通常リソース（wave 0）にして、merge 後の自動 sync で wave 1 の Job が走るようにする。
# hook が失敗すると longhorn の sync が失敗するので、移動の完了を確認したら後続 PR でこのファイルを外す。
#
# registry.k8s.io/kubectl はシェルを持たないため、initContainer で busybox（musl 版、静的リンク）を
# emptyDir にコピーし、そのシェルで手順を実行する。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-replica-move
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-replica-move
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "patch"]
    resourceNames:
      - pvc-385be0a8-13a4-4f2e-b788-40200163f332
  - apiGroups: ["longhorn.io"]
    resources: ["replicas", "engines"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["replicas"]
    verbs: ["delete"]
    resourceNames:
      - pvc-385be0a8-13a4-4f2e-b788-40200163f332-r-359bc466
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-replica-move
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: prometheus-replica-move
    namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-replica-move
---
apiVersion: batch/v1
kind: Job
metadata:
  name: prometheus-replica-move
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: prometheus-replica-move
  annotations:
    argocd.argoproj.io/hook: Sync
    # 次の sync まで Job を残し、ログで結果を確認できるようにする。
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  # 途中で失敗した場合も、自動で再試行せずにログを見て判断する（手順自体は再実行しても安全）。
  backoffLimit: 0
  # 再構築待ち（最大 3 時間）+ 削除後の確認より長くする。
  activeDeadlineSeconds: 12600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-replica-move
    spec:
      restartPolicy: Never
      serviceAccountName: prometheus-replica-move
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-shell
          image: docker.io/library/busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
          command: ["/bin/sh", "-c", "cp /bin/busybox /tools/busybox && /tools/busybox --install -s /tools"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: move
          image: registry.k8s.io/kubectl:v1.37.2@sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
          command: ["/tools/busybox", "sh", "-c"]
          args:
            - |
              set -eu
              VOL=pvc-385be0a8-13a4-4f2e-b788-40200163f332
              OLD=pvc-385be0a8-13a4-4f2e-b788-40200163f332-r-359bc466
              OLD_DISK=0e0e5315-0206-4c5c-9779-c92dac694f8f
              BULK_DISKS=" 75deeea2-b9ea-415a-8ffc-0010bb1d279d 6d9037dd-ea85-410a-9690-612578df1b38 7b87250d-9f7a-430e-bef0-b102bc296402 "
              WAIT_REBUILD_SECONDS=${WAIT_REBUILD_SECONDS:-10800}
              INTERVAL=${INTERVAL:-30}

              k() { ${KUBECTL:-/bin/kubectl} --namespace=longhorn-system --cache-dir=/tmp/kube-cache "$@"; }
              log() { echo "$(date -u +%FT%TZ) $*"; }
              volume_state() { k get volumes.longhorn.io "$VOL" -o jsonpath='{.status.state}|{.status.robustness}|{.spec.numberOfReplicas}|{.spec.diskSelector}'; }
              replicas() {
                k get replicas.longhorn.io -l "longhornvolume=$VOL" \
                  -o jsonpath='{range .items[*]}{.metadata.name}|{.spec.nodeID}|{.spec.diskID}|{.spec.healthyAt}|{.spec.failedAt}|{.status.currentState}{"\n"}{end}'
              }
              # engine から見て RW（読み書き中＝再構築完了）の副本名。
              # kubectl v1.37.2 の JSONPath は map を JSON（{"name":"RW",...}）で出すが、古い版の map[name:RW ...] 形式でも読めるようにする。
              rw_names() {
                k get engines.longhorn.io -l "longhornvolume=$VOL" -o jsonpath='{range .items[*]}{.status.replicaModeMap}{" "}{end}' \
                  | sed 's/: /:/g' | tr -d '"{}' | tr ', ' '\n\n' | sed 's/^map\[//; s/\]$//' | awk -F: '$2 == "RW" { print $1 }'
              }
              # bulk ディスク上にあり、健全（healthyAt あり・failedAt なし・running・engine で RW）な副本の数
              healthy_on_bulk() {
                rw=" $(rw_names | tr '\n' ' ') "
                replicas | awk -F'|' -v bulk="$BULK_DISKS" -v rw="$rw" \
                  'index(bulk, " "$3" ") > 0 && $4 != "" && $5 == "" && $6 == "running" && index(rw, " "$1" ") > 0 { n++ } END { print n + 0 }'
              }
              report() {
                log "volume(state|robustness|numberOfReplicas|diskSelector): $(volume_state)"
                replicas | sed 's/^/  replica(name|node|disk|healthyAt|failedAt|state): /'
                log "engine RW: $(rw_names | tr '\n' ' ')"
              }

              report
              if ! replicas | grep -q "^$OLD|"; then
                log "golyat-1 内蔵ディスク上の副本 $OLD は既に無い。volume 設定の確認だけ行う。"
                k patch volumes.longhorn.io "$VOL" --type=merge -p '{"spec":{"diskSelector":["bulk"],"numberOfReplicas":2}}'
                report
                exit 0
              fi
              if ! replicas | grep -q "^$OLD|golyat-1|$OLD_DISK|"; then
                log "中止: $OLD が想定した golyat-1 内蔵ディスク ($OLD_DISK) 上に無い。"
                exit 1
              fi
              state=$(volume_state)
              case "$state" in
                attached\|healthy\|*|attached\|degraded\|3\|*) ;;
                *) log "中止: volume が attached かつ healthy（再実行時は 3 副本で degraded も可）でない: $state"; exit 1 ;;
              esac
              if [ "$(rw_names | grep -c .)" -lt 2 ]; then
                log "中止: engine で RW の副本が 2 未満。"
                exit 1
              fi

              log "diskSelector=[bulk] と一時的な numberOfReplicas=3 を設定し、bulk ディスク上に副本を追加させる。"
              k patch volumes.longhorn.io "$VOL" --type=merge -p '{"spec":{"diskSelector":["bulk"],"numberOfReplicas":3}}'

              waited=0
              while :; do
                n=$(healthy_on_bulk)
                log "bulk ディスク上の健全副本: $n / 2"
                [ "$n" -ge 2 ] && break
                case "$(volume_state)" in
                  *\|faulted\|*) log "中止: volume が faulted。golyat-1 内蔵副本は削除していない。"; report; exit 1 ;;
                esac
                if [ "$waited" -ge "$WAIT_REBUILD_SECONDS" ]; then
                  log "中止: ${WAIT_REBUILD_SECONDS} 秒待っても再構築が終わらない。golyat-1 内蔵副本は削除していない（3 副本設定のまま）。"
                  report
                  exit 1
                fi
                sleep "$INTERVAL"
                waited=$((waited + INTERVAL))
              done

              report
              log "bulk ディスク上に健全副本が 2 つそろった。golyat-1 内蔵ディスク上の副本 $OLD を削除し、numberOfReplicas=2 に戻す。"
              k delete replicas.longhorn.io "$OLD" --wait=false
              k patch volumes.longhorn.io "$VOL" --type=merge -p '{"spec":{"numberOfReplicas":2}}'

              waited=0
              until ! replicas | grep -q "^$OLD|" && volume_state | grep -q '^attached|healthy|2|'; do
                if [ "$waited" -ge 600 ]; then
                  log "警告: 600 秒以内に副本削除の完了と healthy を確認できなかった。"
                  report
                  exit 1
                fi
                sleep 10
                waited=$((waited + 10))
              done
              log "完了。"
              report
          env:
            - name: PATH
              value: /tools:/bin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tools
              mountPath: /tools
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tools
          emptyDir: {}
