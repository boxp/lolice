# argocd-image-updater の Git write-back 用 GitHub App 認証 (BOXP-265)。
# image-updater の `git:secret:argocd/repo-lolice-github-app` が HTTPS URL のときに
# githubAppID / githubAppInstallationID / githubAppPrivateKey を読む。
# Argo CD の repository 登録ラベルは意図的に付けない: Application の fetch 経路
# (公開 repo を匿名 HTTPS で取得) を変えず、App 認証の影響範囲を write-back に限定する。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secret-repo-lolice-github-app
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: repo-lolice-github-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: githubAppID
      remoteRef:
        key: /lolice/argocd-image-updater/APP_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppInstallationID
      remoteRef:
        key: /lolice/argocd-image-updater/INSTALLATION_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: /lolice/argocd-image-updater/PRIVATE_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
