# BOXP-498: ComfyUI for MiniMax H3 on the single Intel GPU. It only runs inside a
# window opened by the llama/image switcher, which owns the replica count.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Avoid blocking the event loop on DNS during browser origin checks.
      # Both address families must resolve locally to keep the origin check active.
      hostAliases:
        - ip: 127.0.0.1
          hostnames: [comfyui.b0xp.io]
        - ip: "::1"
          hostnames: [comfyui.b0xp.io]
      # Fail fast for other names in this offline pod.
      dnsPolicy: "None"
      dnsConfig:
        nameservers: ["127.0.0.1"]
      priorityClassName: gpu-workload-high
      nodeSelector:
        lolice.io/gpu-worker: "true"
      tolerations:
        - key: lolice.io/gpu-worker
          operator: Equal
          value: "true"
          effect: NoSchedule
      # A prompt that is still running gets time to finish its current node.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
          - 110
      containers:
        - name: comfyui
          image: ghcr.io/boxp/arch/comfyui-xpu:latest
          imagePullPolicy: Always
          # GPU memory (shmem) and process memory are charged to the same 72Gi
          # limit. The default RAM-pressure cache keeps the node outputs of an
          # earlier, different workflow (including its models, about 40GiB on
          # the GPU) until a node of the next job has finished, but the next job
          # first reads its own model files into RAM and is OOM-killed before
          # that point. The classic cache drops outputs that the new prompt does
          # not use when the prompt starts, and still reuses loaders that the
          # two prompts share.
          # History: "--reserve-vram 48" (#1177, #1194) did not prevent this
          # (reproduced 2026-11-12 03:21 UTC with the flag set), because the
          # kill happens before anything is loaded to the GPU.
          args: ["--cache-classic"]
          ports:
            - name: http
              containerPort: 8188
          env:
            - name: ONEAPI_DEVICE_SELECTOR
              value: level_zero:gpu
            - name: ZE_ENABLE_PCI_ID_DEVICE_ORDER
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "3"
              memory: 32Gi
              gpu.intel.com/i915: "1"
            limits:
              cpu: "14"
              # The iGPU allocates from system memory. The node has 93GiB and no
              # swap, so the container is stopped before the node runs short.
              memory: 72Gi
              gpu.intel.com/i915: "1"
          startupProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # Loading a 20GB model can stall the web loop; only a long silence restarts.
          livenessProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 10
          volumeMounts:
            # Only the ComfyUI directory: SD.Next settings and models stay out of reach.
            - name: data
              mountPath: /data
              subPath: comfyui
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sd-webui-data
        - name: scratch
          emptyDir:
            sizeLimit: 20Gi
