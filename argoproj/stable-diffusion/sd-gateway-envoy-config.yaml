apiVersion: v1
kind: ConfigMap
metadata:
  name: sd-admission-gateway-envoy
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: sd_gateway
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 7860
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: sd_gateway
                    normalize_path: true
                    merge_slashes: true
                    stream_idle_timeout: 1800s
                    upgrade_configs:
                      - upgrade_type: websocket
                    route_config:
                      name: sd_gateway
                      virtual_hosts:
                        - name: sd_gateway
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: /
                                headers:
                                  - name: x-sd-route
                                    string_match:
                                      exact: backend
                              route:
                                cluster: sd_backend
                                timeout: 0s
                                idle_timeout: 0s
                            - match:
                                prefix: /
                              route:
                                cluster: sd_intake
                                timeout: 60s
                    http_filters:
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code:
                            inline_string: |
                              function envoy_on_request(handle)
                                local headers = handle:headers()
                                local path = (headers:get(":path") or ""):match("^[^?]*")
                                local method = headers:get(":method")
                                local phase = "unavailable"
                                local ok, value = pcall(function()
                                  local f = io.open("/sd-switch/phase", "r")
                                  if not f then return nil end
                                  local v = f:read(64)
                                  f:close()
                                  return v
                                end)
                                if ok and value then
                                  phase = value:match("^%s*([%a-]+)%s*$") or "unavailable"
                                end
                                local generation = method == "POST" and
                                  (path == "/sdapi/v1/txt2img" or path == "/sdapi/v1/img2img")
                                -- shutdown, restart, interrupt, options and other writes
                                -- never reach SD.Next; the intake answers them with 404.
                                local api_write = path:sub(1, 7) == "/sdapi/" and method ~= "GET"
                                local target = "intake"
                                if phase == "image-ready" and path:sub(1, 6) ~= "/__sd/" and not generation and not api_write then
                                  target = "backend"
                                end
                                -- Always overwritten, so a client cannot choose the route.
                                headers:replace("x-sd-route", target)
                                handle:clearRouteCache()
                              end
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: sd_intake
          connect_timeout: 1s
          type: STATIC
          load_assignment:
            cluster_name: sd_intake
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8090
        - name: sd_backend
          connect_timeout: 5s
          type: STRICT_DNS
          load_assignment:
            cluster_name: sd_backend
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: stable-diffusion-webui-backend.stable-diffusion.svc.cluster.local
                          port_value: 7860
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9903
