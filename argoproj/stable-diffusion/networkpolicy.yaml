apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: stable-diffusion-webui
spec:
  selector: app == 'stable-diffusion-webui'
  types:
    - Ingress
    - Egress
  ingress:
    # BOXP-484: only the gateway and the switcher reach SD.Next directly.
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == 'stable-diffusion'
        selector: app == 'sd-admission-gateway'
      destination:
        ports:
          - 7860
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == 'local-llm'
        selector: app == 'qwen-runtime-controller'
      destination:
        ports:
          - 7860
  egress:
    - action: Allow
      protocol: UDP
      destination:
        selector: k8s-app == 'kube-dns'
        namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        selector: k8s-app == 'kube-dns'
        namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 80
          - 443

