apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen-runtime-controller
  namespace: stable-diffusion
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [qwen-image-eval]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen-runtime-controller
  namespace: stable-diffusion
subjects:
  - kind: ServiceAccount
    name: qwen-runtime-controller
    namespace: local-llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen-runtime-controller
