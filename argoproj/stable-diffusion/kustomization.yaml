apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stable-diffusion

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - cloudflared-deployment.yaml
  - external-secret.yaml
  - networkpolicy.yaml
  - qwen-image-eval-deployment.yaml
  - qwen-image-eval-networkpolicy.yaml
  - runtime-authorization.yaml
  - sd-gateway-envoy-config.yaml
  - sd-gateway-deployment.yaml
  - sd-gateway-networkpolicy.yaml
  - comfyui-deployment.yaml
  - comfyui-service.yaml
  - comfyui-networkpolicy.yaml
  - comfyui-gateway-envoy-config.yaml
  - comfyui-gateway-deployment.yaml

configMapGenerator:
  - name: sd-intake-code
    files:
      - sd_intake.py
  - name: comfy-intake-code
    files:
      - comfy_intake.py
