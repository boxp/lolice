alloy:
  configMap:
    create: false
    name: alloy-config
    key: config.alloy
  mounts:
    varlog: true
controller:
  type: daemonset
  tolerations:
    - effect: NoSchedule
      operator: Exists
  nodeSelector: {}
# The chart's ServiceMonitor is disabled on purpose: it is always labelled
# app.kubernetes.io/part-of=alloy, which Prometheus (kube-prometheus,
# serviceMonitorSelector part-of=kube-prometheus) does not select, and
# serviceMonitor.additionalLabels cannot override that key without producing a
# duplicate YAML key. See ../servicemonitor.yaml instead.
serviceMonitor:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
