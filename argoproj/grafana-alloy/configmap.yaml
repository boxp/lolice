apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // Discover Kubernetes pods for log collection
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Relabel discovered pods to extract metadata
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Keep only running pods
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed|Unknown"
        action        = "drop"
      }

      // Keep only pods scheduled on this node. Each Alloy DaemonSet replica only
      // has the local node's /var/log mounted.
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = env("HOSTNAME")
        action        = "keep"
      }

      // Set namespace label
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Set pod name label
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Set container name label
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Set node name label
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      // Set app label from pod label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      // Set app.kubernetes.io/name label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app_kubernetes_io_name"
      }

      // Set job label from namespace/pod
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
        separator     = "/"
        target_label  = "job"
      }

      // Set the log file glob. /var/log/containers holds
      // <pod>_<namespace>_<container>-<container-id>.log symlinks, so the
      // container id is matched with a wildcard. The glob is expanded by
      // local.file_match below; loki.source.file itself only accepts
      // absolute file paths and silently tails nothing when given a glob
      // (this was the root cause of BOXP-254: no logs reached Loki since
      // 2026-07-04).
      rule {
        source_labels = ["__meta_kubernetes_pod_name", "__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "_"
        target_label  = "__path__"
        replacement   = "/var/log/containers/$1-*.log"
      }
    }

    // Expand the __path__ globs into the concrete files that currently exist
    // on this node. Labels from discovery.relabel are carried over to each
    // matched file.
    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    // Collect logs from local node log files. Avoid using the Kubernetes
    // pods/log API from every DaemonSet replica.
    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    // Process logs before sending to Loki
    loki.process "pods" {
      forward_to = [loki.write.default.receiver]

      // Parse container runtime format (CRI)
      stage.cri {}

      // Drop empty log lines
      stage.drop {
        drop_counter_reason = "empty_line"
        expression          = "^\\s*$"
      }
    }

    // Send logs to Loki
    loki.write "default" {
      endpoint {
        url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
      }
    }
