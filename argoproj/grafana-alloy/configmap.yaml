apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // Discover Kubernetes pods for log collection
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Relabel discovered pods to extract metadata
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // Keep only running pods
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed|Unknown"
        action        = "drop"
      }

      // Keep only pods scheduled on this node. Each Alloy DaemonSet replica only
      // has the local node's /var/log mounted.
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = sys.env("HOSTNAME")
        action        = "keep"
      }

      // Set namespace label
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Set pod name label
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Set container name label
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Set node name label
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }

      // Set app label from pod label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      // Set app.kubernetes.io/name label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app_kubernetes_io_name"
      }

      // Set job label from namespace/pod
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
        separator     = "/"
        target_label  = "job"
      }

      // Set the log file glob. /var/log/containers holds
      // <pod>_<namespace>_<container>-<container-id>.log symlinks, so the
      // container id is matched with a wildcard. The glob is expanded by
      // local.file_match below; loki.source.file itself only accepts
      // absolute file paths and silently tails nothing when given a glob
      // (this was the root cause of BOXP-254: no logs reached Loki since
      // 2026-07-04).
      rule {
        source_labels = ["__meta_kubernetes_pod_name", "__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "_"
        target_label  = "__path__"
        replacement   = "/var/log/containers/$1-*.log"
      }
    }

    // Expand the __path__ globs into the concrete files that currently exist
    // on this node. Labels from discovery.relabel are carried over to each
    // matched file.
    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    // Collect logs from local node log files. Avoid using the Kubernetes
    // pods/log API from every DaemonSet replica.
    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    // Process logs before sending to Loki
    loki.process "pods" {
      forward_to = [loki.write.default.receiver]

      // Parse container runtime format (CRI)
      stage.cri {}

      // Drop empty log lines
      stage.drop {
        drop_counter_reason = "empty_line"
        expression          = "^\\s*$"
      }

      // BEGIN BOXP-721 dns-redaction
      // agent 専用 DNS resolver の query log。DNS 名にも秘密が混ざりうる前提で、
      // "." と空白を含まない 24 文字以上の連続を長さだけ残して伏字にする。
      // 仕様: Obsidian Projects/agent-egress-audit/spec.md
      stage.match {
        selector = "{namespace=\"agent-egress-audit\", container=\"coredns\"}"

        stage.replace {
          expression = "([^\\s.]{24,})"
          replace    = "<redacted-label-len={{ len .Value }}>"
        }

        stage.metrics {
          metric.counter {
            name        = "agent_egress_dns_log_lines_total"
            description = "BOXP-721: agent DNS audit log lines forwarded to Loki"
            match_all   = true
            action      = "inc"
          }
        }
      }
      // END BOXP-721 dns-redaction
    }

    // BOXP-721: agent Pod の cluster 外宛て新規接続（Calico NetworkPolicy の
    // action: Log が出す kernel log、prefix "calico-packet:"）をノードの rsyslog 出力
    // /var/log/kern.log から読む。本文は含まれない（IP/TCP ヘッダ値のみ）。
    // loki.source.journal は journal ディレクトリが無いノードで設定全体の評価に失敗し
    // 全ログ収集が止まるため使わない。local.file_match はファイルが無ければ target 0 件で済む。
    // BEGIN BOXP-721 conn-source
    local.file_match "agent_egress_conn" {
      path_targets = [{"__path__" = "/var/log/kern.log", "job" = "agent-egress-audit/conn"}]
    }

    loki.source.file "agent_egress_conn" {
      targets       = local.file_match.agent_egress_conn.targets
      forward_to    = [loki.process.agent_egress_conn.receiver]
      tail_from_end = true
    }
    // END BOXP-721 conn-source

    // BOXP-726: /var/log/kern.log が無いノード（golyat-1）だけ、同じ kernel log を
    // ノードの journal から読む。対応表に無いノードは journal の無い /etc/alloy を
    // 指して何も読まない（kern.log と二重に記録しないため）。
    // - path を空にすると Alloy コンテナの machine-id がホストと違うためホストの journal を読めない。
    // - "/var/log/journal" を全ノードで指すと、journal が無いノードで設定の読込全体が失敗する。
    // 取り込むのは kernel の行（_TRANSPORT=kernel）の MESSAGE だけで、label は job と
    // （conn-filter で付く）node のみ。max_age 内の過去分も読むので欠測分を後から埋める。
    // BEGIN BOXP-726 conn-journal
    loki.source.journal "agent_egress_conn" {
      path       = coalesce({"golyat-1" = "/var/log/journal"}[sys.env("HOSTNAME")], "/etc/alloy")
      matches    = "_TRANSPORT=kernel"
      max_age    = "12h"
      labels     = {job = "agent-egress-audit/conn"}
      forward_to = [loki.process.agent_egress_conn.receiver]
    }
    // END BOXP-726 conn-journal

    loki.process "agent_egress_conn" {
      forward_to = [loki.write.default.receiver]

      // BEGIN BOXP-721 conn-filter
      stage.match {
        selector = "{job=\"agent-egress-audit/conn\"} !~ \"calico-packet:\""
        action   = "drop"
        drop_counter_reason = "not_calico_packet"
      }

      stage.static_labels {
        values = {
          node = sys.env("HOSTNAME"),
        }
      }

      stage.metrics {
        metric.counter {
          name        = "agent_egress_conn_log_lines_total"
          description = "BOXP-721: agent egress connection log lines forwarded to Loki"
          match_all   = true
          action      = "inc"
        }
      }
      // END BOXP-721 conn-filter
    }

    // Send logs to Loki
    loki.write "default" {
      endpoint {
        url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
      }
    }
