apiVersion: v1
kind: Service
metadata:
  name: even-g2-main
  namespace: even-g2-lab
spec:
  type: ClusterIP
  # BOXP-318: pinned because WARP clients reach this Service through a
  # Cloudflare tunnel CIDR route to this exact IP (boxp/arch
  # terraform/cloudflare/b0xp.io/even-g2-lab/tunnel.tf). Keep in sync.
  clusterIP: 10.104.181.159
  selector:
    app: even-g2-main
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
