# BOXP-657: 眼鏡の入口（even-g2-main の kohako-bff）が家の BFF を呼ぶ時に「G2 の Pod であること」を示すための専用 ServiceAccount。
# RBAC は何も付けない。既定の token は載せず、kohako-bff の container にだけ audience kohako-bff-g2 の短命 token を載せる。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kohako-g2-bff
  namespace: even-g2-lab
automountServiceAccountToken: false
