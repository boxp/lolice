apiVersion: apps/v1
kind: Deployment
metadata:
  name: even-g2-main
  namespace: even-g2-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: even-g2-main
  template:
    metadata:
      labels:
        app: even-g2-main
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: web
          image: 839695154978.dkr.ecr.ap-northeast-1.amazonaws.com/even-g2-client-main:bootstrap
          ports:
            - name: http
              containerPort: 8080
            # BOXP-328: Kohako G2 listener for the published HTTPS route only.
            - name: kohako-web
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        # BOXP-329: Kohako G2 BFF. Same image as web; listens on 127.0.0.1 only so it
        # is reachable just through nginx :8081 /kohako/api/v1/ (published route).
        # It verifies the Cloudflare Access JWT on every request; none of these
        # values is a secret (the AUD is public in Access responses and the Owner
        # email is already in boxp/arch terraform/cloudflare/b0xp.io/even-g2-lab).
        - name: kohako-bff
          image: 839695154978.dkr.ecr.ap-northeast-1.amazonaws.com/even-g2-client-main:bootstrap
          command:
            - node
            - /opt/kohako-bff/server.js
          env:
            - name: KOHAKO_ACCESS_TEAM_DOMAIN
              value: https://boxp.cloudflareaccess.com
            - name: KOHAKO_ACCESS_AUD
              value: c98ec040b98358a12ac478984c00ded11e85e9336f2acb768c5f772351fbcbcb
            - name: KOHAKO_OWNER_EMAILS
              value: tiyotiyouda@gmail.com
            - name: KOHAKO_BOARD_URL
              value: http://codex-task-board-kohako.codex-workspace.svc.cluster.local:8090/api/kohako/board
            # BOXP-332: real Hermes conversation through the internal API server.
            # The key stays in this sidecar (web container and device never see it).
            - name: KOHAKO_HERMES_URL
              value: http://hermes-agent-api.hermes-agent.svc.cluster.local:8642
            - name: KOHAKO_HERMES_KEY
              valueFrom:
                secretKeyRef:
                  name: kohako-hermes-api-key
                  key: key
            # BOXP-332: G2 reads the Owner's own Telegram DM (read-only, official
            # /api/sessions API) as shared context. Only this Telegram user's open
            # session is read; nothing is posted to Telegram.
            - name: KOHAKO_SHARED_CONTEXT
              value: telegram-dm
            - name: KOHAKO_TELEGRAM_USER_ID
              value: "8202126858"
            # Suggestion candidates only: light model on the existing openai-codex
            # subscription (no new provider/credential). The conversation itself
            # keeps the Hermes default model.
            - name: KOHAKO_CANDIDATE_PROVIDER
              value: openai-codex
            - name: KOHAKO_CANDIDATE_MODEL
              value: gpt-5.6-luna
            - name: KOHAKO_BFF_HOST
              value: 127.0.0.1
            - name: KOHAKO_BFF_PORT
              value: "8787"
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:8787/healthz
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
