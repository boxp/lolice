apiVersion: apps/v1
kind: Deployment
metadata:
  name: even-g2-main
  namespace: even-g2-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: even-g2-main
  template:
    metadata:
      labels:
        app: even-g2-main
    spec:
      # BOXP-657: 専用 ServiceAccount。既定の token は載せない（kohako-bff だけが下の projected token を持つ）。
      serviceAccountName: kohako-g2-bff
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: regcred
      containers:
        - name: web
          image: 839695154978.dkr.ecr.ap-northeast-1.amazonaws.com/even-g2-client-main:bootstrap
          ports:
            - name: http
              containerPort: 8080
            # BOXP-328: Kohako G2 listener for the published HTTPS route only.
            - name: kohako-web
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        # BOXP-329: Kohako G2 BFF. Same image as web; listens on 127.0.0.1 only so it
        # is reachable just through nginx :8081 /kohako/api/v1/ (published route).
        # It verifies the Cloudflare Access JWT on every request; none of these
        # values is a secret (the AUD is public in Access responses and the Owner
        # email is already in boxp/arch terraform/cloudflare/b0xp.io/even-g2-lab).
        - name: kohako-bff
          image: 839695154978.dkr.ecr.ap-northeast-1.amazonaws.com/even-g2-client-main:bootstrap
          command:
            - node
            - /opt/kohako-bff/server.js
          env:
            - name: KOHAKO_ACCESS_TEAM_DOMAIN
              value: https://boxp.cloudflareaccess.com
            - name: KOHAKO_ACCESS_AUD
              value: c98ec040b98358a12ac478984c00ded11e85e9336f2acb768c5f772351fbcbcb,8a7b87fcb927ca37ef303bdc5c00e47be29992509a267984e194f814d8b5e710
            - name: KOHAKO_OWNER_EMAILS
              value: tiyotiyouda@gmail.com
            - name: KOHAKO_BOARD_URL
              value: http://codex-task-board-kohako.codex-workspace.svc.cluster.local:8090/api/kohako/board
            # BOXP-332: real Hermes conversation through the internal API server.
            # The key stays in this sidecar (web container and device never see it).
            - name: KOHAKO_HERMES_URL
              value: http://hermes-agent-api.hermes-agent.svc.cluster.local:8642
            # BOXP-332 (M5): in-cluster whisper.cpp (deployment-kohako-stt.yaml). Unset = voice disabled.
            - name: KOHAKO_STT_URL
              value: http://kohako-stt.even-g2-lab.svc.cluster.local:8080
            - name: KOHAKO_HERMES_KEY
              valueFrom:
                secretKeyRef:
                  name: kohako-hermes-api-key
                  key: key
            # BOXP-332: G2 reads the Owner's own Telegram DM (read-only, official
            # /api/sessions API) as shared context. Only this Telegram user's open
            # session is read; nothing is posted to Telegram.
            - name: KOHAKO_SHARED_CONTEXT
              value: telegram-dm
            - name: KOHAKO_TELEGRAM_USER_ID
              value: "8202126858"
            # BOXP-653: G2 also reads the Owner's own recent kohako-home turns
            # (read-only, same /api/sessions API and key as above) as untrusted
            # reference. No new egress, credential or write path; nothing is
            # posted to the home session.
            - name: KOHAKO_HOME_CONTEXT
              value: recent
            # Suggestion candidates only: light model on the existing openai-codex
            # subscription (no new provider/credential). The conversation itself
            # keeps the Hermes default model.
            - name: KOHAKO_CANDIDATE_PROVIDER
              value: openai-codex
            - name: KOHAKO_CANDIDATE_MODEL
              value: gpt-5.6-luna
            # BOXP-503: exact /v1/toolsets match; the kohako-g2-context gate
            # still restricts G2 to its existing allowlist and approval rules.
            - name: KOHAKO_HERMES_TOOLSETS
              value: browser,code_execution,connections,cronjob,delegation,file,memory,session_search,skills,terminal,todo,vision,web
            # BOXP-387: opt-in realtime voice pilot. The BFF mints a short-lived OpenAI
            # Realtime client secret through the Hermes kohako-g2-realtime plugin
            # (openai-codex subscription sign-in, no API key) and relays G2 audio to
            # api.openai.com over the existing public-443 egress. One session at a time,
            # BOXP-407: no application duration limit, 6 starts per hour; nothing is stored.
            - name: KOHAKO_REALTIME
              value: "1"
            - name: KOHAKO_REALTIME_ORIGIN
              value: https://kohako-g2.b0xp.io,https://kohako-g2-trial.b0xp.io
            - name: KOHAKO_REALTIME_MAX_MS
              value: "unlimited"
            # BOXP-657 段2: 送信・状態・停止・許可・リアルタイムの委任も家の BFF（会話・履歴の正本）へ渡す（on）。
            # on の間は上の KOHAKO_HOME_CONTEXT を読まない（家と同じ会話になるので参照が要らない）。
            # read に戻すと段1（共有履歴を読むだけ・送信は今までの kohako-g2-* session）、外すと入口ごと無効。
            # 戻す時は kohako-studio の KOHAKO_G2_MODE も read に戻す。家の履歴と受信箱はどちらでも失われない。
            - name: KOHAKO_SHARED_BACKEND
              value: "on"
            - name: KOHAKO_SHARED_BACKEND_URL
              value: http://kohako-studio-bff.kohako-studio.svc.cluster.local:8787
            - name: KOHAKO_SHARED_BACKEND_TOKEN_FILE
              value: /var/run/secrets/kohako-home/token
            - name: KOHAKO_BFF_HOST
              value: 127.0.0.1
            - name: KOHAKO_BFF_PORT
              value: "8787"
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:8787/healthz
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # BOXP-657: 家の BFF（kohako-studio 8787）を呼ぶ時の資格。nginx（web）の container には載せない。
          volumeMounts:
            - name: kohako-home-token
              mountPath: /var/run/secrets/kohako-home
              readOnly: true
      volumes:
        # audience kohako-bff-g2 専用・10 分で切れ、kubelet が自動で更新する。Kubernetes API には使えない。
        - name: kohako-home-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  audience: kohako-bff-g2
                  expirationSeconds: 600
                  path: token
