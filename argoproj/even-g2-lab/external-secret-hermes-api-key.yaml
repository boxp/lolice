# BOXP-332: Hermes API_SERVER_KEY for the kohako-bff sidecar only. Same value as
# hermes-agent/external-secret-api-server-key.yaml, read through the ESO
# Kubernetes provider (Role in hermes-agent limits it to that one Secret).
# Never mounted into the web container and never sent to the G2 device.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kohako-api-server-key-reader
  annotations:
    # BOXP-332: create the key before the Deployment that references it.
    argocd.argoproj.io/sync-wave: "-1"
  namespace: even-g2-lab
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: hermes-agent-api-server-key
  annotations:
    # BOXP-332: create the key before the Deployment that references it.
    argocd.argoproj.io/sync-wave: "-1"
  namespace: even-g2-lab
spec:
  provider:
    kubernetes:
      remoteNamespace: hermes-agent
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: kohako-api-server-key-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kohako-hermes-api-key
  annotations:
    # BOXP-332: create the key before the Deployment that references it.
    argocd.argoproj.io/sync-wave: "-1"
  namespace: even-g2-lab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hermes-agent-api-server-key
    kind: SecretStore
  target:
    name: kohako-hermes-api-key
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: hermes-agent-api-server-key
        property: password
