apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      targetRevision: 2.13.0
      chart: external-secrets
    - repoURL: https://github.com/boxp/lolice.git
      targetRevision: main
      path: argoproj/external-secrets-operator/manifests
  destination:
    server: 'https://kubernetes.default.svc' 
    namespace: external-secrets 
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      # ESO chart 0.20.4 以降、secretstores / clustersecretstores CRD は 256 KiB を超え、
      # client-side apply が書く kubectl.kubernetes.io/last-applied-configuration annotation の
      # 上限 (262144 B) に収まらず "metadata.annotations: Too long" で Sync が失敗する。
      # upstream も SSA 必須と明記しているため Server-Side Apply で適用する (BOXP-256)。
      - ServerSideApply=true
