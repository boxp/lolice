apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-dns
  labels:
    app: agent-dns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-dns
  template:
    metadata:
      labels:
        app: agent-dns
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # kube-dns と同じ control-plane ノードに置く。registry.k8s.io の一部 IP が Pod CIDR
      # (192.178.0.0/16) と重なり pull に失敗しうるため、image が既にある node を使う。
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: agent-dns
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.14.6
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns
              containerPort: 1053
              protocol: UDP
            - name: dns-tcp
              containerPort: 1053
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # image の /coredns には file capability (cap_net_bind_service) が付いており、
              # これを許可しないと no_new_privs 下で exec が EPERM になる（kube-dns と同じ設定）。
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          volumeMounts:
            - name: corefile
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: corefile
          configMap:
            name: agent-dns-corefile
