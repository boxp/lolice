apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-egress-audit
  namespace: argocd
spec:
  destination:
    namespace: agent-egress-audit
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: argoproj/agent-egress-audit
      repoURL: https://github.com/boxp/lolice
      targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
