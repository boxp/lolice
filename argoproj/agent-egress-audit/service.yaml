# agent Pod の dnsConfig から固定 IP で参照するため clusterIP を固定する。
apiVersion: v1
kind: Service
metadata:
  name: agent-dns
  labels:
    app: agent-dns
spec:
  clusterIP: 10.96.0.53
  selector:
    app: agent-dns
  ports:
    - name: dns
      port: 53
      targetPort: 1053
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 1053
      protocol: TCP
    - name: metrics
      port: 9153
      targetPort: 9153
      protocol: TCP
