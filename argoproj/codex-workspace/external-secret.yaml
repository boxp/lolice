---
# BOXP-270: same HMAC secret as hermes-agent/external-secret-task-board-webhook.yaml,
# read through the Kubernetes provider (Role in hermes-agent limits it to that
# one Secret). Consumed by the task-board-event-dispatcher sidecar.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: hermes-agent-task-board-webhook
  namespace: codex-workspace
spec:
  provider:
    kubernetes:
      remoteNamespace: hermes-agent
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: task-board-webhook-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codex-workspace-task-board-webhook
  namespace: codex-workspace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hermes-agent-task-board-webhook
    kind: SecretStore
  target:
    name: codex-workspace-task-board-webhook
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: hermes-agent-task-board-webhook
        property: password
