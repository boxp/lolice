apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codex-workspace-even-terminal
  namespace: codex-workspace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: codex-workspace-even-terminal
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /lolice/codex-workspace/even-terminal-token
---
