# BOXP-428: Langfuse ingest key for the Task Board exporter, read through the ESO
# Kubernetes provider. The Role in the langfuse namespace limits it to this one Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse-ingest-key-reader
  namespace: codex-workspace
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: langfuse-ingest-key
  namespace: codex-workspace
spec:
  provider:
    kubernetes:
      remoteNamespace: langfuse
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: langfuse-ingest-key-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-ingest-key
  namespace: codex-workspace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: langfuse-ingest-key
    kind: SecretStore
  target:
    name: langfuse-ingest-key
    creationPolicy: Owner
  data:
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: langfuse-ingest-key
        property: LANGFUSE_PUBLIC_KEY
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: langfuse-ingest-key
        property: LANGFUSE_SECRET_KEY
