apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - service-account.yaml
  - rbac.yaml
  - storageclass.yaml
  - pvc.yaml
  - configmap.yaml
  - kubeconfig.yaml
  - dashboard-configmap.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - dashboard-service.yaml
  - service-kohako-board.yaml
  - networkpolicy.yaml
  - service-ai-ops-metrics.yaml
  - servicemonitor-ai-ops-metrics.yaml

configMapGenerator:
  - name: codex-workspace-ai-ops-metrics
    files:
      - ai-ops-metrics/server.py
