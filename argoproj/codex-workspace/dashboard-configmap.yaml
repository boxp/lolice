apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-task-board-dashboard
  namespace: codex-workspace
data:
  server.py: |
    #!/usr/bin/env python3
    import json
    import os
    import re
    import threading
    import time
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path
    from urllib.parse import parse_qs, unquote, urlparse

    BOARD_ROOT = Path(os.environ.get("TASK_BOARD_ROOT", "/home/boxp/.codex-task-board")).resolve()
    APP_ROOT = Path(os.environ.get("APP_ROOT", "/app")).resolve()
    RUNS_ROOT = (BOARD_ROOT / "runs").resolve()
    LOCKS_ROOT = (BOARD_ROOT / "locks").resolve()
    LOG_FILES = ("events.jsonl", "stderr.log", "last-message.md")
    MAX_LOG_BYTES = int(os.environ.get("DASHBOARD_MAX_LOG_BYTES", str(256 * 1024)))
    RECENT_LIMIT = int(os.environ.get("DASHBOARD_RECENT_LIMIT", "80"))
    KOHAKO_VAULT_ROOT = os.environ.get("KOHAKO_VAULT_ROOT", "/home/boxp/Documents/obsidian-headless/BOXP")

    import kohako_board

    def utc_now_iso():
      return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

    def safe_child(root, *parts):
      target = root.joinpath(*parts).resolve()
      if target != root and root not in target.parents:
        raise ValueError("path escapes root")
      return target

    def stat_iso(path):
      try:
        return datetime.fromtimestamp(path.stat().st_mtime, timezone.utc).isoformat().replace("+00:00", "Z")
      except FileNotFoundError:
        return None

    def read_text(path, limit=64 * 1024):
      try:
        with path.open("rb") as f:
          data = f.read(limit + 1)
      except FileNotFoundError:
        return ""
      if len(data) > limit:
        data = data[:limit]
      return data.decode("utf-8", errors="replace")

    def parse_edn_summary(text):
      result = {}
      for key in ("agent", "lane", "status", "result", "action", "ticket", "run-id", "exit-code", "updated-at", "finished-at", "started-at", "heartbeat-at", "host", "pid"):
        match = re.search(r":" + re.escape(key) + r'\s+("[^"]*"|:[\w.-]+|-?\d+)', text)
        if not match:
          continue
        value = match.group(1)
        if value.startswith('"') and value.endswith('"'):
          value = value[1:-1]
        elif value.startswith(":"):
          value = value[1:]
        else:
          try:
            value = int(value)
          except ValueError:
            pass
        result[key] = value
      return result

    def parse_event_line(line):
      line = line.strip()
      if not line:
        return {}
      try:
        value = json.loads(line)
        return value if isinstance(value, dict) else {}
      except json.JSONDecodeError:
        return {}

    def event_info(run_dir):
      events_path = run_dir / "events.jsonl"
      started_at = None
      last_event_at = None
      event_count = 0
      action = None
      result = None
      status = None
      try:
        with events_path.open("r", encoding="utf-8", errors="replace") as f:
          for line in f:
            event = parse_event_line(line)
            if not event:
              continue
            event_count += 1
            ts = event.get("at") or event.get("timestamp") or event.get("time")
            if ts and not started_at:
              started_at = ts
            if ts:
              last_event_at = ts
            action = event.get("action", action)
            result = event.get("result", result)
            status = event.get("status", status)
      except FileNotFoundError:
        pass
      return {
        "startedAt": started_at,
        "lastEventAt": last_event_at,
        "eventCount": event_count,
        "action": action,
        "result": result,
        "eventStatus": status,
      }

    def lock_index():
      locks = {}
      if not LOCKS_ROOT.exists():
        return locks
      for lock in LOCKS_ROOT.glob("*.edn"):
        ticket = lock.stem
        locks[ticket] = {
          "path": str(lock),
          "mtime": stat_iso(lock),
          "summary": parse_edn_summary(read_text(lock, 32 * 1024)),
        }
      return locks

    def run_status(summary, has_lock):
      if has_lock:
        return "running"
      status = summary.get("status")
      result = summary.get("result")
      exit_code = summary.get("exit-code")
      if status == "blocked" or result == "blocked":
        return "blocked"
      if status in ("failed", "error") or result in ("failed", "error"):
        return "failed"
      if isinstance(exit_code, int) and exit_code != 0:
        return "failed"
      if status in ("succeeded", "complete", "finished") or result in ("ready", "done", "review"):
        return "finished"
      if (RUNS_ROOT / str(summary.get("ticket", ""))).exists() and exit_code == 0:
        return "finished"
      return "unknown"

    def run_record(ticket_dir, run_dir, locks):
      ticket = ticket_dir.name
      run_id = run_dir.name
      summary_path = run_dir / "summary.edn"
      summary = parse_edn_summary(read_text(summary_path))
      events = event_info(run_dir)
      mtimes = [run_dir.stat().st_mtime]
      available_logs = []
      for name in LOG_FILES:
        path = run_dir / name
        if path.exists():
          available_logs.append({
            "name": name,
            "bytes": path.stat().st_size,
            "updatedAt": stat_iso(path),
          })
          mtimes.append(path.stat().st_mtime)
      if summary_path.exists():
        mtimes.append(summary_path.stat().st_mtime)
      updated_at = summary.get("updated-at") or datetime.fromtimestamp(max(mtimes), timezone.utc).isoformat().replace("+00:00", "Z")
      lock_summary = locks.get(ticket, {}).get("summary", {})
      has_lock = ticket in locks and lock_summary.get("run-id") == run_id
      if has_lock and lock_summary.get("heartbeat-at"):
        updated_at = lock_summary["heartbeat-at"]
      started_at = events["startedAt"] or lock_summary.get("started-at") or parse_run_id_time(run_id)
      return {
        "ticket": ticket,
        "runId": run_id,
        "agent": summary.get("agent") or lock_summary.get("agent"),
        "lane": summary.get("lane") or lock_summary.get("lane") or "unknown",
        "action": summary.get("action") or events["action"],
        "status": run_status(summary, has_lock),
        "result": summary.get("result") or events["result"],
        "exitCode": summary.get("exit-code"),
        "startedAt": started_at,
        "updatedAt": updated_at,
        "finishedAt": summary.get("finished-at"),
        "locked": has_lock,
        "host": lock_summary.get("host"),
        "pid": lock_summary.get("pid"),
        "eventCount": events["eventCount"],
        "logs": available_logs,
      }

    def parse_run_id_time(run_id):
      try:
        value = datetime.strptime(run_id, "%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc)
        return value.isoformat().replace("+00:00", "Z")
      except ValueError:
        return None

    def list_runs():
      locks = lock_index()
      records = []
      if RUNS_ROOT.exists():
        for ticket_dir in RUNS_ROOT.iterdir():
          if not ticket_dir.is_dir():
            continue
          for run_dir in ticket_dir.iterdir():
            if run_dir.is_dir():
              records.append(run_record(ticket_dir, run_dir, locks))
      records.sort(key=lambda item: item.get("updatedAt") or item.get("startedAt") or "", reverse=True)
      return {
        "generatedAt": utc_now_iso(),
        "source": {
          "runsRoot": str(RUNS_ROOT),
          "locksRoot": str(LOCKS_ROOT),
          "readOnly": True,
        },
        "runs": records[:RECENT_LIMIT],
      }

    def get_run(ticket, run_id):
      locks = lock_index()
      run_dir = safe_child(RUNS_ROOT, ticket, run_id)
      if not run_dir.is_dir():
        return None
      record = run_record(run_dir.parent, run_dir, locks)
      record["availableFiles"] = sorted(path.name for path in run_dir.iterdir() if path.is_file())
      return record

    def read_log(ticket, run_id, name, offset):
      if name not in LOG_FILES:
        raise ValueError("unsupported log file")
      path = safe_child(RUNS_ROOT, ticket, run_id, name)
      if not path.exists():
        return {
          "name": name,
          "missing": True,
          "offset": 0,
          "nextOffset": 0,
          "size": 0,
          "updatedAt": None,
          "content": "",
        }
      size = path.stat().st_size
      if offset < 0 or offset > size:
        offset = max(0, size - MAX_LOG_BYTES)
      with path.open("rb") as f:
        f.seek(offset)
        data = f.read(MAX_LOG_BYTES + 1)
      truncated = len(data) > MAX_LOG_BYTES
      if truncated:
        data = data[:MAX_LOG_BYTES]
      next_offset = offset + len(data)
      return {
        "name": name,
        "missing": False,
        "offset": offset,
        "nextOffset": next_offset,
        "size": size,
        "updatedAt": stat_iso(path),
        "truncated": truncated,
        "content": data.decode("utf-8", errors="replace"),
      }

    class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
        parsed = urlparse(self.path)
        path = parsed.path
        try:
          if path == "/":
            self.send_static("index.html", "text/html; charset=utf-8")
          elif path in ("/app.css", "/app.js"):
            self.send_static(path.lstrip("/"), "text/css; charset=utf-8" if path.endswith(".css") else "application/javascript; charset=utf-8")
          elif path == "/healthz":
            self.send_json({"ok": True, "generatedAt": utc_now_iso()})
          elif path == "/api/runs":
            self.send_json(list_runs())
          elif path.startswith("/api/runs/"):
            self.handle_run_api(path, parse_qs(parsed.query))
          else:
            self.send_error(404)
        except ValueError as exc:
          self.send_json({"error": str(exc)}, 400)
        except Exception as exc:
          self.send_json({"error": "internal error", "detail": str(exc)}, 500)

      def do_POST(self):
        self.send_error(405)

      def do_PUT(self):
        self.send_error(405)

      def do_DELETE(self):
        self.send_error(405)

      def handle_run_api(self, path, query):
        parts = [unquote(part) for part in path.split("/") if part]
        if len(parts) == 4 and parts[:2] == ["api", "runs"]:
          record = get_run(parts[2], parts[3])
          if record is None:
            self.send_error(404)
          else:
            self.send_json(record)
          return
        if len(parts) == 5 and parts[:2] == ["api", "runs"] and parts[4] == "log":
          name = query.get("file", ["events.jsonl"])[0]
          offset = int(query.get("offset", ["-1"])[0])
          self.send_json(read_log(parts[2], parts[3], name, offset))
          return
        self.send_error(404)

      def send_static(self, filename, content_type):
        path = safe_child(APP_ROOT, filename)
        data = path.read_bytes()
        self.send_response(200)
        self.send_header("Content-Type", content_type)
        self.send_header("Cache-Control", "no-store")
        self.send_header("Content-Length", str(len(data)))
        self.end_headers()
        self.wfile.write(data)

      def send_json(self, payload, status=200):
        data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
        self.send_response(status)
        self.send_header("Content-Type", "application/json; charset=utf-8")
        self.send_header("Cache-Control", "no-store")
        self.send_header("Content-Length", str(len(data)))
        self.end_headers()
        self.wfile.write(data)

      def log_message(self, fmt, *args):
        print("%s %s" % (self.address_string(), fmt % args), flush=True)

    class KohakoBoardHandler(BaseHTTPRequestHandler):
      """BOXP-329: separate port that serves only the Kohako G2 Board projection."""

      def do_GET(self):
        path = urlparse(self.path).path
        if path == "/healthz":
          self.send_json({"ok": True})
        elif path == "/api/kohako/board":
          try:
            self.send_json(kohako_board.build_projection(KOHAKO_VAULT_ROOT))
          except Exception:
            self.send_json({"error": "projection failed"}, 500)
        else:
          self.send_json({"error": "not found"}, 404)

      def do_POST(self):
        self.send_error(405)

      def do_PUT(self):
        self.send_error(405)

      def do_DELETE(self):
        self.send_error(405)

      def do_PATCH(self):
        self.send_error(405)

      send_json = Handler.send_json

      def log_message(self, fmt, *args):
        print("kohako-board %s" % (fmt % args), flush=True)

    if __name__ == "__main__":
      # Served on its own port so even-g2-lab can be allowed to reach the projection only.
      kohako_port = int(os.environ.get("KOHAKO_BOARD_PORT", "8090"))
      kohako_server = ThreadingHTTPServer(("0.0.0.0", kohako_port), KohakoBoardHandler)
      threading.Thread(target=kohako_server.serve_forever, daemon=True).start()
      print(f"kohako board projection listening on :{kohako_port}", flush=True)
      port = int(os.environ.get("PORT", "8080"))
      server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
      print(f"codex task board dashboard listening on :{port}; root={BOARD_ROOT}", flush=True)
      server.serve_forever()

  kohako_board.py: |
    """Read-only Task Board projection for Kohako G2 (BOXP-329).

    Returns only a fixed set of fields for active tickets, with
    short masked excerpts of the latest Notes. Never returns Notes in full, ticket
    bodies, attachments or vault paths, and never writes to the vault.
    """
    import re
    from datetime import datetime, timedelta, timezone
    from pathlib import Path

    SCHEMA = "kohako-board/v1"
    LANE_ORDER = ("In Progress", "Review", "Blocked", "Ready", "Done")
    LANE_STATUS = {"Ready": "ready", "In Progress": "in-progress", "Review": "review", "Blocked": "blocked", "Done": "done"}
    ITEM_LIMIT = 30
    EXCERPT_CHARS = 80
    TITLE_CHARS = 120
    DONE_WINDOW = timedelta(hours=48)
    MAX_FILE_BYTES = 512 * 1024
    NOTE_SCAN = 10

    TICKET_ID = re.compile(r"^BOXP-\d{1,6}$")
    CARD = re.compile(r"^- \[[ xX]\] \[\[Tickets/(BOXP-\d{1,6})\|([^\]]*)\]\](.*)$")
    FIELD = re.compile(r"(\w+)::(\S+)")
    NOTE = re.compile(r"^- (\d{4}-\d{2}-\d{2})(?: (\d{2}:\d{2}(?::\d{2})?) UTC)?(?: \[([^\]\n]{1,40})\])?:\s*(.*)$")
    BLOCKER = re.compile(r"(?i)\bblock(?:ed|er|ing)?\b|阻害|ブロッカー")
    DECISION = re.compile(r"(?i)要判断|判断が必要|判断待ち|承認待ち|返答待ち|必要な判断|owner\s*(?:の|に)?\s*(?:判断|承認|確認|回答|返答)\s*(?:が必要|を求め|待ち|をお願い|を依頼)")

    URL = re.compile(r"https?://([^/\s)>\]]+)[^\s)>\]]*")
    EMAIL = re.compile(r"[\w.+-]+@[\w-]+(?:\.[\w-]+)+")
    SECRET_WORD = re.compile(r"(?i)\b([\w-]*(?:token|secret|password|passwd|api[_-]?key|key))\b(\s*[:=]?\s*)\S+")
    LONG_TOKEN = re.compile(r"[A-Za-z0-9_+/=-]{32,}")
    WIKILINK = re.compile(r"\[\[(?:[^\]|]*\|)?([^\]]*)\]\]")
    CONTROL = re.compile(r"[\x00-\x1f\x7f]")


    def iso(dt):
      return dt.astimezone(timezone.utc).isoformat().replace("+00:00", "Z") if dt else None


    def mtime(path):
      try:
        return datetime.fromtimestamp(path.stat().st_mtime, timezone.utc)
      except OSError:
        return None


    def read_limited(path):
      with path.open("rb") as f:
        data = f.read(MAX_FILE_BYTES + 1)
      return data[:MAX_FILE_BYTES].decode("utf-8", errors="replace")


    def mask(text):
      text = WIKILINK.sub(r"\1", text)
      text = URL.sub(lambda m: m.group(1) + "/…", text)
      text = EMAIL.sub("…", text)
      text = SECRET_WORD.sub(lambda m: m.group(1) + m.group(2) + "…", text)
      text = LONG_TOKEN.sub("…", text)
      return text


    def excerpt(text, limit=EXCERPT_CHARS):
      if not text:
        return None
      text = " ".join(CONTROL.sub(" ", mask(text.replace("**", "").replace("`", ""))).split())
      if not text:
        return None
      return text if len(text) <= limit else text[: limit - 1] + "…"


    def parse_board(text):
      """Return [(lane, id, label, fields)] for the lanes Kohako shows."""
      cards, lane = [], None
      for line in text.splitlines():
        if line.startswith("## "):
          lane = line[3:].strip()
          continue
        if lane not in LANE_STATUS:
          continue
        m = CARD.match(line)
        if not m:
          continue
        fields = {}
        for key, value in FIELD.findall(m.group(3)):
          fields.setdefault(key, value)
        label = m.group(2)
        prefix = m.group(1) + ":"
        title = label[len(prefix):].strip() if label.startswith(prefix) else label.strip()
        cards.append((lane, m.group(1), title, fields))
      return cards


    def parse_frontmatter(text):
      if not text.startswith("---\n"):
        return {}
      end = text.find("\n---", 4)
      if end < 0:
        return {}
      result = {}
      for line in text[4:end].splitlines():
        key, sep, value = line.partition(":")
        if sep and key and not key.startswith((" ", "-")):
          result[key.strip()] = value.strip()
      return result


    def parse_notes(text):
      """Return note entries in file order: [(datetime|None, source|None, text)]."""
      lines = text.splitlines()
      try:
        start = next(i for i, line in enumerate(lines) if line.strip() == "## Notes")
      except StopIteration:
        return []
      notes = []
      for line in lines[start + 1:]:
        if line.startswith("## "):
          break
        m = NOTE.match(line)
        if not m:
          continue
        date, clock, source, body = m.groups()
        try:
          fmt = "%Y-%m-%d %H:%M:%S" if clock and clock.count(":") == 2 else "%Y-%m-%d %H:%M" if clock else "%Y-%m-%d"
          at = datetime.strptime(f"{date} {clock}" if clock else date, fmt).replace(tzinfo=timezone.utc)
        except ValueError:
          at = None
        notes.append((at, source, body))
      return notes


    def find_recent(notes, pattern):
      for _, _, body in reversed(notes[-NOTE_SCAN:]):
        if pattern.search(body):
          return excerpt(body)
      return None


    def project_ticket(tickets_root, lane, ticket_id, title, fields):
      item = {
        "id": ticket_id,
        "title": excerpt(title, TITLE_CHARS) or ticket_id,
        "lane": lane,
        "status": None,
        "laneStatusMismatch": False,
        "assignee": fields.get("assignee"),
        "ticketAssignee": None,
        "assigneeMismatch": False,
        "priority": fields.get("priority"),
        "ticketUpdatedAt": None,
        "latestNoteAt": None,
        "latestNoteSource": None,
        "progress": None,
        "blocker": None,
        "decision": None,
        "readError": None,
      }
      path = tickets_root / f"{ticket_id}.md"
      if not path.is_file():
        item["readError"] = "ticket_missing"
        return item, None
      updated = mtime(path)
      item["ticketUpdatedAt"] = iso(updated)
      try:
        text = read_limited(path)
      except OSError:
        item["readError"] = "ticket_unreadable"
        return item, updated
      front = parse_frontmatter(text)
      status = front.get("status") or None
      item["status"] = status
      item["laneStatusMismatch"] = bool(status) and status != LANE_STATUS[lane]
      ticket_assignee = front.get("assignee") or None
      item["ticketAssignee"] = ticket_assignee
      item["assigneeMismatch"] = bool(ticket_assignee and item["assignee"]) and ticket_assignee != item["assignee"]
      item["priority"] = item["priority"] or front.get("priority") or None
      notes = parse_notes(text)
      if notes:
        timed = [at for at, _, _ in notes if at]
        item["latestNoteAt"] = iso(max(timed)) if timed else None
        item["latestNoteSource"] = notes[-1][1]
        item["progress"] = excerpt(notes[-1][2])
        item["blocker"] = find_recent(notes, BLOCKER)
        item["decision"] = find_recent(notes, DECISION)
      return item, updated


    def build_projection(vault_root, now=None):
      now = now or datetime.now(timezone.utc)
      vault_root = Path(vault_root).resolve()
      board_path = vault_root / "Boards" / "Task Board.md"
      tickets_root = (vault_root / "Tickets").resolve()
      if tickets_root.parent != vault_root:
        raise ValueError("tickets root escapes vault")
      rank = {lane: i for i, lane in enumerate(LANE_ORDER)}
      items, seen = [], set()
      for lane, ticket_id, title, fields in parse_board(read_limited(board_path)):
        if ticket_id in seen or not TICKET_ID.match(ticket_id):
          continue
        seen.add(ticket_id)
        updated = mtime(tickets_root / f"{ticket_id}.md")
        if lane == "Done" and (not updated or now - updated > DONE_WINDOW):
          continue
        items.append((lane, ticket_id, title, fields, updated))
      # Lane priority first, then the most recently updated ticket first within a lane.
      items.sort(key=lambda card: (rank[card[0]], -(card[4].timestamp() if card[4] else 0)))
      items = [card[:4] for card in items]
      projected = [project_ticket(tickets_root, *card)[0] for card in items[:ITEM_LIMIT]]
      return {
        "schema": SCHEMA,
        "generatedAt": iso(now),
        "boardUpdatedAt": iso(mtime(board_path)),
        "total": len(items),
        "limit": ITEM_LIMIT,
        "truncated": len(items) > ITEM_LIMIT,
        "items": projected,
      }

