apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  annotations:
    configmap.reloader.stakater.com/reload: "llama-server-models"
spec:
  # BOXP-336: Strata 検証（argoproj/strata-eval）の間だけ一時停止。GPU（gpu.intel.com/i915: 1）を
  # strata-eval へ渡すため。model・設定・hostPath は残す。検証後に 1 へ戻す。
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      automountServiceAccountToken: false
      priorityClassName: gpu-workload-high
      nodeSelector:
        lolice.io/gpu-worker: "true"
      tolerations:
        - key: lolice.io/gpu-worker
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 44
          - 110
      containers:
        - name: llama-server
          image: ghcr.io/boxp/arch/llama-sycl:latest
          imagePullPolicy: Always
          args:
            - llama-server
            - --host
            - 0.0.0.0
            - --port
            - "8081"
            - -dev
            - SYCL0
            - --models-preset
            - /config/models.ini
            - --models-max
            - "1"
            - -ngl
            - "99"
            - -c
            - "262144"
            - --parallel
            - "1"
            - -fa
            - auto
            - --jinja
            - --reasoning
            - "off"
            - --no-warmup
          ports:
            - name: llama-http
              containerPort: 8081
          env:
            - name: ZES_ENABLE_SYSMAN
              value: "1"
            - name: ONEAPI_DEVICE_SELECTOR
              value: level_zero:gpu
            - name: ZE_ENABLE_PCI_ID_DEVICE_ORDER
              value: "1"
            - name: HOME
              value: /tmp
            # mmap を使わず model を RAM に読み込む（従来の --no-mmap 相当）。
            # llama.cpp v0.7.0 で --no-mmap が --load-mode none に置き換わったため、
            # 旧 revision が読む LLAMA_ARG_MMAP と新 revision が読む LLAMA_ARG_LOAD_MODE の両方を
            # 環境変数で与え、image 更新の前後どちらでも同じ挙動で起動できるようにする（BOXP-253）。
            # 環境変数は router が起動する各 model の子プロセスにも継承される。
            - name: LLAMA_ARG_MMAP
              value: "0"
            - name: LLAMA_ARG_LOAD_MODE
              value: none
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "4"
              # BOXP-294: the largest preset (qwen38-27b at the router ctx 262144)
              # measured ~36 GB RSS on golyat-4; keep the request above it so the
              # scheduler does not hand that memory to other pods.
              memory: 40Gi
              gpu.intel.com/i915: "1"
            limits:
              gpu.intel.com/i915: "1"
          startupProbe:
            httpGet:
              path: /health
              port: llama-http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: llama-http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: llama-http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: models-config
              mountPath: /config/models.ini
              subPath: models.ini
              readOnly: true
        - name: envoy
          image: docker.io/envoyproxy/envoy@sha256:4d496918618a7ebd6c71ae8285e31ebff092f3a0a5ad642d50decf4a54eb2456
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --log-level
            - warn
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9901
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /server_info
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
      volumes:
        - name: models
          hostPath:
            path: /var/lib/local-llm/models
            type: Directory
        - name: tmp
          emptyDir: {}
        - name: models-config
          configMap:
            name: llama-server-models
        - name: envoy-config
          configMap:
            name: llama-server-envoy
