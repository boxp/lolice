apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-server-envoy
  labels:
    app: llama-server
    # prometheus-k8s は opt-in された ServiceMonitor だけを収集する。
    app.kubernetes.io/part-of: kube-prometheus
spec:
  selector:
    matchLabels:
      app: llama-server
  namespaceSelector:
    matchNames:
      - local-llm
  endpoints:
    - port: metrics
      interval: 30s
      path: /stats/prometheus
