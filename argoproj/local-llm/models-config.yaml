apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-server-models
data:
  models.ini: |
    version = 1

    [gemma4-26b]
    model = /models/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf
    ctx-size = 262144
    batch-size = 2048
    ubatch-size = 2048
    threads = 14
    threads-batch = 14

    [gemma4-26b-vision]
    model = /models/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf
    mmproj = /models/mmproj-Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-BF16.gguf
    no-mmproj-offload = 1
    ctx-size = 262144
    batch-size = 1024
    ubatch-size = 512
    threads = 14
    threads-batch = 14

    [ornith-35b]
    model = /models/Ornith-1.0-35B-uncensored-heretic-Q5_K_M.gguf
    ctx-size = 65536
    batch-size = 512
    ubatch-size = 128
    threads = 12
    threads-batch = 12
    reasoning-budget = 0

    # BOXP-294: Qwen3.8-27B (HauhauCS Aggressive, Q4_K_P 17.92 GB, HF revision
    # 993a5971, sha256 ba36dc3c…) as a selectable model next to gemma4-26b. The
    # default model is unchanged; with --models-max 1 the router loads this one
    # only when a request names it and unloads it again when another model is
    # requested. No ctx-size here: in b11669 the router overlays its own CLI
    # args (-c 262144, --parallel 1, -fa auto, --reasoning off, ...) on every
    # preset, so a preset ctx-size would be ignored anyway. Measured on golyat-4
    # with the live image through the router at ctx 262144: ~36 GB RSS alone
    # (load ~2.5 min, decode ~3.5 tok/s, thinking off, Japanese ok).
    # Sampler = publisher non-thinking recommendation; callers may override.
    [qwen38-27b]
    model = /models/boxp294-qwen38/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf
    batch-size = 2048
    ubatch-size = 512
    threads = 14
    threads-batch = 14
    temp = 0.7
    top-p = 0.8
    top-k = 20
    min-p = 0
    presence-penalty = 1.5

    # BOXP-337: Gemma4-31B (HauhauCS Balanced QAT, dense, Q4_K_M 18.69 GB, HF
    # repo HauhauCS/Gemma4-31B-QAT-Uncensored-HauhauCS-Balanced-MTP revision
    # 9654466e, sha256 71667f9e…) as a selectable model for the 26B-A4B vs 31B
    # comparison. Same author, series and quant as gemma4-26b; the default
    # model is unchanged and this preset is only loaded when a request names
    # it (--models-max 1 unloads gemma4-26b meanwhile). batch / threads match
    # gemma4-26b; ctx and the other router CLI args are overlaid as for every
    # preset. ubatch is 512, not 2048: with 2048 the dense 31B (60 layers, 32
    # heads) stalled the Arc 140T on an 8.3k-token prefill (i915 "Fence
    # expiration time out", no progress for 19 min). Short prompts were fine.
    # 512 is what the dense qwen38-27b uses for 34k-token prefills.
    # No sampler here (same as gemma4-26b); callers pass it.
    [gemma4-31b]
    model = /models/boxp337-gemma4-31b/Gemma4-31B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf
    batch-size = 2048
    ubatch-size = 512
    threads = 14
    threads-batch = 14

    # BOXP-358: candidate comparison, HF HauhauCS/Qwen3.6-35B-A3B-Uncensored-
    # HauhauCS-Aggressive revision f12a584f, Q4_K_P 23.42 GB, sha256 8d344a43….
    # Base Qwen/Qwen3.6-35B-A3B (MoE 35B total / ~3B active, apache-2.0).
    # Selectable only; the default is unchanged and --models-max 1 loads it
    # only when a request names it. Router overlays ctx 262144, --reasoning
    # off, etc. as for every preset. ubatch 512 is conservative: BOXP-337 saw
    # i915 fence stalls with ubatch 2048 on a dense model. Callers pass the sampler.
    [qwen36-35b-a3b]
    model = /models/boxp358/qwen36-a3b-hauhau/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf
    batch-size = 2048
    ubatch-size = 512
    threads = 14
    threads-batch = 14

    # BOXP-358: candidate, HF ornith-ai/Ornith-1.5-35B-A3B-GGUF revision
    # 12393612, Q4_K_M 21.71 GB, sha256 42739874…. Base
    # ornith-ai/Ornith-1.5-35B-A3B (qwen3_5_moe, mit). Selectable only;
    # the default is unchanged and --models-max 1 loads it only when a request
    # names it. Router overlays ctx 262144, --reasoning off, etc. as for every
    # preset. ubatch 512 is conservative after the BOXP-337 i915 fence stalls
    # with ubatch 2048 on a dense model. Callers pass the sampler.
    [ornith15-35b-a3b]
    model = /models/boxp358/ornith15-35b/Ornith-1.5-35B-Q4_K_M.gguf
    batch-size = 2048
    ubatch-size = 512
    threads = 14
    threads-batch = 14

    # BOXP-358: largest-fit candidate, HF unsloth/Qwen3.5-122B-A10B-GGUF
    # revision 51eab4d5, UD-Q2_K_XL 41.85 GB, sha256 be44a62a…. Base
    # Qwen/Qwen3.5-122B-A10B (MoE 122B total / ~10B active, apache-2.0).
    # Selectable only, same semantics as the presets above. Estimated
    # weights + KV (12 full-attention layers, 262144 ctx) + buffers stay
    # under the 55 GB per-candidate limit; memwatch unloads it below 12 GiB
    # MemAvailable. Callers pass the sampler.
    [qwen35-122b-a10b]
    model = /models/boxp358/qwen35-122b-a10b/Qwen3.5-122B-A10B-UD-Q2_K_XL.gguf
    batch-size = 2048
    ubatch-size = 512
    threads = 14
    threads-batch = 14

    # BOXP-358 batch 2: HF unsloth/Qwen-AgentWorld-35B-A3B-GGUF revision
    # 3a305abf, UD-Q4_K_M 22.13 GB, sha256 e7a8eafd…. Base
    # Qwen/Qwen-AgentWorld-35B-A3B (qwen3_5_moe, ~3B active, apache-2.0).
    # Selectable only, same semantics as the presets above. Callers pass the sampler.
    [qwen-agentworld-35b-a3b]
    model = /models/boxp358/qwen-agentworld-35b/Qwen-AgentWorld-35B-A3B-UD-Q4_K_M.gguf
    batch-size = 2048
    ubatch-size = 512
    threads = 14
    threads-batch = 14

    # BOXP-358 batch 2: HF ggml-org/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF
    # revision 8cd08217, Q4_0 18.90 GB, sha256 61f87e75…. Base
    # nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B (nemotron_h_moe: 23 mamba +
    # 6 attention + 23 MoE layers, ~3B active, openmdw-1.1; ja listed). KV for
    # 6 attention layers at 262144 ctx is ~1.6 GB. The MTP head file is not
    # fetched. Selectable only, same semantics as the presets above.
    [nemotron35-lightning-30b-a3b]
    model = /models/boxp358/nemotron35-lightning-30b/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q4_0.gguf
    batch-size = 2048
    ubatch-size = 512
    threads = 14
    threads-batch = 14

    # BOXP-358 batch 3 (coding axis): HF unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF
    # revision b17cb02d, Q4_K_M 18.56 GB, sha256 fadc3e5f…. Base
    # Qwen/Qwen3-Coder-30B-A3B-Instruct (qwen3moe, 48 layers all full attention,
    # 4 KV heads x 128, ~3B active, apache-2.0). KV at the router ctx 262144 is
    # ~25.8 GB f16, so weights + KV + buffers is ~47 GB (within the 55 GB per-candidate
    # budget). Selectable only, same semantics as the presets above. Callers pass the sampler.
    [qwen3-coder-30b-a3b]
    model = /models/boxp358/qwen3-coder-30b-a3b/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
    batch-size = 2048
    ubatch-size = 512
    threads = 14
    threads-batch = 14
