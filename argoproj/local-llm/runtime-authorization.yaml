apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen-runtime-controller
  namespace: local-llm
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen-runtime-controller
  namespace: local-llm
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [llama-server]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [llama-server-admission]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen-runtime-controller
  namespace: local-llm
subjects:
  - kind: ServiceAccount
    name: qwen-runtime-controller
    namespace: local-llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen-runtime-controller
