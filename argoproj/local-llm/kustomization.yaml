apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local-llm

resources:
  - namespace.yaml
  - models-config.yaml
  - admission-config.yaml
  - observation-networkpolicy.yaml
  - envoy-config.yaml
  - deployment.yaml
  - service.yaml
  - service-lan.yaml
  - servicemonitor.yaml
