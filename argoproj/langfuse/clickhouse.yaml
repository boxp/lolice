apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
spec:
  selector:
    app: langfuse-clickhouse
  ports:
    - name: http
      port: 8123
    - name: native
      port: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-clickhouse
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      priorityClassName: langfuse-observability
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # amd64 excludes the control plane; golyat-4 is the GPU research node.
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["golyat-4"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: clickhouse
          image: docker.io/clickhouse/clickhouse-server:26.10.3.7
          env:
            - name: CLICKHOUSE_DB
              value: default
            - name: CLICKHOUSE_USER
              value: langfuse
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-grafana-clickhouse
                  key: CLICKHOUSE_GRAFANA_PASSWORD
            - name: TZ
              value: UTC
          ports:
            - containerPort: 8123
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: 1500m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: config
              mountPath: /etc/clickhouse-server/config.d/boxp.xml
              subPath: clickhouse-config.xml
            - name: config
              mountPath: /etc/clickhouse-server/users.d/boxp.xml
              subPath: clickhouse-users.xml
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
        - name: config
          configMap:
            name: langfuse-clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: langfuse-longhorn
        resources:
          requests:
            storage: 20Gi
