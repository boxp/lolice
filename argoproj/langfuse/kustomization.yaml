apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: langfuse

resources:
  - namespace.yaml
  - scheduling-storage.yaml
  - external-secrets.yaml
  - rbac-ingest-key.yaml
  - networkpolicy.yaml
  - valkey.yaml
  - postgres.yaml
  - clickhouse.yaml
  - minio.yaml
  - web.yaml
  - sign-in-gateway.yaml
  - mcp-readonly-proxy.yaml
  - worker.yaml
  - cloudflared.yaml
  - retention-cronjob.yaml

configMapGenerator:
  - name: langfuse-clickhouse-config
    files:
      - files/clickhouse-config.xml
      - files/clickhouse-users.xml
  - name: langfuse-retention
    files:
      - files/retention.mjs
  - name: langfuse-sign-in-gateway
    files:
      - files/sign-in-gateway.mjs
  - name: langfuse-mcp-readonly-proxy
    files:
      - files/mcp-readonly-proxy.mjs
