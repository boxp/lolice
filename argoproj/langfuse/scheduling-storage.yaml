# BOXP-428: observation must yield to everything else. Any default-priority Pod can
# preempt these, and these never preempt others. A Pending Langfuse only means missing
# traces: producers are asynchronous and bounded.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: langfuse-observability
value: -100
preemptionPolicy: Never
globalDefault: false
description: "BOXP-428: Langfuse observability stack, lowest priority"
---
# BOXP-533: USB SSD 増設後の Owner 判断で replica を 2 にし、単一ノード障害に備える。
# これはバックアップの代替ではない。短期保持のデータは引き続き Longhorn backup 対象外で、
# recurring-job group は付けない（保持設計は docs/project_docs/BOXP-428 を参照）。
# StorageClass の parameters は変更できないため Force/Replace で StorageClass のみを再作成する。
# 既存の PV/PVC は影響を受けず、この変更は新規 volume のみに適用される。
# 既存 volume は argoproj/longhorn/langfuse-replica-two.yaml で変更する。
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: langfuse-longhorn
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  dataLocality: best-effort
  staleReplicaTimeout: "30"
  fsType: ext4
