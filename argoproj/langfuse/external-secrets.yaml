# BOXP-428: every value is generated once inside the cluster (BOXP-270 / BOXP-332 pattern).
# Rotation of the ingest key: delete ExternalSecret langfuse-ingest-key, let Argo CD
# recreate it, then update the project key through LANGFUSE_INIT_* and restart producers.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: langfuse-password
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 48
  digits: 10
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # 0 = generate once; a refresh would rotate the values under running Pods.
  refreshInterval: "0"
  target:
    name: langfuse-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEXTAUTH_SECRET: "{{ .nextauth }}"
        SALT: "{{ .salt }}"
        ENCRYPTION_KEY: "{{ .encryption | sha256sum }}"
        POSTGRES_PASSWORD: "{{ .postgres }}"
        DATABASE_URL: "postgresql://langfuse:{{ .postgres }}@langfuse-postgres:5432/langfuse"
        CLICKHOUSE_PASSWORD: "{{ .clickhouse }}"
        REDIS_AUTH: "{{ .redis }}"
        MINIO_ROOT_PASSWORD: "{{ .minio }}"
        LANGFUSE_INIT_USER_PASSWORD: "{{ .owner }}"
  dataFrom:
    - sourceRef: &generator
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: langfuse-password
      rewrite: [{regexp: {source: "password", target: "nextauth"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "password", target: "salt"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "password", target: "encryption"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "password", target: "postgres"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "password", target: "clickhouse"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "password", target: "redis"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "password", target: "minio"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "password", target: "owner"}}]
---
# Separate Secret: this is the only value producers in other namespaces may read
# (rbac-ingest-key.yaml). It carries no database or storage credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-ingest-key
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "0"
  target:
    name: langfuse-ingest-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LANGFUSE_PUBLIC_KEY: "pk-lf-{{ .pk }}"
        LANGFUSE_SECRET_KEY: "sk-lf-{{ .sk }}"
  dataFrom:
    - sourceRef: &generator
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: langfuse-password
      rewrite: [{regexp: {source: "password", target: "pk"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "password", target: "sk"}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-cloudflared
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: langfuse-cloudflared
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: langfuse-tunnel-token
        metadataPolicy: None
