# BOXP-472: lets the ESO SecretStore in monitoring read exactly one Secret, the password of
# the view-only ClickHouse user. No list/watch, no other Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: langfuse-grafana-clickhouse-reader
rules:
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - langfuse-grafana-clickhouse
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: langfuse-grafana-clickhouse-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: langfuse-grafana-clickhouse-reader
subjects:
  - kind: ServiceAccount
    name: langfuse-grafana-clickhouse-reader
    namespace: monitoring
