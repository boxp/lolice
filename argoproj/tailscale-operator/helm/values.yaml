# Tailscale Kubernetes Operator - Helm values
# Ref: https://tailscale.com/kb/1236/kubernetes-operator

# OAuth credentials are provided via ExternalSecret (tailscale-operator-oauth).
# Do not set oauth.clientId/clientSecret here; the chart would create a
# duplicate "operator-oauth" Secret that conflicts with the ExternalSecret.
oauth: {}

# Override the default volume source (secretName: operator-oauth) so the
# operator deployment mounts the ExternalSecret-managed Secret instead.
oauthSecretVolume:
  secret:
    secretName: tailscale-operator-oauth

# Operator image tag is left unset so it follows the chart's appVersion
# (targetRevision in ../application.yaml).
# BOXP-259 (eMudhra 中間CA侵害対応): proxy image のみ v1.104.2 へ固定する。
# v1.104.2 は go1.27.3 ビルド + Alpine ca-certificates 20261020-r0 で
# emSign ECC Root CA - G3 / Comodo AAA Services root を含まない(指紋走査で確認)。
# tailscale/k8s-operator:v1.104.2 と chart 1.104.2 は 2026-10-21 時点で未公開のため、
# 公開後に Renovate の chart 更新に追従してこの固定は外す。

# Resource limits for the operator itself
operatorConfig:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Operator runs in userspace mode (no NET_ADMIN required)
proxyConfig:
  defaultTags: "tag:k8s-operator"
  # Proxy resource limits are set by this ProxyClass (../proxyclass.yaml);
  # the chart has no values key for them.
  # The default does not apply to Connector resources (none exist today);
  # a Connector must set spec.proxyClass: default-proxy itself.
  defaultProxyClass: default-proxy
  image:
    tag: v1.104.2
