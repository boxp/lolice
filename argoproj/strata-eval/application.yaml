apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strata-eval
  namespace: argocd
spec:
  destination:
    namespace: strata-eval
    server: https://kubernetes.default.svc
  project: strata-eval
  source:
    path: argoproj/strata-eval/manifests
    repoURL: https://github.com/boxp/lolice
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
