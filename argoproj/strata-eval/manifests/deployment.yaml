apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata-server
  annotations:
    configmap.reloader.stakater.com/reload: "strata-server"
spec:
  # BOXP-383: 停止原因は SYCL Level Zero legacy adapter の command list 同期。
  # SYCL_UR_USE_LEVEL_ZERO_V2=1 で解消（configmap 参照）。gpu.intel.com/i915 は node に 1 つしかなく、
  # local-llm/llama-server と同時には動かせないため 0。再検証時は local-llm を止めてから 1 にする。
  # BOXP-383 batch7 完了後に復帰。
  # BOXP-665（Inkling 2 Mini の有限実機試験）の診断モード。local-llm を止めた上で 1。試験の終了時に 0 と通常構成へ戻す。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: strata-server
  template:
    metadata:
      labels:
        app: strata-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: gpu-workload-high
      nodeSelector:
        lolice.io/gpu-worker: "true"
      tolerations:
        - key: lolice.io/gpu-worker
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 44
          - 110
      containers:
        - name: strata
          # BOXP-665 の間だけ評価専用 image（boxp/arch#15534 の pr-15534。llama.cpp release b12633 = 9c10c94e を
          # llama-sycl の Dockerfile で build したもの）。通常は live と同じ
          # ghcr.io/boxp/arch/llama-sycl@sha256:30d75e0a297d7c1ce216c9bf0998eb37bf98314db475f60bcb01bb07c05331e2。
          image: ghcr.io/boxp/arch/llama-sycl@sha256:e9505a17ca5f5073f3c007fe8a9f8653664e1aeb35cf0d1858b1ad27738f37d6
          imagePullPolicy: IfNotPresent
          workingDir: /tmp
          # BOXP-665 診断モード: 試験プロセス（llama-server）は node 経由の exec から 127.0.0.1 だけで起動する。
          # 通常モードは workingDir /s/src-4b9e05a2、command
          # `python3 -m serve.server --engine strata --config /config/strata.json --host 127.0.0.1 --port 9137 --offline --no-api-key`、
          # env に LD_LIBRARY_PATH=/s/engine、STRATA_GGUF_PY=/s/gguf-py、PYTHONPATH=/s/pydeps:/s/src-4b9e05a2。
          command:
            - sleep
            - infinity
          env:
            - name: ZES_ENABLE_SYSMAN
              value: "1"
            - name: ONEAPI_DEVICE_SELECTOR
              value: level_zero:gpu
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "4"
              memory: 40Gi
              gpu.intel.com/i915: "1"
            limits:
              # node の MemAvailable 20GiB 以上を残す上限（RAM arena 31.6GiB + 作業領域）。
              memory: 56Gi
              gpu.intel.com/i915: "1"
          volumeMounts:
            - name: strata
              mountPath: /s
              readOnly: true
            # BOXP-665: 測定記録と試験スクリプト（小容量）。
            - name: work
              mountPath: /w
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /logs
      volumes:
        - name: strata
          hostPath:
            # BOXP-665 の間だけ Inkling 2 Mini GGUF の置き場所（読み取り専用）。通常は /var/lib/local-llm/models/boxp336-strata。
            path: /var/lib/local-llm/models/boxp665-inkling2-mini
            type: Directory
        - name: work
          hostPath:
            path: /var/lib/local-llm/models/boxp665
            type: Directory
        - name: config
          configMap:
            name: strata-server
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
