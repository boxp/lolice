apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata-server
  annotations:
    configmap.reloader.stakater.com/reload: "strata-server"
spec:
  # BOXP-383: 追加試験の診断モード（local-llm を止めた上で 1）。engine は kubectl exec から一変数ずつ起動する。
  # 試験後は local-llm を 1 に戻し、ここを 0 に戻す。停止原因の回避 env は configmap の strata.json を参照。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: strata-server
  template:
    metadata:
      labels:
        app: strata-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: gpu-workload-high
      nodeSelector:
        lolice.io/gpu-worker: "true"
      tolerations:
        - key: lolice.io/gpu-worker
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 44
          - 110
      containers:
        - name: strata
          # live の llama-server と同じ image（oneAPI / Level Zero runtime と python3 を使う）。
          image: ghcr.io/boxp/arch/llama-sycl@sha256:f74b5341cc7702f1b1bb3b1286d148965dff40abfe6976425e3052f5b5c83f53
          imagePullPolicy: IfNotPresent
          workingDir: /s/src-4b9e05a2
          # BOXP-383 診断モード: server を常駐させず、kubectl exec で engine/server を手動起動する
          # （一変数ずつの試験のため）。通常モードの command は configmap の strata.json と
          # `python3 -m serve.server --engine strata --config /config/strata.json --host 127.0.0.1
          # --port 9137 --offline --no-api-key`（BOXP-336 と同じ。待受は Pod 内 loopback のみ）。
          command:
            - sleep
            - infinity
          env:
            - name: ZES_ENABLE_SYSMAN
              value: "1"
            - name: ONEAPI_DEVICE_SELECTOR
              value: level_zero:gpu
            - name: HOME
              value: /tmp
            - name: LD_LIBRARY_PATH
              value: /s/engine
            - name: STRATA_GGUF_PY
              value: /s/gguf-py
            - name: PYTHONPATH
              value: /s/pydeps:/s/src-4b9e05a2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "4"
              memory: 40Gi
              gpu.intel.com/i915: "1"
            limits:
              # node の MemAvailable 20GiB 以上を残す上限（RAM arena 31.6GiB + 作業領域）。
              memory: 56Gi
              gpu.intel.com/i915: "1"
          volumeMounts:
            - name: strata
              mountPath: /s
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /logs
      volumes:
        - name: strata
          hostPath:
            path: /var/lib/local-llm/models/boxp336-strata
            type: Directory
        - name: config
          configMap:
            name: strata-server
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
