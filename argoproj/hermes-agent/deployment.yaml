apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 10000
      initContainers:
        - name: bootstrap-config
          image: ghcr.io/boxp/arch/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /opt/data/Documents/obsidian-headless/BOXP
              skill_dir=/opt/data/skills/note-taking/obsidian-task-board
              if [ ! -f /opt/data/.shared-uid-gid-migrated ]; then
                chown -R 1000:10000 /opt/data
                find /opt/data -type d -exec chmod g+rws {} \;
                touch /opt/data/.shared-uid-gid-migrated
                chown 1000:10000 /opt/data/.shared-uid-gid-migrated
              fi
              if [ ! -f /opt/data/config.yaml ]; then
                cp /bootstrap/config.yaml /opt/data/config.yaml
                chown 1000:10000 /opt/data/config.yaml
                chmod 0664 /opt/data/config.yaml
              fi
              if [ ! -f "$skill_dir/SKILL.md" ] || [ ! -f "$skill_dir/bin/task-board.bb" ]; then
                mkdir -p "$skill_dir/bin"
                cp /opt/boxp/hermes-agent/skills/obsidian-task-board/SKILL.md "$skill_dir/SKILL.md"
                cp /opt/boxp/hermes-agent/skills/obsidian-task-board/bin/task-board.bb "$skill_dir/bin/task-board.bb"
                chown -R 1000:10000 "$skill_dir"
                chmod 0644 "$skill_dir/SKILL.md"
                chmod 0755 "$skill_dir/bin/task-board.bb"
              fi
              mkdir -p /opt/data/scripts
              cat > /opt/data/scripts/quiet_gate.sh << 'SCRIPT_EOF'
#!/bin/sh
# Returns 0 during active hours, 1 during quiet hours (02:00-09:00 JST)
hour=$(TZ=Asia/Tokyo date +%H)
if [ "$hour" -ge 2 ] && [ "$hour" -lt 9 ]; then
  exit 1
fi
exit 0
SCRIPT_EOF
              chmod 0755 /opt/data/scripts/quiet_gate.sh
              chown 1000:10000 /opt/data/scripts/quiet_gate.sh
              cat > /opt/data/scripts/calendar_reminder.sh << 'SCRIPT_EOF'
#!/bin/sh
set -eu
/opt/data/scripts/quiet_gate.sh || exit 0
cd /home/boxp/Documents/obsidian-headless/BOXP && exec bb calendar_reminder.clj
SCRIPT_EOF
              chmod 0755 /opt/data/scripts/calendar_reminder.sh
              chown 1000:10000 /opt/data/scripts/calendar_reminder.sh
              cat > /opt/data/scripts/email_check.sh << 'SCRIPT_EOF'
#!/bin/sh
set -eu
/opt/data/scripts/quiet_gate.sh || exit 0
cd /home/boxp/Documents/obsidian-headless/BOXP && exec bb email_check.clj
SCRIPT_EOF
              chmod 0755 /opt/data/scripts/email_check.sh
              chown 1000:10000 /opt/data/scripts/email_check.sh
              cat > /opt/data/Documents/obsidian-headless/BOXP/email_check.clj << 'SCRIPT_EOF'
#!/usr/bin/env bb

;; 毎時メールチェックスクリプト
;; Gmailの2日以内の未読メールをトリアージし、要対応のみ出力する
;; 要対応メールが0件の場合は完全沈黙する

(ns email-check
  (:require [babashka.process :as proc]
            [cheshire.core :as json]
            [clojure.string :as str]))

(def google-api-py "/opt/data/.venv-google/bin/python /opt/data/skills/productivity/google-workspace/scripts/google_api.py")
(def google-token-file "/home/boxp/google_token.json")

(defn run-google-api
  [& args]
  (let [cmd (str/join " " (concat [google-api-py] args))
        result (proc/shell {:out :string :err :string :continue true
                            :extra-env {"GOOGLE_TOKEN_FILE" google-token-file}}
                           "sh" "-c" cmd)]
    (when-not (zero? (:exit result))
      (throw (ex-info (str "Gmail API error (exit=" (:exit result) "): " (:err result))
                      {:exit (:exit result) :stderr (:err result)})))
    (:out result)))

(defn actionable?
  [email]
  (let [subject (str/lower-case (or (:subject email) (:Subject email) ""))
        from (str/lower-case (or (:from email) (:From email) ""))
        no-reply-pattern #"(no.?reply|noreply|donotreply|notifications?@|automated|mailer.daemon|bounce)"]
    (not (re-find no-reply-pattern (str from " " subject)))))

(defn fetch-actionable-emails
  []
  (let [output (run-google-api "gmail" "search"
                               "\"is:unread is:inbox newer_than:2d\""
                               "--max-results" "10")]
    (when (and output (not (str/blank? output)))
      (let [emails (json/parse-string output true)]
        (when (seq emails)
          (filter actionable? emails))))))

(defn -main
  [& _args]
  (try
    (let [emails (fetch-actionable-emails)]
      (when (seq emails)
        (println "📬 要対応メールがあります:")
        (doseq [email emails]
          (let [subject (or (:subject email) (:Subject email) "(件名なし)")
                from (or (:from email) (:From email) "不明")]
            (println (format "・[%s] %s" from subject))))))
    (catch Exception e
      (binding [*out* *err*]
        (println (str "⚠️ メールチェックエラー: " (ex-message e))))
      (System/exit 1))))

(apply -main *command-line-args*)
SCRIPT_EOF
              chmod 0644 /opt/data/Documents/obsidian-headless/BOXP/email_check.clj
              cat > /opt/data/Documents/obsidian-headless/BOXP/calendar_reminder.clj << 'SCRIPT_EOF'
#!/usr/bin/env bb

;; カレンダーイベント事前通知スクリプト
;; 30分後（25〜35分以内）に開始するイベントを検出して通知する
;; 対象イベントがない場合は完全沈黙する

(ns calendar-reminder
  (:require [babashka.process :as proc]
            [cheshire.core :as json]
            [clojure.string :as str])
  (:import [java.time ZonedDateTime ZoneId Duration]
           [java.time.format DateTimeFormatter]))

(def google-api-py "/opt/data/.venv-google/bin/python /opt/data/skills/productivity/google-workspace/scripts/google_api.py")
(def google-token-file "/home/boxp/google_token.json")
(def jst (ZoneId/of "Asia/Tokyo"))

(defn run-google-api [& args]
  (let [cmd (str/join " " (concat [google-api-py] args))
        result (proc/shell {:out :string :err :string :continue true
                            :extra-env {"GOOGLE_TOKEN_FILE" google-token-file}}
                           "sh" "-c" cmd)]
    (when-not (zero? (:exit result))
      (throw (ex-info (str "Calendar API error: " (:err result))
                      {:exit (:exit result) :stderr (:err result)})))
    (:out result)))

(defn -main [& _args]
  (try
    (let [now (ZonedDateTime/now jst)
          end (.plusMinutes now 90)
          fmt DateTimeFormatter/ISO_OFFSET_DATE_TIME
          output (run-google-api "calendar" "list"
                                 "--start" (.format now fmt)
                                 "--end" (.format end fmt))]
      (when (and output (not (str/blank? output)))
        (let [events (json/parse-string output true)
              target-events
              (filter
               (fn [ev]
                 (when-let [start (get-in ev [:start :dateTime])]
                   (let [ev-start (ZonedDateTime/parse start DateTimeFormatter/ISO_OFFSET_DATE_TIME)
                         minutes-until (-> (Duration/between now ev-start) .toMinutes)]
                     (and (>= minutes-until 25) (<= minutes-until 35)))))
               events)]
          (when (seq target-events)
            (doseq [ev target-events]
              (println (str "📅 30分後に「" (or (:summary ev) "（タイトルなし）") "」が始まります")))))))
    (catch Exception e
      (binding [*out* *err*]
        (println (str "⚠️ カレンダーリマインダーエラー: " (ex-message e))))
      (System/exit 1))))

(apply -main *command-line-args*)
SCRIPT_EOF
              chmod 0644 /opt/data/Documents/obsidian-headless/BOXP/calendar_reminder.clj
              cat > /opt/data/Documents/obsidian-headless/BOXP/morning_report.clj << 'SCRIPT_EOF'
#!/usr/bin/env bb

;; 朝のブリーフィングスクリプト
;; 天気・ニュース・今日のカレンダー予定・要対応メールを報告する

(ns morning-report
  (:require [babashka.process :as proc]
            [babashka.http-client :as http]
            [cheshire.core :as json]
            [clojure.string :as str]
            [clojure.xml :as xml])
  (:import [java.time ZonedDateTime ZoneId]
           [java.time.format DateTimeFormatter]
           [java.io ByteArrayInputStream]))

(def google-api-py "/opt/data/.venv-google/bin/python /opt/data/skills/productivity/google-workspace/scripts/google_api.py")
(def google-token-file "/home/boxp/google_token.json")
(def jst (ZoneId/of "Asia/Tokyo"))
(def openweather-api-key (System/getenv "OPENWEATHERMAP_API_KEY"))
(def city "Tokyo")

(defn run-google-api [& args]
  (let [cmd (str/join " " (concat [google-api-py] args))
        result (proc/shell {:out :string :err :string :continue true
                            :extra-env {"GOOGLE_TOKEN_FILE" google-token-file}}
                           "sh" "-c" cmd)]
    (when-not (zero? (:exit result))
      (throw (ex-info (str "Google API error: " (:err result))
                      {:exit (:exit result) :stderr (:err result)})))
    (:out result)))

(defn fetch-weather []
  (try
    (when openweather-api-key
      (let [url (str "https://api.openweathermap.org/data/2.5/weather?q=" city "&appid=" openweather-api-key "&units=metric&lang=ja")
            resp (http/get url)
            data (json/parse-string (:body resp) true)]
        (str "🌤 天気: " (get-in data [:weather 0 :description])
             " / 気温: " (int (get-in data [:main :temp])) "°C"
             " (体感 " (int (get-in data [:main :feels_like])) "°C)")))
    (catch Exception _ nil)))

(defn fetch-news []
  (try
    (let [resp (http/get "https://news.yahoo.co.jp/rss/topics/top-picks.xml")
          root (xml/parse (ByteArrayInputStream. (.getBytes (:body resp) "UTF-8")))
          items (->> (xml-seq root)
                     (filter #(= :item (:tag %)))
                     (take 3)
                     (map #(->> (:content %)
                                (filter (fn [c] (= :title (:tag c))))
                                first :content first))
                     (remove nil?))]
      (when (seq items)
        (str "📰 ニュース:\n" (str/join "\n" (map #(str "・" %) items)))))
    (catch Exception _ nil)))

(defn fetch-todays-events []
  (try
    (let [now (ZonedDateTime/now jst)
          start (.withHour (.withMinute (.withSecond (.withNano now 0) 0) 0) 0)
          end (.withHour (.withMinute (.withSecond (.withNano now 0) 59) 59) 23)
          fmt DateTimeFormatter/ISO_OFFSET_DATE_TIME
          output (run-google-api "calendar" "list"
                                 "--start" (.format start fmt)
                                 "--end" (.format end fmt))]
      (when (and output (not (str/blank? output)))
        (let [events (json/parse-string output true)]
          (when (seq events)
            (str "📅 今日の予定:\n"
                 (str/join "\n"
                           (map (fn [ev]
                                  (let [title (or (:summary ev) "（タイトルなし）")
                                        time-str (or (get-in ev [:start :dateTime])
                                                     (get-in ev [:start :date])
                                                     "")]
                                    (str "・" time-str " " title)))
                                events)))))))
    (catch Exception e
      (str "⚠️ カレンダー取得エラー: " (ex-message e)))))

(defn actionable? [email]
  (let [from (str/lower-case (or (:from email) (:From email) ""))
        no-reply-pattern #"(no.?reply|noreply|donotreply|notifications?@|automated|mailer.daemon|bounce)"]
    (not (re-find no-reply-pattern from))))

(defn fetch-actionable-emails []
  (try
    (let [output (run-google-api "gmail" "search"
                                 "\"is:unread is:inbox newer_than:2d\""
                                 "--max-results" "10")]
      (when (and output (not (str/blank? output)))
        (let [emails (json/parse-string output true)
              actionable (filter actionable? emails)]
          (when (seq actionable)
            (str "📬 要対応メール:\n"
                 (str/join "\n"
                           (map (fn [e]
                                  (str "・[" (or (:from e) (:From e) "不明") "] "
                                       (or (:subject e) (:Subject e) "（件名なし）")))
                                actionable)))))))
    (catch Exception e
      (str "⚠️ メール取得エラー: " (ex-message e)))))

(defn -main [& _args]
  (let [sections (remove nil? [(fetch-weather)
                               (fetch-todays-events)
                               (fetch-actionable-emails)
                               (fetch-news)])]
    (when (seq sections)
      (println "おはようございます。本日のブリーフィングです。\n")
      (println (str/join "\n\n" sections)))))

(apply -main *command-line-args*)
SCRIPT_EOF
              chmod 0644 /opt/data/Documents/obsidian-headless/BOXP/morning_report.clj
              chown 1000:10000 \
                /opt/data \
                /opt/data/Documents \
                /opt/data/Documents/obsidian-headless \
                /opt/data/Documents/obsidian-headless/BOXP
              chmod 2775 \
                /opt/data \
                /opt/data/Documents \
                /opt/data/Documents/obsidian-headless \
                /opt/data/Documents/obsidian-headless/BOXP
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /etc/gai.conf
              subPath: gai.conf
              readOnly: true
            - name: config
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: hermes-agent
          image: ghcr.io/boxp/arch/hermes-agent:latest
          imagePullPolicy: Always
          args:
            - gateway
            - run
          env:
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "10000"
            - name: API_SERVER_ENABLED
              value: "false"
            - name: HERMES_DASHBOARD
              value: "true"
            - name: HERMES_DASHBOARD_HOST
              value: "127.0.0.1"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes-agent.b0xp.io"
            - name: HOME
              value: /opt/data
            - name: OBSIDIAN_VAULT_PATH
              value: /home/boxp/Documents/obsidian-headless/BOXP
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data:/home/boxp/Documents/obsidian-headless/BOXP
            - name: LOCAL_LLM_BASE_URL
              value: http://llama-server.local-llm.svc.cluster.local:8080/v1
            - name: LOCAL_LLM_MODEL
              value: ornith-35b
            - name: HERMES_STREAM_READ_TIMEOUT
              value: "1800"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: data
              mountPath: /home/boxp
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/gai.conf
              subPath: gai.conf
              readOnly: true
        - name: obsidian-sync
          image: ghcr.io/boxp/arch/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              umask 0002
              exec /opt/obsidian-headless/bin/ob sync --path "${OBSIDIAN_VAULT_PATH}" --continuous
          env:
            - name: HOME
              value: /home/boxp
            - name: PATH
              value: /opt/obsidian-headless/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: OBSIDIAN_VAULT_PATH
              value: /home/boxp/Documents/obsidian-headless/BOXP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /home/boxp
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - run
            - --protocol
            - http2
            - --token
            - $(TUNNEL_TOKEN)
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: hermes-agent-cloudflared-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: config
          configMap:
            name: hermes-agent-config
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
