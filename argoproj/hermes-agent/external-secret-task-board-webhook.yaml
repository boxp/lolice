# BOXP-270: HMAC secret shared by the Hermes webhook route `task-board` and the
# codex-workspace event dispatcher. Generated once inside the cluster (no
# external store, no manual value); the codex-workspace namespace reads this
# Secret through an ESO Kubernetes-provider SecretStore limited to this one
# Secret by `rbac-task-board-webhook.yaml`. Rotation: delete the ExternalSecret
# and let Argo CD recreate it, then restart both Pods.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-agent-task-board-webhook
spec:
  length: 48
  digits: 8
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-task-board-webhook
spec:
  # 0 = generate once; a refresh would rotate the value under the running Pods.
  refreshInterval: "0"
  target:
    name: hermes-agent-task-board-webhook
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-agent-task-board-webhook
