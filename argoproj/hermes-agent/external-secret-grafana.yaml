apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secret-hermes-agent-grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: hermes-agent-grafana
    creationPolicy: Owner
  data:
    - secretKey: service-account-token
      remoteRef:
        key: /lolice/codex-workspace/grafana-service-account-token
