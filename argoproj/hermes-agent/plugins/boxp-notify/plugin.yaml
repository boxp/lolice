name: boxp-notify
label: BOXP notify
kind: platform
version: 0.1.0
description: >
  Send-only notification channel (BOXP-546 prototype; deployed for
  Alertmanager only since BOXP-553). The official webhook / cron `deliver`
  target that writes the home inbox, de-duplicates by event id, grants
  silence only on a Notes receipt and forwards to Telegram (fallback, or
  both for Alertmanager). Uses only gateway.platforms.base and
  gateway.config; no core patches.
author: boxp
