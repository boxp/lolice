# BOXP-332: API_SERVER_KEY for the Hermes API server, used only by the Kohako G2
# BFF sidecar (even-g2-lab/even-g2-main). Generated once inside the cluster with
# the same pattern as BOXP-270 (no external store, no manual value, never sent to
# the G2 device). even-g2-lab reads it through an ESO Kubernetes-provider
# SecretStore limited to this one Secret by `rbac-api-server-key.yaml`.
# Rotation: delete the ExternalSecret and let Argo CD recreate it, then restart
# both the hermes-agent and even-g2-main Pods.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-agent-api-server-key
  annotations:
    # BOXP-332: create the key before the Deployment that references it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  digits: 10
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-api-server-key
  annotations:
    # BOXP-332: create the key before the Deployment that references it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # 0 = generate once; a refresh would rotate the value under the running Pods.
  refreshInterval: "0"
  target:
    name: hermes-agent-api-server-key
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-agent-api-server-key
