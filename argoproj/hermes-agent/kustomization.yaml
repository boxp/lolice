apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes-agent

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - external-secret-cloudflared.yaml
  - external-secret-grafana.yaml
  - external-secret-openweathermap.yaml
  - external-secret-nature-remo.yaml
  - external-secret-task-board-webhook.yaml
  - rbac-task-board-webhook.yaml
  - external-secret-alertmanager-webhook.yaml
  - rbac-alertmanager-webhook.yaml
  - service-webhook.yaml
  - external-secret-api-server-key.yaml
  - external-secret-langfuse-ingest-key.yaml
  - rbac-api-server-key.yaml
  - service-api.yaml
  - deployment.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - service-ai-ops-metrics.yaml
  - servicemonitor-ai-ops-metrics.yaml

configMapGenerator:
  - name: hermes-agent-kohako-g2-context-plugin
    files:
      - plugins/kohako-g2-context/plugin.yaml
      - plugins/kohako-g2-context/__init__.py
  - name: hermes-agent-boxp-ai-ops-observer-plugin
    files:
      - plugins/boxp-ai-ops-observer/plugin.yaml
      - plugins/boxp-ai-ops-observer/__init__.py
  - name: hermes-agent-kohako-vault-image-plugin
    files:
      - plugins/kohako-vault-image/plugin.yaml
      - plugins/kohako-vault-image/__init__.py
  - name: hermes-agent-kohako-g2-realtime-plugin
    files:
      - plugins/kohako-g2-realtime/plugin.yaml
      - plugins/kohako-g2-realtime/__init__.py
  - name: hermes-agent-boxp-langfuse-observer-plugin
    files:
      - plugins/boxp-langfuse-observer/plugin.yaml
      - plugins/boxp-langfuse-observer/__init__.py
  - name: hermes-agent-boxp-notify-plugin
    files:
      - plugins/boxp-notify/plugin.yaml
      - plugins/boxp-notify/__init__.py
  # BOXP-700: Nature Remo CLI, its skill and the read-only send allowlist.
  - name: hermes-agent-nature-remo
    files:
      - scripts/nature-remo/nature_remo.clj
      - scripts/nature-remo/nature_remo.sh
      - scripts/nature-remo/SKILL.md
      - scripts/nature-remo/allowlist.edn
  - name: hermes-agent-kohako-navilog-script
    files:
      - scripts/kohako-navilog/kohako_navilog_source.py
  # BOXP-735: @b0xp2 new public posts daily check (official x_search, no notification) and its skill.
  - name: hermes-agent-kohako-x-daily
    files:
      - scripts/kohako-x-daily/kohako_x_daily.py
      - scripts/kohako-x-daily/SKILL.md
  - name: hermes-agent-ai-ops-metrics
    files:
      - ai-ops-metrics/server.py
