# BOXP-462: token for the Hermes webhook route `alertmanager` (Alertmanager -> Hermes).
# Separate from the task-board HMAC so the monitoring namespace never reads that one.
# Alertmanager sends it as X-Gitlab-Token (Hermes compares it in constant time); the
# route is reachable only inside the cluster (ClusterIP + hermes-agent-webhook-ingress).
# Generated once inside the cluster. The monitoring namespace reads only this Secret
# through `rbac-alertmanager-webhook.yaml`. Rotation: delete the ExternalSecret, let
# Argo CD recreate it, then restart the hermes-agent Pod (Alertmanager's config Secret
# follows within its refreshInterval).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-agent-alertmanager-webhook
  annotations:
    # BOXP-462: create the Secret before the Deployment that reads it at bootstrap;
    # Argo CD waits for the ExternalSecret to become Healthy (Ready) before wave 0,
    # so the first Pod never starts with the route disabled.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 48
  digits: 8
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-alertmanager-webhook
  annotations:
    # BOXP-462: create the Secret before the Deployment that reads it at bootstrap;
    # Argo CD waits for the ExternalSecret to become Healthy (Ready) before wave 0,
    # so the first Pod never starts with the route disabled.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # 0 = generate once; a refresh would rotate the value under the running Pods.
  refreshInterval: "0"
  target:
    name: hermes-agent-alertmanager-webhook
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-agent-alertmanager-webhook
