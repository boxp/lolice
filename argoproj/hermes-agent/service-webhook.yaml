apiVersion: v1
kind: Service
metadata:
  name: hermes-agent-webhook
  namespace: hermes-agent
spec:
  # Internal-only entry for the Hermes webhook platform (BOXP-270). Reached
  # from the codex-workspace task-board event dispatcher through the cluster
  # network; never exposed through cloudflared or a LoadBalancer.
  type: ClusterIP
  selector:
    app: hermes-agent
  ports:
    - name: webhook
      port: 8644
      targetPort: 8644
      protocol: TCP
