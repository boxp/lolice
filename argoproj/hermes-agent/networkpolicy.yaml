apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: hermes-agent-network-policy
  namespace: hermes-agent
spec:
  tier: default
  selector: app == 'hermes-agent'
  types:
    - Egress
  egress:
    - action: Allow
      protocol: UDP
      source: {}
      destination:
        selector: k8s-app == 'kube-dns'
        namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
        ports:
          - 53
    - action: Allow
      protocol: TCP
      source: {}
      destination:
        selector: k8s-app == 'kube-dns'
        namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
        ports:
          - 53
    - action: Allow
      protocol: TCP
      source: {}
      destination:
        selector: app == 'llama-server'
        namespaceSelector: kubernetes.io/metadata.name == 'local-llm'
        ports:
          - 8080
    - action: Allow
      protocol: TCP
      source: {}
      destination:
        ports:
          - 22
          - 80
          - 443
          - 7844
    - action: Allow
      protocol: UDP
      source: {}
      destination:
        ports:
          - 2408
---
# BOXP-270: the webhook platform listens on 0.0.0.0:8644 inside the Pod. Only
# the codex-workspace Pod (task-board event dispatcher) may reach it; every
# other ingress to the hermes-agent Pod is denied. kubelet probes are not
# subject to Calico workload policy (the codex-workspace dashboard probe runs
# behind an equally strict ingress policy).
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: hermes-agent-webhook-ingress
  namespace: hermes-agent
spec:
  tier: default
  selector: app == 'hermes-agent'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == 'codex-workspace'
        selector: app == 'codex-workspace'
      destination:
        ports:
          - 8644
---
# BOXP-332: the API server listens on 0.0.0.0:8642 inside the Pod (bearer
# API_SERVER_KEY required by Hermes). Only the Kohako G2 BFF sidecar in the
# even-g2-main Pod may reach it.
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: hermes-agent-api-ingress
  namespace: hermes-agent
spec:
  tier: default
  selector: app == 'hermes-agent'
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: kubernetes.io/metadata.name == 'even-g2-lab'
        selector: app == 'even-g2-main'
      destination:
        ports:
          - 8642
