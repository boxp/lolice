# BOXP-700: Nature Remo 公式 API のアクセストークン。
# SSM パラメータは arch の terraform/aws/codex-workspace/ssm.tf が置き場だけ作り（初期値はダミー）、
# 値は本人が home.nature.global で発行して直接入れる。CLI はダミー値を「未設定」と扱う。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secret-hermes-agent-nature-remo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: hermes-agent-nature-remo
    creationPolicy: Owner
  data:
    - secretKey: NATURE_REMO_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: /lolice/hermes-agent/nature-remo-token
        metadataPolicy: None
