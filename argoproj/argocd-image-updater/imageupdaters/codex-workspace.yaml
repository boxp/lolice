apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: codex-workspace
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "codex-workspace"
      images:
        - alias: "workspace"
          imageName: "ghcr.io/boxp/arch/codex-workspace:latest"
          commonUpdateSettings:
            updateStrategy: "newest-build"
            # BOXP-349: release immediately after the active GPU safety run.
            allowTags: "regexp:^sha-e8fb485$"
            platforms:
              - "linux/amd64"
          manifestTargets:
            kustomize:
              name: "ghcr.io/boxp/arch/codex-workspace"
  writeBackConfig:
    method: "git:secret:argocd/repo-lolice-github-app"
    gitConfig:
      repository: "https://github.com/boxp/lolice.git"
      branch: "main"
