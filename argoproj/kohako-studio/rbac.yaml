apiVersion: v1
kind: ServiceAccount
metadata:
  name: kohako-studio
  namespace: kohako-studio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kohako-studio-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kohako-studio-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kohako-studio-tokenreview
subjects:
  - kind: ServiceAccount
    name: kohako-studio
    namespace: kohako-studio
