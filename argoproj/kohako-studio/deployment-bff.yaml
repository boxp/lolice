apiVersion: apps/v1
kind: Deployment
metadata:
  name: kohako-studio-bff
  namespace: kohako-studio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # RWO PVC、単一 writer JSON、メモリ内承認のため 1 を超えてはならない。
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kohako-studio, component: bff}
  template:
    metadata:
      labels: {app: kohako-studio, component: bff}
    spec:
      serviceAccountName: kohako-studio
      terminationGracePeriodSeconds: 30
      # web が先に image を pull したノードを優先し、停止時間を短縮する。
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app: kohako-studio, component: web}
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: ghcr.io/boxp/arch/kohako-studio:latest
          imagePullPolicy: Always
          ports:
            - {name: bff, containerPort: 8787}
          readinessProbe:
            httpGet: {path: /healthz, port: bff}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: bff}
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: KOHAKO_ACCESS_TEAM_DOMAIN
              value: https://boxp.cloudflareaccess.com
            - name: KOHAKO_ACCESS_AUD
              value: bd491ea940b2fe8ced4ff62699c58a02bce6919da7986a513189fc44e9caec85
            - name: KOHAKO_OWNER_EMAILS
              value: tiyotiyouda@gmail.com
            - name: KOHAKO_HERMES_URL
              value: http://hermes-agent-api.hermes-agent.svc.cluster.local:8642
            - name: KOHAKO_HERMES_KEY
              valueFrom:
                secretKeyRef:
                  name: kohako-hermes-api-key
                  key: key
            - name: KOHAKO_HERMES_TOOLSETS
              value: browser,code_execution,connections,cronjob,delegation,file,memory,session_search,skills,terminal,todo,vision,web
            - name: KOHAKO_VERIFIER_ENABLED
              value: "true"
            - name: KOHAKO_VERIFIER_USERNAME
              value: system:serviceaccount:codex-workspace:codex-workspace
            - name: KOHAKO_BFF_HOST
              value: 0.0.0.0
            - name: KOHAKO_BFF_PORT
              value: "8787"
            # BOXP-501: notification inbox / Web Push. Ingest accepts only the codex-workspace
            # ServiceAccount token issued for audience kohako-bff-notifier.
            - name: KOHAKO_DATA_DIR
              value: /data
            - name: KOHAKO_NOTIFIER_ENABLED
              value: "true"
            - name: KOHAKO_NOTIFIER_USERNAME
              value: system:serviceaccount:codex-workspace:codex-workspace
            # BOXP-522: local AivisSpeech Engine; the BFF resolves コハク／ノーマル by speaker UUID + style name.
            - name: KOHAKO_TTS_URL
              value: http://kohako-studio-tts.kohako-studio.svc.cluster.local:10101
            # BOXP-715: Owner-only trial voice Drama-3-Japanese (speech.cpp CPU). The default voice stays コハク.
            - name: KOHAKO_TTS_DRAMA3_URL
              value: http://kohako-studio-drama3.kohako-studio.svc.cluster.local:8080
            # BOXP-524: kohako-home voice input. Reuses the in-cluster whisper.cpp (CPU, no outbound) from BOXP-332;
            # audio is forwarded in memory only and never stored.
            - name: KOHAKO_STT_URL
              value: http://kohako-stt.even-g2-lab.svc.cluster.local:8080
            # BOXP-657 段2: 眼鏡の入口（principal g2）で、読み取りに加えて送信・停止・許可も受ける（会話は家と同じ 1 つ）。
            # read に戻すと段1（読み取りだけ）、外すと無効（段0 と同じ）。戻す時は even-g2-lab の KOHAKO_SHARED_BACKEND も read に戻す。
            # 通すのは「even-g2-lab の専用 ServiceAccount の token（audience kohako-bff-g2）」と
            # 「眼鏡の Access アプリ（下の AUD。家の AUD とは別）で本人が通った証明」の両方がそろった時だけ。
            - name: KOHAKO_G2_MODE
              value: write
            - name: KOHAKO_G2_USERNAME
              value: system:serviceaccount:even-g2-lab:kohako-g2-bff
            - name: KOHAKO_G2_ACCESS_AUD
              value: c98ec040b98358a12ac478984c00ded11e85e9336f2acb768c5f772351fbcbcb
            # 眼鏡から出した発言の指示文にだけ添える参照（今まで G2 の BFF が添えていたものと同じ: Board 要約と、
            # 本人の Telegram DM の直近を読むだけ）。家から出した発言の指示文は変わらない。新しい通信先・資格は無い
            # （Board は上の status と同じ 8090、Telegram DM は既存の Hermes API）。
            - name: KOHAKO_G2_BOARD_CONTEXT
              value: summary
            - name: KOHAKO_G2_SHARED_CONTEXT
              value: telegram-dm
            - name: KOHAKO_G2_TELEGRAM_USER_ID
              value: "8202126858"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # BOXP-677: PDF 添付を 1 件 30 MiB まで受けるため、受信と本文抽出（同時 1 件）の外部メモリが
          # GC まで残っても足りるよう上限を 512Mi にする（実測: 30 MiB PDF を 20 件続けて最大 RSS 264MiB、GC 後は 150-178MiB）。
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: kohako-studio-data}
