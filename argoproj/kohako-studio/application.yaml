apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kohako-studio
  namespace: argocd
spec:
  destination:
    namespace: kohako-studio
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/boxp/lolice
    targetRevision: main
    path: argoproj/kohako-studio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
