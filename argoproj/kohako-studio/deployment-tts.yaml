# BOXP-522: local CPU text-to-speech for kohako-home (AivisSpeech Engine, voice コハク／ノーマル).
# Reached only from the BFF (Owner-authenticated); no GPU, no external text submission.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kohako-studio-tts
  namespace: kohako-studio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kohako-studio, component: tts}
  template:
    metadata:
      labels: {app: kohako-studio, component: tts}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
          # BOXP-522 TD-01: on golyat-1 (4-core N-series, ~2.3 cores already busy) synthesis ran at ~0.5x real time,
          # leaving long pauses between read-aloud groups. golyat-4 (16 cores, ~1.5 busy on average) reaches ~1.48x
          # real time with 8 CPUs (serial OMP 8 = 1.48x vs 2 parallel x OMP 4 = 1.46x, so serial keeps lower latency).
          # The iGPU stays with llama-server; TTS only uses CPU and is capped below so most cores remain for other workloads. Falls back to other amd64 nodes if unavailable.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [golyat-4]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: ghcr.io/aivis-project/aivisspeech-engine:cpu-1.2.0@sha256:5799c94c3594501be80eeda62106f15439a858c1630d25d1385576581433b192
          imagePullPolicy: IfNotPresent
          command: ["/opt/aivisspeech-engine/.venv/bin/python", "/launcher/launch.py"]
          workingDir: /opt/aivisspeech-engine
          env:
            - {name: XDG_DATA_HOME, value: /data}
            - {name: HOME, value: /tmp/home}
            # Keep the ~650MB BERT / Hugging Face cache on the PVC, not the 256Mi /tmp emptyDir.
            - {name: HF_HOME, value: /data/huggingface}
            - {name: XDG_CACHE_HOME, value: /data/cache}
            - {name: HF_HUB_DISABLE_TELEMETRY, value: "1"}
            # One synthesis at a time uses all 8 CPUs of the limit (real-time ratio ~0.68 per request).
            - {name: OMP_NUM_THREADS, value: "8"}
          ports:
            - {name: tts, containerPort: 10101}
          startupProbe:
            httpGet: {path: /version, port: tts}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /version, port: tts}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /version, port: tts}
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # BOXP-522 local measurement (same image/launcher): resident ~2.1GiB after load, peak 3.3-3.6GiB
          # during the first synthesis; 3Gi was OOMKilled. ONNX Runtime sizes its thread pool to the node's
          # cores, so a 2-CPU quota on a 4-core node throttles it; allow bursting to all 4 cores.
          # BOXP-522 TD-01: 8 CPUs so synthesis keeps ahead of playback; measured peak 3.3GiB with OMP 8 under a 6g limit.
          resources:
            requests: {cpu: "1", memory: 3Gi}
            limits: {cpu: "8", memory: 6Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: launcher, mountPath: /launcher, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: kohako-studio-tts-data}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: launcher
          configMap: {name: kohako-studio-tts-launcher}
