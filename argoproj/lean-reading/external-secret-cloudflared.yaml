# BOXP-679: tunnel token は boxp/arch terraform/cloudflare/b0xp.io/lean-reading が SSM に置く。
# code-server の Pod には渡さない（cloudflared の Pod だけが読む）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secret-lean-reading-cloudflared
  namespace: lean-reading
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: lean-reading-cloudflared-secret
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: lean-reading-tunnel-token
        metadataPolicy: None
