deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # BOXP-692: ログを 90 日保持し、compactor の削除処理を有効化する。
  # retention_period は compactor.retention_enabled が true でないと効かない（Loki 3.4 の既定は false）。
  # 保持期間の変更と削除の有効化は必ず同じ変更で入れる（7 日のまま有効化すると、残っている古いログが即時に消える）。
  # Loki 3.x では retention を有効にすると delete_request_store の指定が必須。
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  limits_config:
    retention_period: 2160h  # 90 days
    # 1 回の検索で 90 日分を指定できるよう、保持期間 + 1h にそろえる。
    max_query_length: 2161h
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 1
      memory: 4Gi
  persistence:
    enabled: true
    storageClass: longhorn
    size: 60Gi
  nodeSelector:
    kubernetes.io/arch: amd64
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
chunksCache:
  enabled: false
resultsCache:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      app.kubernetes.io/part-of: kube-prometheus
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
test:
  enabled: false

# Disable sidecar rules watcher - not using ruler/rules
# This eliminates fsnotify watchers that cause "too many open files" errors
sidecar:
  rules:
    enabled: false

# Disable loki-canary DaemonSet - reduces resource overhead
lokiCanary:
  enabled: false
