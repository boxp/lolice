# BOXP-462: reads the Hermes `alertmanager` webhook route token from the hermes-agent
# namespace through the ESO Kubernetes provider. The Role in hermes-agent
# (argoproj/hermes-agent/rbac-alertmanager-webhook.yaml) limits it to that one Secret.
# Used only by the alertmanager-config ExternalSecret (external-secret-alertmanager.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-webhook-token-reader
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: hermes-webhook-token
  namespace: monitoring
spec:
  provider:
    kubernetes:
      remoteNamespace: hermes-agent
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: hermes-webhook-token-reader
