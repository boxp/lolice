# BOXP-462: reads the Hermes `alertmanager` webhook route token from the hermes-agent
# namespace through the ESO Kubernetes provider. The Role in hermes-agent
# (argoproj/hermes-agent/rbac-alertmanager-webhook.yaml) limits it to that one Secret.
# Used only by the alertmanager-hermes-webhook-token ExternalSecret below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-webhook-token-reader
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: hermes-webhook-token
  namespace: monitoring
spec:
  provider:
    kubernetes:
      remoteNamespace: hermes-agent
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: hermes-webhook-token-reader
---
# BOXP-462: the token as a file for Alertmanager. The Alertmanager CR mounts this Secret
# (spec.secrets) at /etc/alertmanager/secrets/alertmanager-hermes-webhook-token/token and
# the Hermes receiver reads it with http_headers `files:`. It is not templated into the
# config Secret because prometheus-operator re-marshals that config and masks
# http_headers `secrets:` values as "<secret>".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-hermes-webhook-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hermes-webhook-token
    kind: SecretStore
  target:
    name: alertmanager-hermes-webhook-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: hermes-agent-alertmanager-webhook
        property: password
