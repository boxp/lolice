apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-provider-quota-rules
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
    release: prometheus
spec:
  groups:
    # provider の利用枠は成果 SLO の burn rate とは別の入力。severity は info で、
    # Alertmanager の Warning 経路（メール）へは流さない。エージェントは run 開始時に読む。
    - name: ai-provider-quota.rules
      rules:
        - alert: AiProviderQuotaExhausted
          expr: |
            (ai_subscription_window_status{job="codex-workspace-ai-ops-metrics",provider="claude",status="rejected",limit=~"five_hour|seven_day"} == 1)
            unless on(provider,limit) (ai_subscription_window_resets_at_seconds{job="codex-workspace-ai-ops-metrics"} <= time())
            and on(provider,limit) (
              (ai_subscription_window_resets_at_seconds{job="codex-workspace-ai-ops-metrics"} > time())
              or (time() - ai_subscription_window_observed_timestamp_seconds{job="codex-workspace-ai-ops-metrics"} <= 86400)
            )
          labels:
            severity: info
            component: ai-ops
            definition_version: quota/v1-draft
            scope: shared
          annotations:
            summary: Claude の共有利用枠が不足
            description: 共有枠はすべての Claude モデルに効く。Opus や Sonnet へ変えても回避できない。reset 時刻は ai_subscription_window_resets_at_seconds を参照。
            runbook_next_actions: 許可された次 action = reset まで待つ・証拠の記録・状況の報告。禁止 = reset 前の再試行、新しい課金や別 account、制限の迂回、gate/承認/排他の解除、retry budget の reset。
        - alert: AiProviderQuotaExhausted
          expr: |
            (ai_subscription_window_status{job="codex-workspace-ai-ops-metrics",provider="claude",status="rejected",limit!~"five_hour|seven_day"} == 1)
            unless on(provider,limit) (ai_subscription_window_resets_at_seconds{job="codex-workspace-ai-ops-metrics"} <= time())
            and on(provider,limit) (
              (ai_subscription_window_resets_at_seconds{job="codex-workspace-ai-ops-metrics"} > time())
              or (time() - ai_subscription_window_observed_timestamp_seconds{job="codex-workspace-ai-ops-metrics"} <= 86400)
            )
          labels:
            severity: info
            component: ai-ops
            definition_version: quota/v1-draft
            scope: model
          annotations:
            summary: Claude のモデル専用利用枠が不足
            description: このモデルの経路だけが止まる。他の経路は候補だが、共有枠の状態を確かめるまで利用可能とは言えない。reset 時刻は ai_subscription_window_resets_at_seconds を参照。
            runbook_next_actions: 許可された次 action = reset まで待つ・Owner または正規 helper の担当変更のために候補を示す・証拠の記録。禁止 = 担当の自動変更、reset 前の再試行、新しい課金や別 account、制限の迂回、gate/承認/排他の解除、retry budget の reset。
        - alert: AiProviderQuotaObservationStale
          expr: |
            (time() - ai_subscription_window_observed_timestamp_seconds{job="codex-workspace-ai-ops-metrics",provider="claude"} > 86400)
            unless on(provider,limit) (ai_subscription_window_status{job="codex-workspace-ai-ops-metrics",provider="claude",status="rejected"} == 1)
          for: 1h
          labels:
            severity: info
            component: ai-ops
            definition_version: quota/v1-draft
            reason: window_stale
          annotations:
            summary: 利用枠の観測が古い
            description: 24 時間以上新しい観測がない。枠が使えるかは不明で、利用可能とは読まない。
            runbook_next_actions: 許可された次 action = 不明として扱う・証拠の記録。禁止 = 観測のための再試行の連打、gate/承認/排他の解除。
        - alert: AiProviderQuotaObservationStale
          expr: |
            ai_subscription_window_expired{job="codex-workspace-ai-ops-metrics",provider="claude"} == 1
          for: 1h
          labels:
            severity: info
            component: ai-ops
            definition_version: quota/v1-draft
            reason: window_expired
          annotations:
            summary: 利用枠の reset 後に新しい観測がない
            description: reset を過ぎたが新しい観測がない。回復したかは不明で、次の run が観測するまで利用可能とは言えない。
            runbook_next_actions: 許可された次 action = 不明として扱う・通常の run で観測する。禁止 = 観測のための再試行の連打、gate/承認/排他の解除。
        - alert: AiProviderQuotaObservationStale
          expr: |
            (ai_subscription_source_up{job="codex-workspace-ai-ops-metrics",provider="claude"} == 0)
            or absent(ai_subscription_source_up{job="codex-workspace-ai-ops-metrics",provider="claude"})
          for: 1h
          labels:
            severity: info
            component: ai-ops
            definition_version: quota/v1-draft
            reason: source_unavailable
          annotations:
            summary: 利用枠の観測元を読めない
            description: 観測元を読めないか系列がない。枠が使えるかは不明で、利用可能とは読まない。
            runbook_next_actions: 許可された次 action = 不明として扱う・証拠の記録・切分け。禁止 = gate/承認/排他の解除、Pod/Hermes の再起動。
