apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-ops-outcome-rules
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
    release: prometheus
spec:
  groups:
    - name: ai-ops-outcome.rules
      rules:
        - record: ai_ops:outcome_burn_rate
          expr: |
            ((ai_ops_outcome_tasks{job="codex-workspace-ai-ops-metrics",part="not_reached"} / ignoring(part) ai_ops_outcome_tasks{job="codex-workspace-ai-ops-metrics",part="determined"}) / 0.10)
            and ignoring(part) (ai_ops_outcome_tasks{job="codex-workspace-ai-ops-metrics",part="determined"} > 0)
        - record: ai_ops:outcome_reach_ratio
          expr: |
            (ai_ops_outcome_tasks{job="codex-workspace-ai-ops-metrics",part="reached_in_budget"} / ignoring(part) ai_ops_outcome_tasks{job="codex-workspace-ai-ops-metrics",part="determined"})
            and ignoring(part) (ai_ops_outcome_tasks{job="codex-workspace-ai-ops-metrics",part="determined"} > 0)
        - alert: AiOpsOutcomeBurnFast
          expr: |
            (ai_ops:outcome_burn_rate{window="7d"} >= 2.0)
            and on(window) (ai_ops_outcome_tasks{job="codex-workspace-ai-ops-metrics",window="7d",part="determined"} >= on(window) ai_ops_outcome_min_observations{job="codex-workspace-ai-ops-metrics",window="7d"})
            and on() (ai_ops_outcome_export_ok{job="codex-workspace-ai-ops-metrics"} == 1)
            and on() (time() - ai_ops_outcome_generated_timestamp_seconds{job="codex-workspace-ai-ops-metrics"} <= 7200)
          for: 2h
          labels:
            severity: warning
            component: ai-ops
            definition_version: outcome/v1-draft
            window: 7d
          annotations:
            summary: AI Ops 成果の劣化を検知
            description: "7d 窓: not_reached / determined の burn rate が暫定閾値 2.0 以上。観測数は determined、最低観測数は min_observations。Grafana ai-ops-quality を参照。"
            runbook_next_actions: 許可された次 action = 証拠保全（Notes への記録）・切分け（モデル更新/ハーネス更新/外部障害/課題の難度）・同条件での再評価・既承認の小さな是正候補の提示。禁止 = gate/承認/排他の解除、retry budget の reset、本番の自動変更、通知の再送、Pod/Hermes の再起動。
        - alert: AiOpsOutcomeBurnSlow
          expr: |
            (ai_ops:outcome_burn_rate{window="28d"} >= 1.0)
            and on(window) (ai_ops_outcome_tasks{job="codex-workspace-ai-ops-metrics",window="28d",part="determined"} >= on(window) ai_ops_outcome_min_observations{job="codex-workspace-ai-ops-metrics",window="28d"})
            and on() (ai_ops_outcome_export_ok{job="codex-workspace-ai-ops-metrics"} == 1)
            and on() (time() - ai_ops_outcome_generated_timestamp_seconds{job="codex-workspace-ai-ops-metrics"} <= 7200)
          for: 2h
          labels:
            severity: warning
            component: ai-ops
            definition_version: outcome/v1-draft
            window: 28d
          annotations:
            summary: AI Ops 成果の劣化を検知
            description: "28d 窓: not_reached / determined の burn rate が暫定閾値 1.0 以上。観測数は determined、最低観測数は min_observations。Grafana ai-ops-quality を参照。"
            runbook_next_actions: 許可された次 action = 証拠保全（Notes への記録）・切分け（モデル更新/ハーネス更新/外部障害/課題の難度）・同条件での再評価・既承認の小さな是正候補の提示。禁止 = gate/承認/排他の解除、retry budget の reset、本番の自動変更、通知の再送、Pod/Hermes の再起動。
        - alert: AiOpsOutcomeMeasurementStale
          expr: |
            max(
              ai_ops_outcome_export_ok{job="codex-workspace-ai-ops-metrics"} == 0
            or time() - ai_ops_outcome_generated_timestamp_seconds{job="codex-workspace-ai-ops-metrics"} > 7200
            or absent(ai_ops_outcome_export_ok{job="codex-workspace-ai-ops-metrics"})
            or absent(ai_ops_outcome_generated_timestamp_seconds{job="codex-workspace-ai-ops-metrics"})
            )
          for: 30m
          labels:
            severity: warning
            component: ai-ops
            definition_version: outcome/v1-draft
          annotations:
            summary: AI Ops 成果の計測に異常
            description: "計測の鮮度または export に異常。7d/28d 窓の not_reached / determined と観測数は信頼できない可能性がある。burn の閾値は暫定。Grafana ai-ops-quality を参照。"
            runbook_next_actions: 許可された次 action = 証拠保全（Notes への記録）・切分け（モデル更新/ハーネス更新/外部障害/課題の難度）・同条件での再評価・既承認の小さな是正候補の提示。禁止 = gate/承認/排他の解除、retry budget の reset、本番の自動変更、通知の再送、Pod/Hermes の再起動。
