# BOXP-472: password of the view-only ClickHouse user, for the Grafana datasource. The Role in
# langfuse (argoproj/langfuse/rbac-grafana-clickhouse.yaml) limits this to that one Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse-grafana-clickhouse-reader
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: langfuse-grafana-clickhouse
  namespace: monitoring
spec:
  provider:
    kubernetes:
      remoteNamespace: langfuse
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: langfuse-grafana-clickhouse-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-grafana-clickhouse
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: langfuse-grafana-clickhouse
    kind: SecretStore
  target:
    name: langfuse-grafana-clickhouse
    creationPolicy: Owner
  data:
    - secretKey: CLICKHOUSE_GRAFANA_PASSWORD
      remoteRef:
        key: langfuse-grafana-clickhouse
        property: CLICKHOUSE_GRAFANA_PASSWORD
