apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: local-llm-gpu-observability-rules
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
    release: prometheus
spec:
  groups:
    - name: local-llm-gpu-observability.rules
      rules:
        - alert: LocalLlmTargetDown
          expr: |
            (absent(up{job="llama-server", namespace="local-llm", service="llama-server"})
             or up{job="llama-server", namespace="local-llm", service="llama-server"} == 0)
            and on() (kube_deployment_spec_replicas{namespace="local-llm", deployment="llama-server"} > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Local LLM metrics target is down
            description: The selected local-llm metrics target has been down for more than 5 minutes.
        - alert: GpuBackendsUnavailable
          expr: |
            ((kube_deployment_status_replicas_available{namespace="local-llm", deployment="llama-server"} >= bool 1) + on()
             (kube_deployment_status_replicas_available{namespace="stable-diffusion", deployment="comfyui"} >= bool 1) + on()
             (kube_deployment_status_replicas_available{namespace="stable-diffusion", deployment="stable-diffusion-webui"} >= bool 1) + on()
             (kube_deployment_status_replicas_available{namespace="stable-diffusion", deployment="qwen-image-eval"} >= bool 1)) == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: All GPU backends are unavailable
            description: No GPU backend has been available for more than 15 minutes.
        - alert: LocalLlmBackendUnavailable
          expr: |
            (kube_deployment_spec_replicas{namespace="local-llm", deployment="llama-server"} > 0)
            and on(namespace, deployment)
            (kube_deployment_status_replicas_available{namespace="local-llm", deployment="llama-server"} == 0)
            and on() (up{job="llama-server", namespace="local-llm", service="llama-server"} == 1)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Selected local LLM is unavailable
            description: Local LLM has been selected but unavailable for more than 15 minutes while its metrics target is up.
        - alert: GpuBackendUnavailable
          expr: |
            (kube_deployment_spec_replicas{namespace="stable-diffusion", deployment=~"comfyui|stable-diffusion-webui|qwen-image-eval"} > 0)
            and on(namespace, deployment)
            (kube_deployment_status_replicas_available{namespace="stable-diffusion", deployment=~"comfyui|stable-diffusion-webui|qwen-image-eval"} == 0)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Selected GPU backend is unavailable
            description: GPU backend {{ $labels.namespace }}/{{ $labels.deployment }} has been selected but unavailable for more than 15 minutes.
        - alert: GpuBackendExclusivityViolation
          expr: |
            ((kube_deployment_spec_replicas{namespace="local-llm", deployment="llama-server"} > bool 0) + on()
             (kube_deployment_spec_replicas{namespace="stable-diffusion", deployment="comfyui"} > bool 0) + on()
             (kube_deployment_spec_replicas{namespace="stable-diffusion", deployment="stable-diffusion-webui"} > bool 0) + on()
             (kube_deployment_spec_replicas{namespace="stable-diffusion", deployment="qwen-image-eval"} > bool 0)) >= 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Multiple GPU backends are selected
            description: Two or more GPU backends have been selected for more than 2 minutes.
        - alert: GpuBackendMetricsMissing
          expr: |
            absent(kube_deployment_spec_replicas{namespace="local-llm", deployment="llama-server"})
            or
            absent(kube_deployment_spec_replicas{namespace="stable-diffusion", deployment="comfyui"})
            or
            absent(kube_deployment_spec_replicas{namespace="stable-diffusion", deployment="stable-diffusion-webui"})
            or
            absent(kube_deployment_spec_replicas{namespace="stable-diffusion", deployment="qwen-image-eval"})
            or
            absent(kube_deployment_status_replicas_available{namespace="local-llm", deployment="llama-server"})
            or
            absent(kube_deployment_status_replicas_available{namespace="stable-diffusion", deployment="comfyui"})
            or
            absent(kube_deployment_status_replicas_available{namespace="stable-diffusion", deployment="stable-diffusion-webui"})
            or
            absent(kube_deployment_status_replicas_available{namespace="stable-diffusion", deployment="qwen-image-eval"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GPU backend deployment metrics are missing
            description: Deployment metrics for {{ $labels.namespace }}/{{ $labels.deployment }} have been missing for more than 5 minutes.
        - alert: LocalLlmUnavailableLong
          expr: |
            kube_deployment_status_replicas_available{namespace="local-llm", deployment="llama-server"} == 0
          for: 5h
          labels:
            severity: warning
          annotations:
            summary: Local LLM has been unavailable for too long
            description: Local LLM has been unavailable for more than 5 hours.
        - alert: LocalLlmHigh5xxRate
          expr: |
            (
              sum(rate(envoy_cluster_upstream_rq_xx{job="llama-server", namespace="local-llm", envoy_cluster_name="llama_server", envoy_response_code_class="5"}[5m]))
              /
              clamp_min(sum(rate(envoy_cluster_upstream_rq_total{job="llama-server", namespace="local-llm", envoy_cluster_name="llama_server"}[5m])), 0.001)
            ) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Local LLM has a high 5xx response rate
            description: More than 5 percent of local-llm upstream requests have returned 5xx responses for 10 minutes.
        - alert: IntelGpuExporterDown
          expr: |
            absent(up{job="intel-gpu-exporter", namespace="intel-device-plugins", service="intel-gpu-exporter"})
            or
            up{job="intel-gpu-exporter", namespace="intel-device-plugins", service="intel-gpu-exporter"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Intel GPU exporter is down
            description: Prometheus cannot scrape the Intel GPU exporter target for more than 5 minutes.
        - alert: GpuWorkerPackageTemperatureHigh
          expr: |
            node_thermal_zone_temp{job="node-exporter", instance="golyat-4", type="x86_pkg_temp"} > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: GPU worker package temperature is high
            description: golyat-4 package temperature has been above 90C for more than 10 minutes. Arc 140T is an iGPU, so this is the closest available package-level thermal signal rather than a discrete GPU sensor.
