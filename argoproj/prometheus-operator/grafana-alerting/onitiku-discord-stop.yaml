# BOXP-699: onitiku Discord (contact point "onitiku server") へのアラート通知を止める。
#
# - 対象: contact point "onitiku server" を rule-level receiver にしている Grafana 管理ルール 2 件だけ。
#   それ以外のルール・contact point ("boxlab alert" / "email receiver")・default policy・
#   Prometheus Alertmanager (メール / Hermes) は変更しない。
# - 方法: 常時有効な mute timing "onitiku-discord-stopped" をルールの notification_settings に付ける。
#   ルールの評価・状態 (Normal/Alerting) と Grafana 上の表示は残し、FIRING / RESOLVED のどちらも
#   "onitiku server" へ送らない。receiver は "onitiku server" のままなので default policy
#   ("boxlab alert") へも流れない。
# - 2 ルールは元々 UI 作成 (provenance なし)。同じ uid でここに取り込むので、以後は Git が正本で
#   UI からは編集できない (provenance=file)。UI で再作成・上書きされて通知が復活することはない。
#   定義は 2026-11-24 時点の本番 export と同一で、差分は folder 名と mute_time_intervals のみ。
# - contact point "onitiku server" 自体 (Discord webhook) は削除しない (UI 管理のまま残す)。
# - 通知を再開するときは各ルールの mute_time_intervals を外す。
apiVersion: 1
muteTimes:
  - orgId: 1
    name: onitiku-discord-stopped
    time_intervals:
      # 曜日の全範囲 = 常時 mute (Grafana は日曜始まり。"monday:sunday" は起動時に
      # "start day cannot be before end day" で provisioning が失敗し Grafana が終了する)
      - weekdays: ["sunday:saturday"]
groups:
    - orgId: 1
      name: onitiku-palserver
      folder: Default
      interval: 1m
      rules:
        - uid: be92yxv4y2mf4b
          title: onitiku palworldが稼働していません
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 21600
                to: 0
              datasourceUid: P1809F7CD0C75ACF3
              model:
                datasource:
                    type: prometheus
                    uid: P1809F7CD0C75ACF3
                disableTextWrap: false
                editorMode: builder
                expr: kube_deployment_status_replicas_available{deployment="palserver"}
                fullMetaSearch: false
                includeNullMetadata: true
                instant: false
                interval: ""
                intervalMs: 15000
                legendFormat: '{{deployment}}'
                maxDataPoints: 43200
                range: true
                refId: A
                useBackend: false
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: be92yab5yh69sc
          panelId: 1
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            __dashboardUid__: be92yab5yh69sc
            __panelId__: "1"
            description: <@boxp> 対応してください
            summary: onitiku palworldが稼働していません
          isPaused: false
          notification_settings:
            receiver: onitiku server
            mute_time_intervals:
              - onitiku-discord-stopped
    - orgId: 1
      name: ark-asa
      folder: Default
      interval: 1m
      rules:
        - uid: fenkaqm8slj40d
          title: ark asa server restarts count
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 21600
                to: 0
              datasourceUid: P1809F7CD0C75ACF3
              model:
                datasource:
                    type: prometheus
                    uid: P1809F7CD0C75ACF3
                disableTextWrap: false
                editorMode: builder
                expr: delta(kube_pod_container_status_restarts_total{container="ark-server"}[1m])
                fullMetaSearch: false
                includeNullMetadata: true
                instant: false
                interval: ""
                intervalMs: 15000
                legendFormat: '{{container}}'
                maxDataPoints: 43200
                range: true
                refId: A
                useBackend: false
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: eenkaee7v0tfkf
          panelId: 1
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            __dashboardUid__: eenkaee7v0tfkf
            __panelId__: "1"
            summary: ark asa serverが再起動されました、しばらく接続できない可能性があります
          isPaused: true
          notification_settings:
            receiver: onitiku server
            mute_time_intervals:
              - onitiku-discord-stopped
