apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- aws-cost/resources.yaml
- lolice-dora/resources.yaml
- aws-cost-rules.yaml
- github.com/prometheus-operator/kube-prometheus?ref=v0.19.0
- application.yaml
- grafana-lb.yaml
- external-secret.yaml
- external-secret-alertmanager.yaml
- secret-store-hermes-webhook.yaml
- external-secret-langfuse-clickhouse.yaml
- cloudflared-deployment.yaml
- grafana-pvc.yaml
- prometheus-k8s-db-pvc.yaml
- control-plane-node-rules.yaml
- longhorn-storage-rules.yaml
- node-failover-memory-rules.yaml
- log-ingestion-gap-rules.yaml
- local-llm-gpu-observability-rules.yaml
- ai-ops-outcome-rules.yaml
- ai-provider-quota-rules.yaml
- ai-subscription-forecast-rules.yaml
- agent-auth-expiry-rules.yaml
- cloudflared-pod-monitor.yaml
- etcd-service.yaml
- etcd-servicemonitor.yaml
- control-plane-metrics-services.yaml
- pod-monitor-role.yaml
- pod-monitor-role-binding.yaml
- prometheus-servicemonitor-role.yaml
- prometheus-servicemonitor-role-binding.yaml
patchesStrategicMerge:
- patches/remove-crds.yaml
- overlays/network-policy-grafana.yaml
- overlays/grafana-datasources.yaml
- overlays/network-policy-prometheus-k8s.yaml
- overlays/alertmanager.yaml
- overlays/network-policy-alertmanager.yaml
- overlays/prometheus.yaml
- overlays/grafana.yaml
- overlays/monitoring-deployment-tolerations.yaml
- overlays/dashboard-placement.yaml
- overlays/grafana-config.yaml
patchesJson6902:
- target:
      group: apps
      version: v1
      kind: Deployment
      name: grafana
      namespace: monitoring
  path: patches/grafana-remove-empty-dir.yaml
- target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: kubernetes-monitoring-rules
      namespace: monitoring
  path: patches/remove-kube-memory-overcommit.yaml
configMapGenerator:
- name: aws-cost-metrics
  namespace: monitoring
  files:
  - aws-cost/server.py
- name: grafana-dashboard-local-llm-gpu-overview
  namespace: monitoring
  files:
  - local-llm-gpu-overview.json=dashboards/local-llm-gpu-overview.json
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: kube-prometheus
      app.kubernetes.io/version: 13.0.2
- name: lolice-dora-metrics
  namespace: monitoring
  files:
  - lolice-dora/collector.bb
  - lolice-dora/dora.clj
