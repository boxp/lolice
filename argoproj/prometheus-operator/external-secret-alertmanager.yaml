# Alertmanager の設定を丸ごと生成する ExternalSecret。
#
# 2026-08-01 に shanghai-1 がハングした際、ControlPlaneNodeNotReady (critical) は
# 死亡の約10分後に発火し3日間鳴り続けていたが、kube-prometheus 既定の receiver は
# すべて「名前だけ」で通知設定を持たず、Alertmanager が黙って捨てていた。
# その結果ノードが3日間止まったままになった。
#
# API キーと宛先/送信元アドレスを public リポジトリに置かないため、設定本体を
# template として持ち、値は AWS SSM から注入する。
# SSM パラメータの定義: boxp/arch の terraform/aws/alertmanager/ssm.tf
#
# Alertmanager CR 側は spec.configSecret でこの Secret を参照する
# (overlays/alertmanager.yaml)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  target:
    name: alertmanager-main-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # kube-prometheus 既定の inhibit_rules / route を踏襲して warning も通知する。
        # 対象を GitOps の opt-in Monitor に限定し、
        # Alertmanager 側でも alertname/namespace 単位に集約して15分待つ。
        # これにより設定反映時に残存 warning が大量の初回メールにならない。
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            # Resend の SMTP。ユーザ名は固定文字列 "resend"、パスワードが API キー。
            smtp_smarthost: 'smtp.resend.com:587'
            smtp_from: '{{ .alert_email_from }}'
            smtp_auth_username: 'resend'
            smtp_auth_password: '{{ .resend_api_key }}'
            smtp_require_tls: true

          inhibit_rules:
            - source_matchers:
                - 'severity = critical'
              target_matchers:
                - 'severity =~ warning|info'
              equal:
                - 'namespace'
                - 'alertname'
            - source_matchers:
                - 'severity = warning'
              target_matchers:
                - 'severity = info'
              equal:
                - 'namespace'
                - 'alertname'
            # BOXP-462: 同じ利用枠の差し迫った枯渇（critical）が出ている間は、その枠の
            # 予測 warning を止める。枠（provider/name/limit）が違えば止めない。
            - source_matchers:
                - 'alertname = AiSubscriptionWindowExhaustionImminent'
              target_matchers:
                - 'alertname = AiSubscriptionWindowExhaustionForecast'
              equal:
                - 'provider'
                - 'name'
                - 'limit'
            - source_matchers:
                - 'alertname = InfoInhibitor'
              target_matchers:
                - 'severity = info'
              equal:
                - 'namespace'

          route:
            group_by: ['alertname', 'namespace']
            receiver: 'Default'
            routes:
              # BOXP-462: label notify_hermes="true" を持つアラートの写しを Hermes へ送る。
              # continue: true なので下の severity 別の経路（メール）はそのまま届く。
              # Hermes 側は LLM を起動しない deliver_only route（Telegram へ整形して配送）。
              # 通知済みの記録（nflog）は Alertmanager の PVC に残り、再起動後も重複送信しない。
              - matchers:
                  - 'notify_hermes = "true"'
                receiver: 'Hermes'
                group_by: ['alertname', 'provider', 'name', 'limit']
                group_wait: 1m
                group_interval: 30m
                repeat_interval: 6h
                continue: true
              - matchers:
                  - 'alertname = Watchdog'
                receiver: 'Watchdog'
              - matchers:
                  - 'alertname = InfoInhibitor'
                receiver: 'null'
              - matchers:
                  - 'severity = critical'
                receiver: 'Critical'
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 6h
              - matchers:
                  - 'severity = warning'
                receiver: 'Warning'
                group_wait: 15m
                group_interval: 6h
                repeat_interval: 7d

          receivers:
            - name: 'Default'
            - name: 'Hermes'
              webhook_configs:
                # Service hermes-agent-webhook（ClusterIP、Calico で Alertmanager の Pod だけ許可）。
                # 認証は route 専用 token を X-Gitlab-Token で送る（Hermes の token 検証方式）。
                # token は Alertmanager CR の spec.secrets でマウントしたファイルから読む。
                # http_headers の secrets: は prometheus-operator が設定を再生成するときに
                # "<secret>" へ置き換えてしまい、Hermes で署名不一致になる（2026-11-07 に実際に発生）。
                - url: 'http://hermes-agent-webhook.hermes-agent.svc.cluster.local:8644/webhooks/alertmanager'
                  send_resolved: true
                  max_alerts: 10
                  timeout: 30s
                  http_config:
                    http_headers:
                      X-Gitlab-Token:
                        files: ['/etc/alertmanager/secrets/alertmanager-hermes-webhook-token/token']
            - name: 'Watchdog'
            - name: 'null'
            - name: 'Warning'
              email_configs:
                - to: '{{ .alert_email_to }}'
                  send_resolved: true
            - name: 'Critical'
              email_configs:
                # 件名は Alertmanager 既定のテンプレートに任せる。
                # ここで独自 subject を書くと ESO と Alertmanager の Go template が
                # 二重になり、エスケープを間違えても静かに壊れるだけなので避ける。
                # 既定でも "[FIRING:1] ControlPlaneNodeNotReady ..." の形で十分判別できる。
                #
                # 注意: この alertmanager.yaml はブロックスカラーなので、ここの # 行も
                # 文字列の一部として ESO の Go template に渡る。コメントであっても
                # 二重波括弧を書くと空アクションとして実行され、
                # "missing value for command" で同期が丸ごと失敗する (実際に踏んだ)。
                - to: '{{ .alert_email_to }}'
                  send_resolved: true
  data:
    - secretKey: resend_api_key
      remoteRef:
        key: /lolice/alertmanager/RESEND_API_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: alert_email_to
      remoteRef:
        key: /lolice/alertmanager/ALERT_EMAIL_TO
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: alert_email_from
      remoteRef:
        key: /lolice/alertmanager/ALERT_EMAIL_FROM
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
