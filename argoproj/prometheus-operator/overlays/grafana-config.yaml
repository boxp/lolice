apiVersion: v1
kind: Secret
metadata:
  name: grafana-config
  namespace: monitoring
stringData:
  grafana.ini: |
    [date_formats]
    default_timezone = JST

    [database] 
    type = sqlite3

    [server]
    domain = grafana.b0xp.io
    root_url = https://grafana.b0xp.io/

    [plugins]
    # readOnlyRootFilesystem 下では同梱プラグイン(prometheus等)の起動時自動更新が失敗し、登録解除されたままになる
    preinstall_auto_update = false
    # BOXP-472: AI Ops の時間帯別 breakdown (Langfuse の view-only ClickHouse を読む)
    preinstall = grafana-clickhouse-datasource@4.23.4
