apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus
stringData:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-k8s.monitoring.svc:9090
        isDefault: true
        editable: false
      # BOXP-472: Langfuse の token/call を本文なしで時間帯別に読む。user は view だけ SELECT 可。
      - name: langfuse-clickhouse
        uid: langfuse-clickhouse
        type: grafana-clickhouse-datasource
        access: proxy
        isDefault: false
        editable: false
        jsonData:
          protocol: http
          host: langfuse-clickhouse.langfuse.svc.cluster.local
          port: 8123
          username: grafana_usage
          defaultDatabase: default
          dialTimeout: "10"
          # clickhouse-go は ctx 期限 +5 秒を max_execution_time として送る。view user の上限 30 秒に収める
          queryTimeout: "25"
        secureJsonData:
          password: $CLICKHOUSE_GRAFANA_PASSWORD
      # BOXP-623: Alertmanager の状態 (silence / inhibit / 通知グループ) を Grafana Alerting の画面で読む。
      # 判定と通知の正本は Prometheus + Alertmanager のまま。handleGrafanaManagedAlerts を false に
      # 固定し、Grafana 管理ルールをこの Alertmanager へ送らない (二重通知・経路の混在を作らない)。
      # BOXP-623: UI で先に作られた同名データソース (url 空) がある。provisioning は名前で既存行を見つけ
      # uid で更新するため、uid を既存の値に合わせないと "data source not found" で Grafana が起動しない
      # (#1303 の CrashLoop)。uid は既存のまま引き継ぎ、url などをこの定義で上書きする。
      # 回帰テスト: tests/chainsaw/prometheus-operator
      - name: alertmanager
        uid: ee8z216blo1s0b
        type: alertmanager
        access: proxy
        url: http://alertmanager-main.monitoring.svc:9093
        isDefault: false
        editable: false
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60
