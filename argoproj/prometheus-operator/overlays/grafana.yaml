apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # upstream の checksum/grafana-config は overlay の変更を反映しないため、
        # grafana-config.yaml を変更したらこの値を更新して Pod を再作成する
        lolice.io/grafana-config-rev: "BOXP-210"
    spec:
      containers:
        - name: grafana
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /grafana-dashboard-definitions/0/local-llm-gpu-overview
              name: grafana-dashboard-local-llm-gpu-overview
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-dashboard-local-llm-gpu-overview
          configMap:
            name: grafana-dashboard-local-llm-gpu-overview
