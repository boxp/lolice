apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # upstream の checksum/grafana-config は overlay の変更を反映しないため、
        # grafana-config.yaml を変更したらこの値を更新して Pod を再作成する
        lolice.io/grafana-config-rev: "BOXP-472-query-timeout"
    spec:
      containers:
        - name: grafana
          env:
            # BOXP-472: grafana-datasources の provisioning が展開する view-only user の password
            - name: CLICKHOUSE_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-grafana-clickhouse
                  key: CLICKHOUSE_GRAFANA_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /grafana-dashboard-definitions/0/local-llm-gpu-overview
              name: grafana-dashboard-local-llm-gpu-overview
            - mountPath: /grafana-dashboard-definitions/0/ai-ops-quality
              name: grafana-dashboard-ai-ops-quality
            - mountPath: /grafana-dashboard-definitions/0/gemini-prepaid
              name: grafana-dashboard-gemini-prepaid
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-dashboard-local-llm-gpu-overview
          configMap:
            name: grafana-dashboard-local-llm-gpu-overview
        - name: grafana-dashboard-ai-ops-quality
          configMap:
            name: grafana-dashboard-ai-ops-quality
        - name: grafana-dashboard-gemini-prepaid
          configMap:
            name: grafana-dashboard-gemini-prepaid
