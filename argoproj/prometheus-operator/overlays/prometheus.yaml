apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: k8s
  namespace: monitoring
spec:
  replicas: 1
  # BOXP-692 段階1: 60 日保持。retentionSize は PVC 120Gi が満杯になる前に古いブロックを消す保険
  # （時間保持より先に容量で削除させ、PVC 満杯による停止を防ぐ）。90 日・200Gi は 1 か月の実測後に別途判断する。
  retention: 60d
  retentionSize: 100GB
  # アラートメール内の各アラートの Source リンク (generatorURL) の宛先。
  # 未設定だと Pod のアドレスになりリンクが機能しない。
  externalUrl: https://prometheus-web.b0xp.io
  tolerations:
    - key: lolice.io/gpu-worker
      operator: Equal
      value: "true"
      effect: NoSchedule
  enableFeatures:
    - otlp-write-receiver
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 4Gi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # 既存 PVC 本体は prometheus-k8s-db-pvc.yaml で拡張済み（operator は既存 PVC を拡張しない）。
            # この値の変更で operator は StatefulSet を作り直す（Pod は再起動、PVC は whenDeleted=Retain で残る）。
            storage: 120Gi
        storageClassName: longhorn
  scrapeConfigSelector:
    matchLabels:
      prometheus: system-monitoring-prometheus
  podMonitorSelector:
    matchLabels:
      release: prometheus
  # ServiceMonitor は kube-prometheus の共通ラベルを opt-in とする。同梱の基盤
  # Monitor と GitOps 管理 Monitor の双方にこのラベルを付け、namespace に残った
  # Helm 管理外の Monitor が所有者不明の TargetDown を発火させないようにする。
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/part-of: kube-prometheus
