apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: k8s
  namespace: monitoring
spec:
  replicas: 1
  retention: 31d
  # アラートメール内の各アラートの Source リンク (generatorURL) の宛先。
  # 未設定だと Pod のアドレスになりリンクが機能しない。
  externalUrl: https://prometheus-web.b0xp.io
  tolerations:
    - key: lolice.io/gpu-worker
      operator: Equal
      value: "true"
      effect: NoSchedule
  enableFeatures:
    - otlp-write-receiver
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 4Gi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 60Gi
        storageClassName: longhorn
  scrapeConfigSelector:
    matchLabels:
      prometheus: system-monitoring-prometheus
  podMonitorSelector:
    matchLabels:
      release: prometheus
  # ServiceMonitor は kube-prometheus の共通ラベルを opt-in とする。同梱の基盤
  # Monitor と GitOps 管理 Monitor の双方にこのラベルを付け、namespace に残った
  # Helm 管理外の Monitor が所有者不明の TargetDown を発火させないようにする。
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/part-of: kube-prometheus
