apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-subscription-forecast-rules
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
    release: prometheus
spec:
  # BOXP-462: AI 利用枠（subscription window）の「reset 前に尽きるか」の予測。
  # 成果 SLO の burn（ai-ops-outcome-rules.yaml）や、いま rejected かどうか
  # （ai-provider-quota-rules.yaml）とは別の判断材料で、両者を置き換えない。
  #
  # 入力は codex-workspace の ai-ops-metrics exporter が出す gauge:
  #   used = ai_subscription_window_used_percent（1% 刻み）
  #   reset = ai_subscription_window_resets_at_seconds
  #   observed = ai_subscription_window_observed_timestamp_seconds
  # 判断の式: 残量 R = 100 - used、残時間 T = reset - now、最近の速度 v [pt/h]。
  # burn ratio = v * T / (R - 予備 5pt)。1 以上なら「この速度のまま reset 前に尽きる」。
  # 週の経過率や固定の残率では判断しない。
  #
  # - provider/name/limit/window ごとに別の制約として扱い、共有枠と専用枠を足さない。
  # - pod/instance ラベルは集約で落とす（再起動で系列が変わり for が reset する問題を避ける）。
  #   同時に 2 系列あるときは観測時刻が最新の系列の値を採る（古い pod の値を max で優先しない）。
  # - used は gauge なので rate()/increase() は使わない。差分は同じ reset 窓の中だけで取り、
  #   reset 時刻が変わった・used が下がった区間は速度を出さない（欠測として扱い 0 にしない）。
  # - 速度の窓は 7d 窓に対して短期 6h・長期 24h。window の開始から 24h 未満のときは
  #   長期を「開始からの平均」で代用する（開始時 used=0 とみなす。6h 未満は判断しない）。
  # - 予測は観測が 2h 以内に新しい窓だけ。古い・未提供・未対応の窓は
  #   AiSubscriptionWindowForecastUnavailable（info）で「不明」と明示する。
  # 閾値はすべて暫定（quota-forecast/v1-draft）。
  groups:
    - name: ai-subscription-forecast
      rules:
        - record: ai_subscription:window_observed_timestamp_seconds:latest
          expr: |
            max by (provider, name, limit, window) (
              ai_subscription_window_observed_timestamp_seconds{job="codex-workspace-ai-ops-metrics"}
            )
        - record: ai_subscription:window_used_percent:latest
          expr: |
            max by (provider, name, limit, window) (
              ai_subscription_window_used_percent{job="codex-workspace-ai-ops-metrics"}
              and
              (
                ai_subscription_window_observed_timestamp_seconds{job="codex-workspace-ai-ops-metrics"}
                == on (provider, name, limit, window) group_left ()
                max by (provider, name, limit, window) (
                  ai_subscription_window_observed_timestamp_seconds{job="codex-workspace-ai-ops-metrics"}
                )
              )
            )
        - record: ai_subscription:window_resets_at_seconds:latest
          expr: |
            max by (provider, name, limit, window) (
              ai_subscription_window_resets_at_seconds{job="codex-workspace-ai-ops-metrics"}
              and
              (
                ai_subscription_window_observed_timestamp_seconds{job="codex-workspace-ai-ops-metrics"}
                == on (provider, name, limit, window) group_left ()
                max by (provider, name, limit, window) (
                  ai_subscription_window_observed_timestamp_seconds{job="codex-workspace-ai-ops-metrics"}
                )
              )
            )
        - record: ai_subscription:window_duration_seconds:latest
          expr: |
            max by (provider, name, limit, window) (
              ai_subscription_window_duration_seconds{job="codex-workspace-ai-ops-metrics"}
            )
        - record: ai_subscription:window_remaining_seconds
          expr: |
            (ai_subscription:window_resets_at_seconds:latest - time()) > 0
        - record: ai_subscription:window_observation_age_seconds
          expr: |
            time() - ai_subscription:window_observed_timestamp_seconds:latest
        # window の開始からの経過（reset - duration を開始とみなす）
        - record: ai_subscription:window_elapsed_seconds
          expr: |
            time() - (
              ai_subscription:window_resets_at_seconds:latest
              - on (provider, name, limit, window) ai_subscription:window_duration_seconds:latest
            )
        # 同じ reset 窓の中での used の増分。記録済み系列が無い期間（導入直後）は生の系列で補う。
        - record: ai_subscription:window_used_increase_percent:6h
          expr: |
            (
              (
                ai_subscription:window_used_percent:latest{window="7d"}
                - on (provider, name, limit, window)
                (
                  ai_subscription:window_used_percent:latest{window="7d"} offset 6h
                  or
                  max by (provider, name, limit, window) (
                    ai_subscription_window_used_percent{job="codex-workspace-ai-ops-metrics",window="7d"} offset 6h
                  )
                )
              ) >= 0
            )
            and on (provider, name, limit, window)
            (
              abs(
                ai_subscription:window_resets_at_seconds:latest{window="7d"}
                - on (provider, name, limit, window)
                (
                  ai_subscription:window_resets_at_seconds:latest{window="7d"} offset 6h
                  or
                  max by (provider, name, limit, window) (
                    ai_subscription_window_resets_at_seconds{job="codex-workspace-ai-ops-metrics",window="7d"} offset 6h
                  )
                )
              ) < 3600
            )
        - record: ai_subscription:window_used_increase_percent:24h
          expr: |
            (
              (
                ai_subscription:window_used_percent:latest{window="7d"}
                - on (provider, name, limit, window)
                (
                  ai_subscription:window_used_percent:latest{window="7d"} offset 24h
                  or
                  max by (provider, name, limit, window) (
                    ai_subscription_window_used_percent{job="codex-workspace-ai-ops-metrics",window="7d"} offset 24h
                  )
                )
              ) >= 0
            )
            and on (provider, name, limit, window)
            (
              abs(
                ai_subscription:window_resets_at_seconds:latest{window="7d"}
                - on (provider, name, limit, window)
                (
                  ai_subscription:window_resets_at_seconds:latest{window="7d"} offset 24h
                  or
                  max by (provider, name, limit, window) (
                    ai_subscription_window_resets_at_seconds{job="codex-workspace-ai-ops-metrics",window="7d"} offset 24h
                  )
                )
              ) < 3600
            )
        # 速度 [percentage points / hour]
        - record: ai_subscription:window_used_rate_percent_per_hour:6h
          expr: |
            ai_subscription:window_used_increase_percent:6h / 6
        - record: ai_subscription:window_used_rate_percent_per_hour:24h
          expr: |
            (ai_subscription:window_used_increase_percent:24h / 24)
            or on (provider, name, limit, window)
            (
              ai_subscription:window_used_percent:latest{window="7d"}
              / on (provider, name, limit, window) (ai_subscription:window_elapsed_seconds / 3600)
              and on (provider, name, limit, window) (ai_subscription:window_elapsed_seconds >= 21600)
              and on (provider, name, limit, window) (ai_subscription:window_elapsed_seconds < 86400)
            )
        # burn ratio = 速度のまま reset まで使った量 / 予備 5pt を除いた残量
        - record: ai_subscription:window_burn_ratio:6h
          expr: |
            ai_subscription:window_used_rate_percent_per_hour:6h
            * on (provider, name, limit, window) (ai_subscription:window_remaining_seconds / 3600)
            / on (provider, name, limit, window) clamp_min(100 - 5 - ai_subscription:window_used_percent:latest, 0.5)
        - record: ai_subscription:window_burn_ratio:24h
          expr: |
            ai_subscription:window_used_rate_percent_per_hour:24h
            * on (provider, name, limit, window) (ai_subscription:window_remaining_seconds / 3600)
            / on (provider, name, limit, window) clamp_min(100 - 5 - ai_subscription:window_used_percent:latest, 0.5)
        # 短期の速度のまま使い切るまでの秒数（速度 0 のときは出さない）
        - record: ai_subscription:window_exhaustion_eta_seconds:6h
          expr: |
            clamp_min(100 - ai_subscription:window_used_percent:latest, 0)
            / on (provider, name, limit, window) (ai_subscription:window_used_rate_percent_per_hour:6h > 0)
            * 3600

        # ---- alerts（records と同じ group に置き、評価順を固定して注釈の値をずらさない）----
        - alert: AiSubscriptionWindowExhaustionForecast
          # 持続傾向: 長期（24h）と短期（6h）の両方で reset 前に尽きる速度。
          expr: |
            ai_subscription:window_burn_ratio:24h >= 1
            and on (provider, name, limit, window) ai_subscription:window_burn_ratio:6h >= 1
            and on (provider, name, limit, window) ai_subscription:window_used_rate_percent_per_hour:24h >= 0.125
            and on (provider, name, limit, window) ai_subscription:window_remaining_seconds > 3600
            and on (provider, name, limit, window) ai_subscription:window_observation_age_seconds <= 7200
            and on (provider, name, limit, window) ai_subscription:window_used_percent:latest < 100
          for: 30m
          keep_firing_for: 1h
          labels:
            severity: warning
            component: ai-ops
            definition_version: quota-forecast/v1-draft
            reason: sustained_burn
            notify_hermes: "true"
          annotations:
            summary: '{{ $labels.provider }}/{{ $labels.name }} の利用枠が reset 前に尽きる見込み'
            description: |
              {{ $labels.provider }}/{{ $labels.name }}（limit={{ $labels.limit }} window={{ $labels.window }}）
              使用 {{ with query (printf "ai_subscription:window_used_percent:latest{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.0f" }}{{ else }}不明{{ end }}%
              速度 6h={{ with query (printf "ai_subscription:window_used_rate_percent_per_hour:6h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }}pt/h 24h={{ with query (printf "ai_subscription:window_used_rate_percent_per_hour:24h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }}pt/h
              短期速度での枯渇まで {{ with query (printf "ai_subscription:window_exhaustion_eta_seconds:6h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | humanizeDuration }}{{ else }}不明{{ end }}
              reset まで {{ with query (printf "ai_subscription:window_remaining_seconds{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | humanizeDuration }}{{ else }}不明{{ end }}
              観測の古さ {{ with query (printf "ai_subscription:window_observation_age_seconds{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | humanizeDuration }}{{ else }}不明{{ end }}
              burn ratio 6h={{ with query (printf "ai_subscription:window_burn_ratio:6h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }} 24h={{ with query (printf "ai_subscription:window_burn_ratio:24h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }}（1 以上 = この速度のまま reset 前に尽きる。予備 5pt を除く）
              予測は点推定で、休止・バースト・1% 刻み・観測の欠けで外れる。閾値は暫定。
            dashboard: https://grafana.b0xp.io/d/ai-ops-quality
            runbook_next_actions: 許可された次 action = 消費経路の確認（token 量は quota% の内訳ではない）・証拠の記録・Owner への緩和候補の提示。禁止 = 新しい課金や追加 credits、別 account、既定 model の変更、cron の無断停止、実行中 task の強制停止、claim 削除、予算 reset。
        - alert: AiSubscriptionWindowExhaustionImminent
          # 短期の速度で 24h 以内に尽き、それが reset より前。
          expr: |
            ai_subscription:window_exhaustion_eta_seconds:6h < 86400
            and on (provider, name, limit, window)
              (ai_subscription:window_exhaustion_eta_seconds:6h < on (provider, name, limit, window) ai_subscription:window_remaining_seconds)
            and on (provider, name, limit, window) ai_subscription:window_used_increase_percent:6h >= 2
            and on (provider, name, limit, window) ai_subscription:window_observation_age_seconds <= 7200
            and on (provider, name, limit, window) ai_subscription:window_used_percent:latest < 100
          for: 15m
          keep_firing_for: 1h
          labels:
            severity: critical
            component: ai-ops
            definition_version: quota-forecast/v1-draft
            reason: fast_exhaustion
            notify_hermes: "true"
          annotations:
            summary: '{{ $labels.provider }}/{{ $labels.name }} の利用枠が reset 前に尽きる見込み'
            description: |
              {{ $labels.provider }}/{{ $labels.name }}（limit={{ $labels.limit }} window={{ $labels.window }}）
              使用 {{ with query (printf "ai_subscription:window_used_percent:latest{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.0f" }}{{ else }}不明{{ end }}%
              速度 6h={{ with query (printf "ai_subscription:window_used_rate_percent_per_hour:6h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }}pt/h 24h={{ with query (printf "ai_subscription:window_used_rate_percent_per_hour:24h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }}pt/h
              短期速度での枯渇まで {{ with query (printf "ai_subscription:window_exhaustion_eta_seconds:6h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | humanizeDuration }}{{ else }}不明{{ end }}
              reset まで {{ with query (printf "ai_subscription:window_remaining_seconds{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | humanizeDuration }}{{ else }}不明{{ end }}
              観測の古さ {{ with query (printf "ai_subscription:window_observation_age_seconds{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | humanizeDuration }}{{ else }}不明{{ end }}
              burn ratio 6h={{ with query (printf "ai_subscription:window_burn_ratio:6h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }} 24h={{ with query (printf "ai_subscription:window_burn_ratio:24h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }}（1 以上 = この速度のまま reset 前に尽きる。予備 5pt を除く）
              予測は点推定で、休止・バースト・1% 刻み・観測の欠けで外れる。閾値は暫定。
            dashboard: https://grafana.b0xp.io/d/ai-ops-quality
            runbook_next_actions: 許可された次 action = 消費経路の確認（token 量は quota% の内訳ではない）・証拠の記録・Owner への緩和候補の提示。禁止 = 新しい課金や追加 credits、別 account、既定 model の変更、cron の無断停止、実行中 task の強制停止、claim 削除、予算 reset。
        - alert: AiSubscriptionWindowExhaustionImminent
          # 上限に達した。Claude は status=rejected を AiProviderQuotaExhausted が扱うので、
          # status を出さない provider（Codex 等）だけを対象にする。
          expr: |
            (
              ai_subscription:window_used_percent:latest >= 100
              and on (provider, name, limit, window) ai_subscription:window_remaining_seconds > 0
              and on (provider, name, limit, window) ai_subscription:window_observation_age_seconds <= 7200
            )
            unless on (provider, name, limit)
              ai_subscription_window_status{job="codex-workspace-ai-ops-metrics"}
          for: 5m
          labels:
            severity: critical
            component: ai-ops
            definition_version: quota-forecast/v1-draft
            reason: exhausted
            notify_hermes: "true"
          annotations:
            summary: '{{ $labels.provider }}/{{ $labels.name }} の利用枠が上限に達した'
            description: |
              {{ $labels.provider }}/{{ $labels.name }}（limit={{ $labels.limit }} window={{ $labels.window }}）
              使用 {{ with query (printf "ai_subscription:window_used_percent:latest{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.0f" }}{{ else }}不明{{ end }}%
              速度 6h={{ with query (printf "ai_subscription:window_used_rate_percent_per_hour:6h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }}pt/h 24h={{ with query (printf "ai_subscription:window_used_rate_percent_per_hour:24h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }}pt/h
              短期速度での枯渇まで {{ with query (printf "ai_subscription:window_exhaustion_eta_seconds:6h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | humanizeDuration }}{{ else }}不明{{ end }}
              reset まで {{ with query (printf "ai_subscription:window_remaining_seconds{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | humanizeDuration }}{{ else }}不明{{ end }}
              観測の古さ {{ with query (printf "ai_subscription:window_observation_age_seconds{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | humanizeDuration }}{{ else }}不明{{ end }}
              burn ratio 6h={{ with query (printf "ai_subscription:window_burn_ratio:6h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }} 24h={{ with query (printf "ai_subscription:window_burn_ratio:24h{provider=%q,name=%q,limit=%q}" $labels.provider $labels.name $labels.limit) }}{{ . | first | value | printf "%.2f" }}{{ else }}不明{{ end }}（1 以上 = この速度のまま reset 前に尽きる。予備 5pt を除く）
              予測は点推定で、休止・バースト・1% 刻み・観測の欠けで外れる。閾値は暫定。
            dashboard: https://grafana.b0xp.io/d/ai-ops-quality
            runbook_next_actions: 許可された次 action = 消費経路の確認（token 量は quota% の内訳ではない）・証拠の記録・Owner への緩和候補の提示。禁止 = 新しい課金や追加 credits、別 account、既定 model の変更、cron の無断停止、実行中 task の強制停止、claim 削除、予算 reset。

        - alert: AiSubscriptionWindowForecastUnavailable
          # 記録済みの reset 時刻を過ぎても観測が更新されない窓は、現在の窓が不明なので出し続ける
          # （remaining_seconds を条件にすると reset 経過で消えてしまう）。
          expr: |
            ai_subscription:window_observation_age_seconds > 7200
          for: 30m
          labels:
            severity: info
            component: ai-ops
            definition_version: quota-forecast/v1-draft
            reason: stale
          annotations:
            summary: '{{ $labels.provider }}/{{ $labels.name }} の枯渇予測ができない（観測が古い）'
            description: 観測が 2 時間以上更新されていない。消費が無いのか観測が止まったのかは区別できない。消費ゼロとも利用可能とも読まない。
            runbook_next_actions: 許可された次 action = 不明として扱う・証拠の記録。禁止 = 観測のための再試行の連打。
        - alert: AiSubscriptionWindowForecastUnavailable
          expr: |
            ai_subscription:window_used_percent:latest unless on (provider, name, limit, window) ai_subscription:window_used_percent:latest{window="7d"}
          for: 1h
          labels:
            severity: info
            component: ai-ops
            definition_version: quota-forecast/v1-draft
            reason: unsupported_window
          annotations:
            summary: '{{ $labels.provider }}/{{ $labels.name }}（window={{ $labels.window }}）は枯渇予測の対象外'
            description: 予測の速度窓は 7d の窓にだけ定義している。この窓は監視していない（未監視）。
            runbook_next_actions: 許可された次 action = 未監視として扱う・ルール追加の起票。
        - alert: AiSubscriptionWindowForecastUnavailable
          expr: |
            max by (provider, name, limit) (ai_subscription_window_present{job="codex-workspace-ai-ops-metrics"}) == 0
          for: 1h
          labels:
            severity: info
            component: ai-ops
            definition_version: quota-forecast/v1-draft
            reason: not_provided
          annotations:
            summary: '{{ $labels.provider }}/{{ $labels.name }} の窓は観測元が提供していない'
            description: 観測元がこの窓の値を返していない。枠が無いのか取得できないのかは区別できず、未監視として扱う。
            runbook_next_actions: 許可された次 action = 未監視として扱う。
        - alert: AiSubscriptionWindowForecastUnavailable
          # Claude の観測元は AiProviderQuotaObservationStale（reason=source_unavailable）が扱う。
          expr: |
            (max by (provider) (ai_subscription_source_up{job="codex-workspace-ai-ops-metrics",provider!="claude"}) == 0)
            or absent(ai_subscription_source_up{job="codex-workspace-ai-ops-metrics",provider="codex"})
          for: 1h
          labels:
            severity: info
            component: ai-ops
            definition_version: quota-forecast/v1-draft
            reason: source_unavailable
          annotations:
            summary: '{{ $labels.provider }} の利用枠の観測元を読めない'
            description: 観測元を読めないか系列が無い。枯渇予測はできず、利用可能とも読まない。
            runbook_next_actions: 許可された次 action = 不明として扱う・証拠の記録・切分け。禁止 = Pod/Hermes の再起動。
