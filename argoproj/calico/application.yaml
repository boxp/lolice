apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calico
  namespace: argocd
  annotations:
    # BOXP-619 C1: Argo CD v3.6.2 の server-side diff は、CRD chart (crd.projectcalico.org.v1 v3.32.4) へ移った
    # whiskers.operator.tigera.io の dry-run で "spec.versions: null" と判定して比較自体が失敗し (ComparisonError)、
    # 自動同期が止まる (管理者の素の SSA dry-run では同じ CRD は正常)。BOXP-501 / BOXP-533 と同じく client-side diff に戻す。
    # 適用は引き続き ServerSideApply=true。
    argocd.argoproj.io/compare-options: ServerSideDiff=false
spec:
  destination:
    namespace: tigera-operator
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://github.com/boxp/lolice
      targetRevision: main
      ref: lolice
    # BOXP-619 C1: 3.32 から tigera-operator chart に CRD が含まれないため、
    # 同じ版の CRD chart を同じ app に加えて CRD 32 件を desired state に残す。
    - repoURL: https://docs.tigera.io/calico/charts
      targetRevision: v3.33.1
      chart: crd.projectcalico.org.v1
    - repoURL: https://docs.tigera.io/calico/charts
      targetRevision: v3.33.1
      chart: tigera-operator
      helm:
        valueFiles:
          - $lolice/argoproj/calico/values.yaml
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields
      # BOXP-619 C1: managedFieldsManagers: [argocd-controller] は Argo 自身が適用した CRD の全フィールド
      # (spec.versions を含む) を無視対象にし、RespectIgnoreDifferences と組み合わさって CRD 更新を止めるため外した。
