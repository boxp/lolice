name: promtool rules test
on:
  pull_request:
    paths:
      - 'argoproj/prometheus-operator/*-rules.yaml'
      - 'argoproj/prometheus-operator/tests/**'
      - '.github/workflows/promtool-rules-test.yaml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: argoproj/prometheus-operator/tests/run-promtool-tests.sh
