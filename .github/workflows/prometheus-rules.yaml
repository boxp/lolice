name: Prometheus Rule Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'argoproj/prometheus-operator/**'
      - 'scripts/test-prometheus-rules.sh'
      - '.github/workflows/prometheus-rules.yaml'

jobs:
  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install promtool
        run: |
          curl --fail --location --silent --show-error \
            --output prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          tar --extract --gzip --file prometheus.tar.gz prometheus-3.5.0.linux-amd64/promtool
          install -m 0755 prometheus-3.5.0.linux-amd64/promtool /usr/local/bin/promtool
      - name: Check and evaluate Prometheus rules
        run: scripts/test-prometheus-rules.sh
