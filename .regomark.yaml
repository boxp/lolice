# ADR の構造検査 (deny) と、opt-in の意味検査 (warn) の設定。
# 説明: .regomark/README.md
documents: docs/adr
policy: .regomark/policy
entrypoint: adr
skip_rules: []
# ADR ではない 2 ファイルだけを名指しで除外する。glob にして実 ADR を検査から漏らさない。
exclude:
  - docs/adr/README.md
  - docs/adr/template.md
# --judge または REGOMARK_JUDGE=on を利用者が指定したときだけ動く。必須 CI では動かさない。
judge:
  command: [sh, -c, 'claude -p --output-format json --model sonnet --tools "" --json-schema "$REGOMARK_ANSWER_SCHEMA"']
  parallel: 2
  timeout: 90s
  # 1 ADR につき 3 問。超えると exit 2 で止まる (--no-judge の構造検査には影響しない)。
  max_questions: 30
