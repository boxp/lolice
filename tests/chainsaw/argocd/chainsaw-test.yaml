apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: argocd-dynamic-validation
spec:
  description: |
    ArgoCD コア Deployment の起動、fixture manifest生成/syncと、
    通常PR CIのCalico環境でNetworkPolicy許可/拒否を動的に検証する。
    マニフェストの適用は GHA ワークフロー側で実施済み。
    cloudflared実稼働・外部認証経路はシークレット依存のため検証対象外。
  steps:
  - name: require-isolated-kind
    try:
    - script:
        timeout: 15s
        content: |
          set -eu
          case "${CHAINSAW_KIND_CONTEXT:-}" in
            kind-*) ;;
            *) echo "An explicit isolated kind context is required; this suite is not read-only." >&2; exit 1 ;;
          esac
          : "${CHAINSAW_KIND_KUBECONFIG:?An isolated kubeconfig is required}"
          test -r "$CHAINSAW_KIND_KUBECONFIG"
          test "$(kubectl --kubeconfig "$CHAINSAW_KIND_KUBECONFIG" config current-context)" = "$CHAINSAW_KIND_CONTEXT"
          expected_server="$(kubectl --kubeconfig "$CHAINSAW_KIND_KUBECONFIG" config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          actual_server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          test -n "$expected_server"
          test "$actual_server" = "$expected_server"
  - name: wait-for-argocd-ready
    try:
    - script:
        timeout: 360s
        content: |
          set -e
          echo "=== ArgoCD コア Deployment の起動待機 ==="
          for DEPLOY in argocd-server argocd-repo-server argocd-dex-server argocd-notifications-controller argocd-applicationset-controller argocd-redis; do
            echo "Waiting for deployment/$DEPLOY ..."
            kubectl wait deployment/$DEPLOY \
              -n argocd \
              --for=condition=Available \
              --timeout=300s
          done

          echo "=== ArgoCD ApplicationController (StatefulSet) の起動待機 ==="
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=300s

          echo "=== 実行中の Pod 確認 ==="
          kubectl get pods -n argocd
          echo "ArgoCD 動的検証: 全コアコンポーネント Available"

  - name: fixture-manifest-generation-and-reconcile
    try:
    - script:
        timeout: 900s
        content: |
          set -eu
          bash "${REPO_ROOT}/tests/chainsaw/argocd/fixture-reconcile.sh"

  - name: network-policy-impact-matrix
    try:
    - script:
        timeout: 900s
        content: |
          set -eu
          bash "${REPO_ROOT}/tests/chainsaw/argocd/network-policy-impact.sh"
