apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: argocd-dynamic-validation
spec:
  description: |
    ArgoCD マニフェストを kind クラスターに実際に適用し、
    コア Deployment が Available になることを動的に検証する。
    ExternalSecret リソースおよびcloudflared（外部シークレット依存）は
    kind 環境では接続不可のためスキップ。
  steps:
  - name: install-crds
    try:
    - script:
        timeout: 300s
        content: |
          set -e
          echo "=== ArgoCD CRD インストール（v3.5.2）==="
          curl -sL "https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/manifests/install.yaml" \
            | yq 'select(.kind == "CustomResourceDefinition")' \
            | kubectl apply --server-side --force-conflicts -f -

          echo "=== External Secrets Operator CRD インストール（v0.18.2）==="
          helm repo add external-secrets https://charts.external-secrets.io --force-update
          helm template external-secrets external-secrets/external-secrets --version 0.18.2 \
            | yq 'select(.kind == "CustomResourceDefinition")' \
            | kubectl apply --server-side --force-conflicts -f -

          echo "=== CRD 登録待機 ==="
          kubectl wait --for=condition=established --timeout=120s crd --all

          echo "=== argocd Namespace 作成 ==="
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          echo "準備完了"

  - name: apply-manifests
    try:
    - script:
        timeout: 300s
        content: |
          set -e
          echo "=== kustomize build (argocd) ==="
          kustomize build "${REPO_ROOT}/argoproj/argocd/" > /tmp/argocd-manifest.yaml
          echo "リソース数: $(grep -c '^kind:' /tmp/argocd-manifest.yaml || true)"

          echo "=== ExternalSecret および cloudflared を除いてクラスターへ実際に適用 ==="
          # ExternalSecret: kind 環境ではシークレットストア未接続のためスキップ
          # cloudflared: tunnel-credentials secret が ExternalSecret 依存のためスキップ
          yq 'select(.kind != "ExternalSecret" and .metadata.name != "cloudflared")' /tmp/argocd-manifest.yaml \
            | kubectl apply --server-side --force-conflicts -f -
          echo "適用完了"

  - name: wait-for-ready
    try:
    - script:
        timeout: 360s
        content: |
          set -e
          echo "=== ArgoCD コア Deployment の起動待機 ==="
          for DEPLOY in argocd-server argocd-repo-server argocd-dex-server argocd-notifications-controller argocd-applicationset-controller argocd-redis; do
            echo "Waiting for deployment/$DEPLOY ..."
            kubectl wait deployment/$DEPLOY \
              -n argocd \
              --for=condition=Available \
              --timeout=300s
          done

          echo "=== ArgoCD ApplicationController (StatefulSet) の起動待機 ==="
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=300s

          echo "=== 実行中の Pod 確認 ==="
          kubectl get pods -n argocd
          echo "ArgoCD 動的検証: 全コアコンポーネント Available"
