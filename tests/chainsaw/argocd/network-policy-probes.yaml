# NetworkPolicy 許可/拒否 matrix の probe。許可ラベルを持つ同 namespace の Pod、非許可の Pod、
# 別 namespace から同じラベルを詐称する Pod を DNS が引ける状態で比較する。
# python が PID 1 だと SIGTERM を無視して terminationGracePeriod を使い切るため短くする。
apiVersion: v1
kind: Namespace
metadata:
  name: netpol-spoof
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: "argocd-server"
spec:
  hostNetwork: false
  terminationGracePeriodSeconds: 1
  containers:
    - name: probe
      image: python:3.13-alpine
      command: ["python", "-c", "import time; time.sleep(1800)"]
      readinessProbe:
        exec:
          command: ["false"]
        periodSeconds: 5
---
