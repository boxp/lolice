apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kube-vip-dynamic-validation
spec:
  description: |
    kube-vip DaemonSet が kind クラスターに作成されることを動的に検証する。
    マニフェストの適用は GHA ワークフロー側で実施済み。
    kube-vip は hostNetwork + VIP 管理が必要なため kind では Pod は Ready にならないが、
    DaemonSet が作成されることでマニフェストの正当性を動的に確認できる。
  steps:
  - name: require-isolated-kind
    try:
    - script:
        timeout: 15s
        content: '"${REPO_ROOT}/tests/workflows/require-isolated-kind.sh"'
  - name: verify-daemonset-created
    try:
    - assert:
        timeout: 60s
        resource:
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: kube-vip-ds
            namespace: kube-system
          status:
            (desiredNumberScheduled > `0`): true
  - name: apply-application-yaml
    description: |
      native apply は Create/MergePatch で strict field validation がなく、test 後に削除も
      するので、本番 Application の検証は kubectl の server-side apply のまま行う。
    try:
    - command:
        timeout: 60s
        entrypoint: kubectl
        # シェルは介さないが、Chainsaw が exec 前に args の環境変数を展開する (env.Expand)。
        # REPO_ROOT が未設定なら文字列のまま kubectl に渡り、この step は失敗する。
        args:
        - apply
        - --server-side
        - --force-conflicts
        - -f
        - $REPO_ROOT/argoproj/kube-vip/application.yaml
