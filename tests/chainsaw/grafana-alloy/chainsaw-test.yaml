apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: grafana-alloy-dynamic-validation
spec:
  description: |
    Grafana Alloy のコンテナログ収集 (loki.source.file + local.file_match) が
    全ノードのログを Loki へ届けることを kind クラスターで動的に検証する。
    BOXP-254 (loki.source.file に glob を直接渡して 3.5 か月ログ収集が止まった) の
    再発防止テスト。ConfigMap / ServiceMonitor の kustomize 適用は GHA ワークフロー側で実施済み。
    Application は本物の Argo CD (argocd suite) に先回りして同期されないよう suite の最後に適用する。
    Loki 本体は使い捨て fixture を使う。
  steps:
  - name: require-isolated-kind
    try:
    - script:
        timeout: 15s
        content: '"${REPO_ROOT}/tests/workflows/require-isolated-kind.sh" --loopback'

  - name: verify-manifests-applied
    try:
    - assert:
        timeout: 60s
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: alloy-config
            namespace: monitoring
    - assert:
        # part-of が kube-prometheus でないと Prometheus の serviceMonitorSelector に
        # 一致せず、Alloy のメトリクスが取り込まれない。
        timeout: 60s
        resource:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: grafana-alloy
            namespace: monitoring
            labels:
              app.kubernetes.io/part-of: kube-prometheus

  - name: config-wiring-expands-globs
    try:
    - script:
        timeout: 60s
        content: '"${REPO_ROOT}/tests/chainsaw/grafana-alloy/log-pipeline.sh" config_wiring'

  - name: start-loki-alloy-and-curl-fixture
    # 3 つは互いに依存しないので先に全部作り、イメージ pull と起動を重ねる。
    # 使い捨て kind で片付けない方針を維持する (Chainsaw の削除待ちを増やさない)。
    skipDelete: true
    try:
    - apply:
        timeout: 60s
        file: loki-fixture.yaml
    - script:
        timeout: 360s
        content: '"${REPO_ROOT}/tests/chainsaw/grafana-alloy/log-pipeline.sh" install_alloy_chart'
    - apply:
        timeout: 60s
        file: curl-pod.yaml

  - name: fixtures-rolled-out
    try:
    - assert:
        # kubectl rollout status deployment と同じ完了条件。
        timeout: 240s
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: chainsaw-loki
            namespace: monitoring
          (status.observedGeneration >= metadata.generation): true
          (status.updatedReplicas >= spec.replicas): true
          (status.replicas == status.updatedReplicas): true
          (status.availableReplicas >= status.updatedReplicas): true
    - assert:
        # kubectl rollout status daemonset と同じ完了条件。全 Pod Ready と全ノード配置まで見る。
        timeout: 300s
        resource:
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: grafana-alloy
            namespace: monitoring
          (status.observedGeneration >= metadata.generation): true
          (status.updatedNumberScheduled >= status.desiredNumberScheduled): true
          (status.numberAvailable >= status.desiredNumberScheduled): true
          (status.numberReady == status.desiredNumberScheduled): true
          (status.desiredNumberScheduled >= length(x_k8s_list($client, 'v1', 'Node', '').items)): true
          (status.desiredNumberScheduled <= length(x_k8s_list($client, 'v1', 'Node', '').items)): true
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: monitoring
        name: chainsaw-curl
        timeout: 180s
        for:
          condition:
            name: Ready
    catch: &alloy-diagnostics
    - script:
        timeout: 60s
        content: '"${REPO_ROOT}/tests/chainsaw/grafana-alloy/log-pipeline.sh" diagnose'

  - name: logs-reach-loki-from-every-node
    try:
    - script:
        timeout: 360s
        content: '"${REPO_ROOT}/tests/chainsaw/grafana-alloy/log-pipeline.sh" logs_reach_loki_from_every_node'

  - name: loki-labels-and-monitoring-logs
    try:
    - script:
        timeout: 60s
        content: '"${REPO_ROOT}/tests/chainsaw/grafana-alloy/log-pipeline.sh" labels_and_monitoring_logs'

  - name: alloy-self-metrics
    try:
    - script:
        timeout: 120s
        content: '"${REPO_ROOT}/tests/chainsaw/grafana-alloy/log-pipeline.sh" alloy_self_metrics'

  # Application は最後に適用する。先に適用すると、argocd suite が起動した本物の Argo CD が
  # automated sync で Alloy chart を展開し、log-pipeline.sh の helm install と衝突する。
  - name: apply-application-yaml
    try:
    - command:
        timeout: 60s
        entrypoint: kubectl
        # シェルは介さないが、Chainsaw が exec 前に args の環境変数を展開する (env.Expand)。
        # REPO_ROOT が未設定なら文字列のまま kubectl に渡り、この step は失敗する。
        args:
        - apply
        - --server-side
        - --force-conflicts
        - -f
        - $REPO_ROOT/argoproj/grafana-alloy/application.yaml

# BOXP-475 main verification (do not merge)
