apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: langfuse-self-host
spec:
  description: |
    BOXP-428: 本番 render の Langfuse を隔離 kind で実際に起動し、ESO generator の Secret、
    producer の最小権限、Calico で強制される通信制限、OTLP 取込から ClickHouse/MinIO まで、
    retention job の削除を検査する。Secret はクラスタ内で生成された合成値だけを使う。
    kind に無い依存 (Cloudflare tunnel/Access、Parameter Store、Longhorn) はここでは検査せず、
    render-fixture.sh の置換範囲を境界として本番で別途確認する。
  timeouts:
    exec: 10m
  steps:
  - name: require-isolated-kind
    try:
    - script:
        timeout: 15s
        content: '"${REPO_ROOT}/tests/workflows/require-isolated-kind.sh"'
  - name: install-eso-and-apply-rendered-stack
    try:
    - script:
        timeout: 840s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" deploy_stack'
    cleanup:
    - script:
        timeout: 30s
        content: kubectl delete namespace langfuse langfuse-outside hermes-agent --ignore-not-found --wait=false
  - name: external-secrets-ready
    try:
    - wait:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        namespace: langfuse
        name: langfuse-secrets
        timeout: 120s
        for:
          condition:
            name: Ready
    - wait:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        namespace: langfuse
        name: langfuse-ingest-key
        timeout: 120s
        for:
          condition:
            name: Ready
    catch:
    - script:
        timeout: 30s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" diagnose'
  - name: oidc-fixture
    skipDelete: true
    try:
    - script:
        timeout: 840s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" deploy_oidc_fixture'
    - apply:
        timeout: 60s
        file: oidc-fixture.yaml
  - name: workloads-ready
    try:
    - wait:
        apiVersion: apps/v1
        kind: Deployment
        namespace: langfuse
        timeout: 420s
        for:
          condition:
            name: Available
    - assert:
        timeout: 120s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: langfuse-postgres
            namespace: langfuse
          (status.observedGeneration >= metadata.generation && status.readyReplicas >= spec.replicas && status.updateRevision == status.currentRevision): true
    - assert:
        timeout: 120s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: langfuse-clickhouse
            namespace: langfuse
          (status.observedGeneration >= metadata.generation && status.readyReplicas >= spec.replicas && status.updateRevision == status.currentRevision): true
    - assert:
        timeout: 120s
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: langfuse-minio
            namespace: langfuse
          (status.observedGeneration >= metadata.generation && status.readyReplicas >= spec.replicas && status.updateRevision == status.currentRevision): true
    catch:
    - script:
        timeout: 30s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" diagnose'
  - name: priority-class
    try:
    - script:
        timeout: 840s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" priority_class'
  - name: postgres-existing-data
    try:
    - script:
        timeout: 180s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" postgres_existing_data'
  - name: secrets-and-rbac
    try:
    - script:
        timeout: 60s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" secrets_and_rbac'
  - name: producer-ingest-key
    try:
    - script:
        timeout: 300s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" producer_ingest_key'
  - name: network-policy-probes
    skipDelete: true
    try:
    - apply:
        timeout: 60s
        file: network-policy-probes.yaml
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: hermes-agent
        name: hermes-allowed
        timeout: 180s
        for:
          condition:
            name: Ready
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: hermes-agent
        name: hermes-other
        timeout: 180s
        for:
          condition:
            name: Ready
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: langfuse-outside
        name: spoof
        timeout: 180s
        for:
          condition:
            name: Ready
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: langfuse-outside
        name: outside
        timeout: 180s
        for:
          condition:
            name: Ready
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: langfuse
        name: tunnel
        timeout: 180s
        for:
          condition:
            name: Ready
  - name: network-policy
    try:
    - script:
        timeout: 360s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" network_policy'
  - name: ingest-and-auth
    try:
    - script:
        timeout: 300s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" ingest'
  - name: usage-view-job-complete
    try:
    - wait:
        apiVersion: batch/v1
        kind: Job
        namespace: langfuse
        name: langfuse-usage-view
        timeout: 600s
        for:
          condition:
            name: Complete
    catch:
    - script:
        timeout: 30s
        content: |
          kubectl logs -n langfuse job/langfuse-usage-view || true
          "${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" diagnose
  - name: usage-view-probes
    skipDelete: true
    try:
    - apply:
        timeout: 60s
        file: usage-view-probes.yaml
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: monitoring
        name: grafana-allowed
        timeout: 180s
        for:
          condition:
            name: Ready
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: monitoring
        name: grafana-other
        timeout: 180s
        for:
          condition:
            name: Ready
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: langfuse-outside
        name: grafana-spoof
        timeout: 180s
        for:
          condition:
            name: Ready
  - name: usage-view
    try:
    - script:
        timeout: 660s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" usage_view'
  - name: mcp-readonly-proxy
    try:
    - script:
        timeout: 300s
        content: |
          "${REPO_ROOT}/tests/chainsaw/langfuse/mcp-proxy-unit.sh"
          "${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" mcp_readonly_proxy
  - name: access-oidc-login
    try:
    - script:
        timeout: 300s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" oidc'
  - name: retention
    try:
    - script:
        timeout: 900s
        content: '"${REPO_ROOT}/tests/chainsaw/langfuse/dynamic-checks.sh" retention'
