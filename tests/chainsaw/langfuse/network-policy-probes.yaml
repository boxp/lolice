apiVersion: v1
kind: Namespace
metadata:
  name: hermes-agent
---
apiVersion: v1
kind: Namespace
metadata:
  name: langfuse-outside
---
apiVersion: v1
kind: Pod
metadata:
  name: hermes-allowed
  namespace: hermes-agent
  labels:
    app: hermes-agent
    chainsaw-probe: "true"
spec:
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: python:3.13-alpine
      command: ["python", "-c", "import time; time.sleep(3600)"]
---
apiVersion: v1
kind: Pod
metadata:
  name: hermes-other
  namespace: hermes-agent
  labels:
    app: other
    chainsaw-probe: "true"
spec:
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: python:3.13-alpine
      command: ["python", "-c", "import time; time.sleep(3600)"]
---
apiVersion: v1
kind: Pod
metadata:
  name: spoof
  namespace: langfuse-outside
  labels:
    app: hermes-agent
    chainsaw-probe: "true"
spec:
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: python:3.13-alpine
      command: ["python", "-c", "import time; time.sleep(3600)"]
---
apiVersion: v1
kind: Pod
metadata:
  name: tunnel
  namespace: langfuse
  labels:
    app: langfuse-cloudflared
    chainsaw-probe: "true"
spec:
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: python:3.13-alpine
      command: ["python", "-c", "import time; time.sleep(3600)"]
---
apiVersion: v1
kind: Pod
metadata:
  name: outside
  namespace: langfuse-outside
  labels:
    app: outside
spec:
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  containers:
    - name: server
      image: python:3.13-alpine
      command: ["python", "-m", "http.server", "443"]
---
apiVersion: v1
kind: Service
metadata:
  name: outside
  namespace: langfuse-outside
spec:
  selector:
    app: outside
  ports:
    - port: 443
