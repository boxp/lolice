apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: external-secrets-operator-dynamic-validation
spec:
  description: |
    External Secrets Operator の起動と ClusterSecretStore 作成を動的に検証する。
    ESO Helm インストールと ClusterSecretStore overlay の適用は GHA ワークフロー側で実施済み。
  steps:
  - name: require-isolated-kind
    try:
    - script:
        timeout: 15s
        content: |
          set -eu
          case "${CHAINSAW_KIND_CONTEXT:-}" in
            kind-*) ;;
            *) echo "An explicit isolated kind context is required; this suite is not read-only." >&2; exit 1 ;;
          esac
          : "${CHAINSAW_KIND_KUBECONFIG:?An isolated kubeconfig is required}"
          test -r "$CHAINSAW_KIND_KUBECONFIG"
          test "$(kubectl --kubeconfig "$CHAINSAW_KIND_KUBECONFIG" config current-context)" = "$CHAINSAW_KIND_CONTEXT"
          expected_server="$(kubectl --kubeconfig "$CHAINSAW_KIND_KUBECONFIG" config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          actual_server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          test -n "$expected_server"
          test "$actual_server" = "$expected_server"
  - name: wait-for-eso-ready
    try:
    - script:
        timeout: 180s
        content: |
          set -e
          echo "=== ESO Deployment の起動待機 ==="
          kubectl wait deployment \
            -n external-secrets \
            --all \
            --for=condition=Available \
            --timeout=120s

          echo "=== 実行中の Pod 確認 ==="
          kubectl get pods -n external-secrets
          echo "ESO 動的検証: オペレーター Available"

  - name: verify-cluster-secret-store
    try:
    - script:
        timeout: 60s
        content: |
          set -e
          echo "=== ClusterSecretStore の存在確認 ==="
          kubectl get clustersecretstore parameterstore -o yaml
          echo "ClusterSecretStore 動的検証: リソース作成確認"

          echo "=== ESO Application yaml の実適用 ==="
          kubectl apply --server-side --force-conflicts \
            -f "${REPO_ROOT}/argoproj/external-secrets-operator/application.yaml"
          echo "ArgoCD Application リソース作成完了"
