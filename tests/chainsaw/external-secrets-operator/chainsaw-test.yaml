apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: external-secrets-operator-dynamic-validation
spec:
  description: |
    External Secrets Operator の起動と ClusterSecretStore 作成を動的に検証する。
    ESO Helm インストールと ClusterSecretStore overlay の適用は GHA ワークフロー側で実施済み。
  steps:
  - name: require-isolated-kind
    try:
    - script:
        timeout: 15s
        content: '"${REPO_ROOT}/tests/workflows/require-isolated-kind.sh"'
  - name: wait-for-eso-ready
    try:
    - wait:
        apiVersion: apps/v1
        kind: Deployment
        namespace: external-secrets
        timeout: 120s
        for:
          condition:
            name: Available
    finally:
    - get:
        apiVersion: v1
        kind: Pod
        namespace: external-secrets
  - name: verify-cluster-secret-store
    try:
    - assert:
        timeout: 60s
        resource:
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata:
            name: parameterstore
  - name: apply-application-yaml
    description: |
      native apply は Create/MergePatch で strict field validation がなく、test 後に削除も
      するので、本番 Application の検証は kubectl の server-side apply のまま行う。
    try:
    - command:
        timeout: 60s
        entrypoint: kubectl
        args:
        - apply
        - --server-side
        - --force-conflicts
        - -f
        - $REPO_ROOT/argoproj/external-secrets-operator/application.yaml
