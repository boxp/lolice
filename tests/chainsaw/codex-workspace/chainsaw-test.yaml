apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: codex-workspace-metrics
spec:
  description: |
    BOXP-364: 生成 ConfigMap 参照不整合 (MountVolume.SetUp failed: configmap
    "codex-workspace-ai-ops-metrics" not found) の再発防止テスト。
    本番の kustomize render から Namespace・生成 ConfigMap (codex-workspace-ai-ops-metrics-<hash>)・
    Deployment の ai-ops-metrics container と ai-ops-metrics-app volume を render 後の名前のまま
    取り出し (render-minimal.sh)、kind 上で volume が mount されて server.py が起動し
    /healthz と /metrics に応答するまでを確認する。namespace 指定漏れで参照が hash 無しのまま
    render されると、抽出時点か Pod の mount 失敗で Available にならず失敗する。
    workspace 本体 / DIND / SSH / Secret / 本番 PVC は持ち込まず、home は emptyDir と stub ledger に置き換える。
  steps:
  - name: require-isolated-kind
    try:
    - script:
        timeout: 15s
        content: '"${REPO_ROOT}/tests/workflows/require-isolated-kind.sh"'

  - name: render-and-apply-minimal-manifest
    try:
    - script:
        timeout: 120s
        content: '"${REPO_ROOT}/tests/chainsaw/codex-workspace/render-and-apply.sh"'
    cleanup:
    # kind は job ごとに破棄するので削除完了は待たない (python の PID 1 は SIGTERM で
    # 止まらず、待つと terminationGracePeriodSeconds の 30s がそのまま critical path に乗る)。
    # namespace は消さない。並列の langfuse suite が同じ namespace で ESO を確認している。
    # native delete は完了を待つため kubectl のまま使う。
    - command:
        timeout: 30s
        entrypoint: kubectl
        args: [delete, deployment, codex-workspace, -n, codex-workspace, --ignore-not-found, --wait=false]

  - name: deployment-available
    try:
    - wait:
        apiVersion: apps/v1
        kind: Deployment
        namespace: codex-workspace
        name: codex-workspace
        timeout: 180s
        for:
          condition:
            name: Available
    catch:
    - describe:
        apiVersion: v1
        kind: Pod
        namespace: codex-workspace
    - events:
        namespace: codex-workspace

  - name: metrics-endpoints-respond
    try:
    - script:
        timeout: 30s
        content: kubectl exec -i -n codex-workspace deployment/codex-workspace -c ai-ops-metrics -- python - < metrics-probe.py

# BOXP-475 main verification (do not merge)
