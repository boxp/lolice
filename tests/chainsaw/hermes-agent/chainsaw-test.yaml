apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: hermes-langfuse-observer
spec:
  description: |
    本番 render の observer plugin を synthetic driver で動かし、鍵なしの非送信、後発の鍵での送信開始、
    同一 Pod の継続、機密値の非送信、無害な本文の送信、sink 停止時の producer 継続を時系列どおりに確認する。
  steps:
  - name: require-isolated-kind
    try:
    - script:
        timeout: 15s
        content: '"${REPO_ROOT}/tests/workflows/require-isolated-kind.sh"'

  - name: deploy-fixture-without-key
    try:
    - script:
        timeout: 120s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/scenario.sh" deploy_fixture'
    - wait:
        apiVersion: apps/v1
        kind: Deployment
        namespace: hermes-langfuse-fixture
        name: sink
        timeout: 120s
        for:
          condition:
            name: Available
    - wait:
        apiVersion: apps/v1
        kind: Deployment
        namespace: hermes-langfuse-fixture
        name: driver
        timeout: 120s
        for:
          condition:
            name: Available
    catch:
    - script:
        content: echo 'FAIL Secret 無しで Pod が起動しない' >&2
    cleanup:
    # namespace の削除完了は待たない (native delete は完了まで待つ)。
    - command:
        timeout: 30s
        entrypoint: kubectl
        args: [delete, namespace, hermes-langfuse-fixture, --ignore-not-found, --wait=false]

  - name: keyless-rounds-do-not-send
    try:
    - script:
        timeout: 120s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/scenario.sh" keyless_rounds_do_not_send'

  - name: late-key-starts-sending-without-restart
    try:
    - script:
        timeout: 15s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/scenario.sh" create_ingest_key'
    - script:
        timeout: 210s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/scenario.sh" late_key_starts_sending'

  - name: secrets-stay-out-of-sink
    try:
    - script:
        timeout: 30s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/scenario.sh" secrets_withheld'

  - name: harmless-bodies-delivered
    try:
    - script:
        timeout: 120s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/scenario.sh" harmless_bodies_delivered'

  - name: sink-stopped-producer-continues
    try:
    - patch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: sink
            namespace: hermes-langfuse-fixture
          spec:
            replicas: 0
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: hermes-langfuse-fixture
        selector: app=sink
        timeout: 60s
        for:
          deletion: {}
    - script:
        timeout: 60s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/scenario.sh" producer_continues_without_sink'
# BOXP-474 計測用 (merge しない)
