apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: hermes-alertmanager-relay
spec:
  # BOXP-462: the production Alertmanager config sends notify_hermes="true" alerts
  # (and only those) to the Hermes `alertmanager` route with the route token, and
  # the production relay script turns the real payload into the Telegram text.
  steps:
  - name: require-isolated-kind
    try:
    - script:
        timeout: 15s
        content: '"${REPO_ROOT}/tests/workflows/require-isolated-kind.sh"'

  - name: deploy-fixture
    try:
    - script:
        timeout: 60s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/alertmanager-relay/scenario.sh" deploy_fixture'
    - wait:
        apiVersion: apps/v1
        kind: Deployment
        namespace: alertmanager-relay-fixture
        name: alertmanager
        timeout: 180s
        for:
          condition:
            name: Available
    - wait:
        apiVersion: apps/v1
        kind: Deployment
        namespace: alertmanager-relay-fixture
        name: hermes-sink
        timeout: 180s
        for:
          condition:
            name: Available
    - wait:
        apiVersion: apps/v1
        kind: Deployment
        namespace: alertmanager-relay-fixture
        name: relay
        timeout: 180s
        for:
          condition:
            name: Available
    cleanup:
    - command:
        timeout: 30s
        entrypoint: kubectl
        args: [delete, namespace, alertmanager-relay-fixture, --ignore-not-found, --wait=false]

  - name: alerts-reach-hermes-route
    try:
    - script:
        timeout: 60s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/alertmanager-relay/scenario.sh" inject_alerts'
    - script:
        timeout: 210s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/alertmanager-relay/scenario.sh" await_delivery'
    - script:
        timeout: 30s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/alertmanager-relay/scenario.sh" routing'

  - name: relay-formats-real-payload
    try:
    - script:
        timeout: 60s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/alertmanager-relay/scenario.sh" relay_formats_payload'

  - name: relay-drops-foreign-payload
    try:
    - script:
        timeout: 30s
        content: '"${REPO_ROOT}/tests/chainsaw/hermes-agent/alertmanager-relay/scenario.sh" relay_drops_foreign_payload'
